<!doctype html>
<html lang="ru">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#7d1111">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Rust Mobile [WEB]</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }


    /* ===== RUST MOBILE MENU ===== */

    #rustMenu {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      justify-content: flex-end;
      align-items: flex-start;

      padding:
        calc(env(safe-area-inset-top) + 45px)
        calc(env(safe-area-inset-right) + 7vw);

      background:
        linear-gradient(
          135deg,
          #101010 0%,
          #1b1111 45%,
          #541010 100%
        );

      overflow: hidden;
    }

    #rustMenu::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;

      background:
        repeating-linear-gradient(
          135deg,
          white 0px,
          white 2px,
          transparent 2px,
          transparent 45px
        );
    }

    #rustMenuContent {
      position: relative;
      z-index: 2;
      width: min(390px, 84vw);
      text-align: right;
    }

    #rustTitle {
      margin: 0;
      color: #fff;

      font-size: clamp(28px, 6vw, 48px);
      font-weight: 900;
      letter-spacing: 0.05em;
      line-height: 1.05;

      text-shadow: 4px 4px 0 #a50f14;
    }

    #rustLine {
      width: 100%;
      height: 3px;

      margin: 18px 0 30px;

      background: #d71920;

      box-shadow:
        0 0 15px rgba(215, 25, 32, 0.6);
    }

    .rustMenuButton {
      width: 100%;

      padding: 18px 22px;
      margin: 8px 0;

      border: 1px solid rgba(255,255,255,0.22);
      border-right: 5px solid #d71920;
      border-radius: 4px;

      background: rgba(20,20,20,0.88);

      color: white;

      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-align: right;

      transition:
        transform 0.12s,
        background 0.12s;
    }

    .rustMenuButton:active {
      transform: scale(0.96);
      background: #b51218;
    }


    /* ===== НАСТРОЙКИ ===== */

    #rustSettings {
      display: none;

      margin-top: 15px;
      padding: 18px;

      background: rgba(10,10,10,0.94);

      border: 1px solid rgba(255,255,255,0.2);
      border-right: 4px solid #d71920;
    }

    #rustSettingsTitle {
      margin-bottom: 13px;

      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    #graphicsButtons {
      display: flex;
      gap: 8px;
    }

    .graphicsButton {
      flex: 1;

      padding: 12px 5px;

      border: 1px solid #555;
      border-radius: 4px;

      background: #222;
      color: white;

      font-weight: 700;
    }

    .graphicsButton.active {
      background: #d71920;
      border-color: white;
    }

    #rustVersion {
      position: absolute;

      right:
        calc(env(safe-area-inset-right) + 7vw);

      bottom:
        calc(env(safe-area-inset-bottom) + 20px);

      color: rgba(255,255,255,0.4);

      font-size: 11px;
      letter-spacing: 0.1em;
    }


    /* ===== ТЕЛЕФОН ===== */

    @media (max-width: 500px) {

      #rustMenu {
        padding-top:
          calc(env(safe-area-inset-top) + 30px);

        padding-right: 6vw;
      }

      #rustTitle {
        font-size: 29px;
      }

      .rustMenuButton {
        padding: 16px 18px;
        font-size: 14px;
      }
    }

  </style>

</head>

<body>


  <!-- ===== ГЛАВНОЕ МЕНЮ ===== -->

  <div id="rustMenu">

    <div id="rustMenuContent">

      <h1 id="rustTitle">
        RUST MOBILE [WEB]
      </h1>

      <div id="rustLine"></div>

      <button
        class="rustMenuButton"
        id="rustPlayButton"
      >
        ИГРАТЬ
      </button>

      <button
        class="rustMenuButton"
        id="rustSettingsButton"
      >
        НАСТРОЙКИ
      </button>

      <div id="rustSettings">

        <div id="rustSettingsTitle">
          КАЧЕСТВО ГРАФИКИ
        </div>

        <div id="graphicsButtons">

          <button
            class="graphicsButton"
            id="graphicsLow"
          >
            НИЗКАЯ
          </button>

          <button
            class="graphicsButton active"
            id="graphicsMax"
          >
            МАКСИМАЛЬНАЯ
          </button>

        </div>

      </div>

    </div>

    <div id="rustVersion">
      RUST MOBILE [WEB] • v1.0
    </div>

  </div>


  <!-- ===== ИГРА ===== -->

  <div id="app"></div>
    <script>

    /* =========================
       RUST MOBILE MENU
       ЧАСТЬ 2
    ========================= */

    const rustMenu = document.getElementById("rustMenu");

    const rustPlayButton =
      document.getElementById("rustPlayButton");

    const rustSettingsButton =
      document.getElementById("rustSettingsButton");

    const rustSettings =
      document.getElementById("rustSettings");

    const graphicsLow =
      document.getElementById("graphicsLow");

    const graphicsMax =
      document.getElementById("graphicsMax");


    /* =========================
       НАСТРОЙКИ
    ========================= */

    let graphicsQuality = "max";


    rustSettingsButton.addEventListener("click", () => {

      if (rustSettings.style.display === "block") {

        rustSettings.style.display = "none";

      } else {

        rustSettings.style.display = "block";

      }

    });


    graphicsLow.addEventListener("click", () => {

      graphicsQuality = "low";

      graphicsLow.classList.add("active");
      graphicsMax.classList.remove("active");

      localStorage.setItem(
        "rustGraphics",
        "low"
      );

    });


    graphicsMax.addEventListener("click", () => {

      graphicsQuality = "max";

      graphicsMax.classList.add("active");
      graphicsLow.classList.remove("active");

      localStorage.setItem(
        "rustGraphics",
        "max"
      );

    });


    /* =========================
       ЗАГРУЗКА НАСТРОЕК
    ========================= */

    const savedGraphics =
      localStorage.getItem("rustGraphics");


    if (savedGraphics === "low") {

      graphicsQuality = "low";

      graphicsLow.classList.add("active");
      graphicsMax.classList.remove("active");

    }


    /* =========================
       КНОПКА ИГРАТЬ
    ========================= */

    rustPlayButton.addEventListener("click", async () => {

      rustMenu.style.display = "none";

      document.body.style.overflow = "hidden";

      try {

        if (document.documentElement.requestFullscreen) {

          await document.documentElement.requestFullscreen();

        }

      } catch (error) {

        console.log(
          "Fullscreen недоступен"
        );

      }


      /*

        Сообщаем игре,
        что меню закрыто.

      */

      window.dispatchEvent(
        new Event("rustGameStart")
      );

    });


    /* =========================
       ЗАПУСК ИГРЫ
    ========================= */

    let rustGameStarted = false;


    window.addEventListener(
      "rustGameStart",
      () => {

        rustGameStarted = true;

        console.log(
          "RUST MOBILE: игра запущена"
        );

      }
    );


    /* =========================
       ПОВТОРНОЕ ОТКРЫТИЕ МЕНЮ
       ESC НА ПК
    ========================= */

    document.addEventListener(
      "keydown",
      (event) => {

        if (event.code === "Escape") {

          if (rustGameStarted) {

            rustMenu.style.display =
              rustMenu.style.display === "none"
                ? "flex"
                : "none";

          }

        }

      }
    );

  </script>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">

    import * as THREE from "three";

    /* =========================
       RUST MOBILE WEB
       ЧАСТЬ 3
    ========================= */

    const scene = new THREE.Scene();

    scene.background =
      new THREE.Color(0x9fc0d8);

    scene.fog =
      new THREE.Fog(
        0x9fc0d8,
        55,
        150
      );


    /* =========================
       КАМЕРА
    ========================= */

    const camera =
      new THREE.PerspectiveCamera(
        72,
        window.innerWidth /
          window.innerHeight,
        0.05,
        400
      );


    /* =========================
       RENDERER
    ========================= */

    const renderer =
      new THREE.WebGLRenderer({
        antialias: false,
        powerPreference:
          "high-performance"
      });

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        1.7
      )
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    document
      .getElementById("app")
      .appendChild(
        renderer.domElement
      );


    /* =========================
       СВЕТ
    ========================= */

    const hemi =
      new THREE.HemisphereLight(
        0xcfe6ff,
        0x3d4a2a,
        1.0
      );

    scene.add(hemi);


    const sun =
      new THREE.DirectionalLight(
        0xfff0cf,
        1.15
      );

    sun.position.set(
      40,
      70,
      25
    );

    scene.add(sun);


    /* =========================
       RESIZE
    ========================= */

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.setPixelRatio(
          graphicsQuality === "low"
            ? 1
            : Math.min(
                window.devicePixelRatio,
                1.7
              )
        );

      }
    );


    /* =========================
       ИГРОК
    ========================= */

    const player = {

      pos:
        new THREE.Vector3(
          0,
          0,
          6
        ),

      yaw: 0,

      pitch: 0,

      speed: 5.2,

      eye: 1.7

    };


    /* =========================
       ЗЕМЛЯ
    ========================= */

    const WORLD = 120;

    const WATER_Y = -2.2;


    function terrainHeight(x, z) {

      let h =
        Math.sin(
          x * 0.045
        ) * 2.4 +

        Math.cos(
          z * 0.05
        ) * 2.2 +

        Math.sin(
          (x + z) * 0.021
        ) * 3.4;


      h +=
        Math.sin(
          x * 0.12
        ) * 0.35;

      h +=
        Math.cos(
          z * 0.14
        ) * 0.35;


      const river =
        Math.exp(
          -Math.pow(
            (
              z -
              Math.sin(
                x * 0.03
              ) * 12
            ) / 8,
            2
          )
        ) * 6.5;


      h -= river;


      const d =
        Math.sqrt(
          x * x +
          z * z
        );


      h -=
        Math.max(
          0,
          (d - 88) * 0.5
        );


      return h;

    }


    const terrainGeometry =
      new THREE.PlaneGeometry(
        WORLD * 2,
        WORLD * 2,
        140,
        140
      );


    terrainGeometry.rotateX(
      -Math.PI / 2
    );


    const positions =
      terrainGeometry
        .attributes
        .position;


    const colors = [];


    const grass =
      new THREE.Color(
        0x5f8f3e
      );

    const dry =
      new THREE.Color(
        0x8d9a4d
      );

    const dirt =
      new THREE.Color(
        0x7a6244
      );

    const rock =
      new THREE.Color(
        0x8a8b86
      );

    const sand =
      new THREE.Color(
        0xcbbd8d
      );


    for (
      let i = 0;
      i < positions.count;
      i++
    ) {

      const x =
        positions.getX(i);

      const z =
        positions.getZ(i);

      const y =
        terrainHeight(
          x,
          z
        );

      positions.setY(
        i,
        y
      );


      let color;


      if (
        y <
        WATER_Y + 0.7
      ) {

        color = sand;

      } else if (
        y > 7
      ) {

        color = rock;

      } else if (
        y > 4.5
      ) {

        color = dirt;

      } else {

        color =
          Math.sin(
            x * 0.05
          ) +
          Math.cos(
            z * 0.04
          ) >
          0.6
            ? dry
            : grass;

      }


      colors.push(
        color.r,
        color.g,
        color.b
      );

    }


    terrainGeometry.setAttribute(
      "color",
      new THREE.Float32BufferAttribute(
        colors,
        3
      )
    );


    terrainGeometry
      .computeVertexNormals();


    const terrain =
      new THREE.Mesh(
        terrainGeometry,

        new THREE.MeshLambertMaterial({
          vertexColors: true
        })
      );


    scene.add(terrain);


    /* =========================
       ВОДА
    ========================= */

    const water =
      new THREE.Mesh(

        new THREE.PlaneGeometry(
          WORLD * 2.4,
          WORLD * 2.4
        ),

        new THREE.MeshLambertMaterial({
          color: 0x2f6f86,
          transparent: true,
          opacity: 0.78
        })

      );


    water.rotation.x =
      -Math.PI / 2;

    water.position.y =
      WATER_Y;

    scene.add(water);
        /* =========================
       ЧАСТЬ 4
       РЕСУРСЫ
    ========================= */

    const resources = [];


    const materials = {

      bark:
        new THREE.MeshLambertMaterial({
          color: 0x6b4b30
        }),

      leaves:
        new THREE.MeshLambertMaterial({
          color: 0x3f7a34
        }),

      pine:
        new THREE.MeshLambertMaterial({
          color: 0x2f5c33
        }),

      birch:
        new THREE.MeshLambertMaterial({
          color: 0xcfc9b4
        }),

      stone:
        new THREE.MeshLambertMaterial({
          color: 0x8b8d88,
          flatShading: true
        }),

      iron:
        new THREE.MeshLambertMaterial({
          color: 0xa9744a,
          flatShading: true
        }),

      copper:
        new THREE.MeshLambertMaterial({
          color: 0x39a08a,
          flatShading: true
        })

    };


    function bumpySphere(
      radius,
      detail = 1
    ) {

      const geometry =
        new THREE.IcosahedronGeometry(
          radius,
          detail
        );

      const p =
        geometry.attributes.position;


      for (
        let i = 0;
        i < p.count;
        i++
      ) {

        const x = p.getX(i);
        const y = p.getY(i);
        const z = p.getZ(i);


        const n =
          1 +
          Math.sin(x * 5) *
          Math.cos(y * 4) *
          Math.sin(z * 6) *
          0.18;


        p.setXYZ(
          i,
          x * n,
          y * n,
          z * n
        );

      }


      geometry.computeVertexNormals();

      return geometry;

    }


    function addResource(
      group,
      type,
      name,
      hp,
      drop
    ) {

      group.position.y =
        terrainHeight(
          group.position.x,
          group.position.z
        );


      scene.add(group);


      resources.push({

        group,

        type,

        name,

        hp,

        maxHp: hp,

        drop,

        alive: true,

        radius:
          type === "tree"
            ? 1.1
            : 1.3

      });


      return group;

    }


    /* =========================
       ДЕРЕВО
    ========================= */

    function makeTree(
      x,
      z
    ) {

      const tree =
        new THREE.Group();


      tree.position.set(
        x,
        0,
        z
      );


      const trunk =
        new THREE.Mesh(

          new THREE.CylinderGeometry(
            0.25,
            0.45,
            4,
            7
          ),

          materials.bark

        );


      trunk.position.y =
        2;


      tree.add(trunk);


      for (
        let i = 0;
        i < 3;
        i++
      ) {

        const crown =
          new THREE.Mesh(

            new THREE.ConeGeometry(
              2.2 - i * 0.45,
              2.4,
              7
            ),

            materials.pine

          );


        crown.position.y =
          3.2 +
          i * 1.25;


        tree.add(crown);

      }


      tree.rotation.y =
        Math.random() * 6.28;


      tree.scale.setScalar(
        0.85 +
        Math.random() * 0.4
      );


      return addResource(
        tree,
        "tree",
        "Дерево",
        5,
        "wood"
      );

    }


    /* =========================
       РУДА
    ========================= */

    function makeOre(
      x,
      z,
      type
    ) {

      const group =
        new THREE.Group();


      group.position.set(
        x,
        0,
        z
      );


      const base =
        new THREE.Mesh(

          bumpySphere(
            1.2,
            1
          ),

          materials.stone

        );


      base.scale.y =
        0.7;


      base.position.y =
        0.6;


      group.add(base);


      let material =
        materials.stone;


      let name =
        "Камень";


      let drop =
        "stone";


      if (
        type === "iron"
      ) {

        material =
          materials.iron;

        name =
          "Железная руда";

        drop =
          "iron";

      }


      if (
        type === "copper"
      ) {

        material =
          materials.copper;

        name =
          "Медная руда";

        drop =
          "copper";

      }


      if (
        type !== "stone"
      ) {

        for (
          let i = 0;
          i < 5;
          i++
        ) {

          const ore =
            new THREE.Mesh(

              bumpySphere(
                0.25,
                0
              ),

              material

            );


          ore.position.set(

            -0.7 +
              Math.random() * 1.4,

            0.5 +
              Math.random() * 0.7,

            -0.7 +
              Math.random() * 1.4

          );


          group.add(ore);

        }

      }


      return addResource(
        group,
        "ore",
        name,
        type === "stone"
          ? 4
          : 6,
        drop
      );

    }


    /* =========================
       РАСПРЕДЕЛЕНИЕ
    ========================= */

    function land(
      x,
      z
    ) {

      return (
        terrainHeight(
          x,
          z
        ) >
        WATER_Y + 0.6
      );

    }


    function randomPosition() {

      let x;
      let z;

      do {

        x =
          -82 +
          Math.random() * 164;

        z =
          -82 +
          Math.random() * 164;

      } while (
        !land(x, z) ||
        Math.hypot(x, z) < 8
      );


      return {
        x,
        z
      };

    }


    /* =========================
       СОЗДАЁМ ДЕРЕВЬЯ
    ========================= */

    for (
      let i = 0;
      i < 90;
      i++
    ) {

      const p =
        randomPosition();

      makeTree(
        p.x,
        p.z
      );

    }


    /* =========================
       КАМНИ
    ========================= */

    for (
      let i = 0;
      i < 18;
      i++
    ) {

      const p =
        randomPosition();

      makeOre(
        p.x,
        p.z,
        "stone"
      );

    }


    /* =========================
       ЖЕЛЕЗО
    ========================= */

    for (
      let i = 0;
      i < 10;
      i++
    ) {

      const p =
        randomPosition();

      makeOre(
        p.x,
        p.z,
        "iron"
      );

    }


    /* =========================
       МЕДЬ
    ========================= */

    for (
      let i = 0;
      i < 8;
      i++
    ) {

      const p =
        randomPosition();

      makeOre(
        p.x,
        p.z,
        "copper"
      );

    }
        /* =========================
       ЧАСТЬ 5 — ИГРОК
    ========================= */

    player.pos.set(
      0,
      terrainHeight(0, 6),
      6
    );

    const move = {
      x: 0,
      y: 0
    };

    let joystickId = null;

    const joystickSize = 128;
    const joystickRadius = 52;

    const joystick =
      document.createElement("div");

    joystick.id = "mobileJoystick";

    joystick.innerHTML =
      '<div id="joystickKnob"></div>';

    Object.assign(
      joystick.style,
      {
        position: "fixed",
        left: "20px",
        bottom: "110px",
        width: joystickSize + "px",
        height: joystickSize + "px",
        borderRadius: "50%",
        background: "rgba(20,20,20,.55)",
        border: "2px solid rgba(255,255,255,.25)",
        zIndex: "100",
        touchAction: "none"
      }
    );

    const knob =
      joystick.querySelector(
        "#joystickKnob"
      );

    Object.assign(
      knob.style,
      {
        position: "absolute",
        width: "55px",
        height: "55px",
        left: "50%",
        top: "50%",
        transform:
          "translate(-50%,-50%)",
        borderRadius: "50%",
        background:
          "rgba(210,210,210,.5)",
        border:
          "1px solid rgba(255,255,255,.5)"
      }
    );

    document.body.appendChild(
      joystick
    );


    function updateJoystick(e) {

      const rect =
        joystick.getBoundingClientRect();

      let dx =
        e.clientX -
        (rect.left +
          rect.width / 2);

      let dy =
        e.clientY -
        (rect.top +
          rect.height / 2);


      const distance =
        Math.hypot(dx, dy);


      if (
        distance >
        joystickRadius
      ) {

        dx =
          dx /
          distance *
          joystickRadius;

        dy =
          dy /
          distance *
          joystickRadius;

      }


      move.x =
        dx /
        joystickRadius;

      move.y =
        -dy /
        joystickRadius;


      knob.style.transform =
        `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

    }


    joystick.addEventListener(
      "pointerdown",
      (e) => {

        e.preventDefault();

        joystickId =
          e.pointerId;

        joystick.setPointerCapture(
          e.pointerId
        );

        updateJoystick(e);

      }
    );


    joystick.addEventListener(
      "pointermove",
      (e) => {

        if (
          e.pointerId !==
          joystickId
        ) return;

        e.preventDefault();

        updateJoystick(e);

      }
    );


    function stopJoystick(e) {

      if (
        e.pointerId !==
        joystickId
      ) return;

      joystickId = null;

      move.x = 0;
      move.y = 0;

      knob.style.transform =
        "translate(-50%,-50%)";

    }


    joystick.addEventListener(
      "pointerup",

    );

        /* =========================
       ЧАСТЬ 6 — КАМЕРА
    ========================= */

    let lookId = null;

    let lastLookX = 0;
    let lastLookY = 0;

    const cameraSensitivity =
      0.0032;


    window.addEventListener(
      "pointerdown",
      (e) => {

        if (!rustGameStarted)
          return;

        if (
          e.target.closest(
            "#mobileJoystick"
          )
        ) return;

        if (
          e.target.closest(
            "button"
          )
        ) return;

        /*
          Камера работает
          только справа.
        */

        if (
          e.clientX <
          window.innerWidth * 0.42
        ) return;


        lookId =
          e.pointerId;

        lastLookX =
          e.clientX;

        lastLookY =
          e.clientY;

      },
      {
        passive: false
      }
    );


    window.addEventListener(
      "pointermove",
      (e) => {

        if (
          e.pointerId !==
          lookId
        ) return;


        const dx =
          e.clientX -
          lastLookX;

        const dy =
          e.clientY -
          lastLookY;


        lastLookX =
          e.clientX;

        lastLookY =
          e.clientY;


        player.yaw -=
          dx *
          cameraSensitivity;


        player.pitch =
          Math.max(
            -1.396,
            Math.min(
              1.396,
              player.pitch -
                dy *
                cameraSensitivity
            )
          );

      },
      {
        passive: false
      }
    );


    window.addEventListener(
      "pointerup",
      (e) => {

        if (
          e.pointerId ===
          lookId
        ) {

          lookId = null;

        }

      }
    );


    window.addEventListener(
      "pointercancel",
      (e) => {

        if (
          e.pointerId ===
          lookId
        ) {

          lookId = null;

        }

      }
    );

    const keys = {};


    window.addEventListener(
      "keydown",
      (e) => {

        keys[e.code] = true;

    );

      (e) => {

        keys[e.code] = false;

      }
    );


    function updatePlayer(dt) {

      if (
        !rustGameStarted
      ) return;


      let mx =
        move.x;

      let mz =
        move.y;


      /*
        Управление с клавиатуры
      */

      if (
        keys["KeyW"]
      ) mz += 1;

      if (
        keys["KeyS"]
      ) mz -= 1;

      if (
        keys["KeyA"]
      ) mx -= 1;

      if (
        keys["KeyD"]
      ) mx += 1;


      const length =
        Math.hypot(
          mx,
          mz
        );


      if (
        length > 0.05
      ) {

        mx /=
          Math.max(
            1,
            length
          );

        mz /=
          Math.max(
            1,
            length
          );


        const sin =
          Math.sin(
            player.yaw
          );

        const cos =
          Math.cos(
            player.yaw
          );


        /*
          Направление
          относительно камеры
        */

        const dx =
          -sin * mz +
          cos * mx;

        const dz =
          -cos * mz -
          sin * mx;


        const newX =
          player.pos.x +
          dx *
          player.speed *
          dt;


        const newZ =
          player.pos.z +
          dz *
          player.speed *
          dt;


        /*
          Не даём выйти
          за пределы карты.
        */

        if (
          Math.hypot(
            newX,
            newZ
          ) < 92
        ) {

          if (
            terrainHeight(
              newX,
              newZ
            ) >
            WATER_Y - 0.8
          ) {

            player.pos.x =
              newX;

            player.pos.z =
              newZ;

          }

        }

      }


      /*
        Высота игрока
        следует за землёй.
      */

      const ground =
        terrainHeight(
          player.pos.x,
          player.pos.z
        );


      player.pos.y =
        ground;


      /*
        Камера от первого лица
      */

      camera.position.set(

        player.pos.x,

        player.pos.y +
          player.eye,

        player.pos.z

      );


      camera.rotation.order =
        "YXZ";


      camera.rotation.y =
        player.yaw;


      camera.rotation.x =
        player.pitch;

    }

    function updateInventory() {

    function getTargetResource() {

      const origin =
        camera.getWorldPosition(
          new THREE.Vector3()
        );


      const direction =
        new THREE.Vector3(
          0,
          0,
          -1
        );


      direction.applyQuaternion(
        camera.quaternion
      );


      let target = null;

      let bestDistance = 4.2;


      for (
        const resource
        of resources
      ) {

        if (
          !resource.alive
        ) continue;


        const center =
          resource.group
            .position
            .clone();


        center.y += 1;


        const to =
          center
            .sub(origin);


        const distance =
          to.length();


        if (
          distance >
          bestDistance +
          resource.radius
        ) continue;


        const projection =
          to.dot(direction);


        if (
          projection <= 0
        ) continue;


        const closest =
          direction
            .clone()
            .multiplyScalar(
              projection
            );


        const perpendicular =
          to
            .sub(closest)
            .length();


        if (
          perpendicular <
          resource.radius +
          0.5
        ) {

          target =
            resource;

          bestDistance =
            distance;

        }

      }


      return target;

    }


    function gatherResource() {

      if (
        !rustGameStarted
      ) return;


      const resource =
        getTargetResource();


      if (
        !resource
      ) {

        return;

      }


      resource.hp--;


      const drop =
        resource.drop;


      inventory[drop]++;


      if (
        resource.hp <= 0
      ) {

        resource.alive =
          false;

        scene.remove(
          resource.group
        );

        inventory[drop] += 2;

      }


      updateInventory();

    }

      .getElementById(
        "gatherButton"
      )
      .addEventListener(
        "pointerdown",
        (e) => {

          e.preventDefault();

          gatherResource();

        }

function updateBears(dt) {

  for (const bear of bears) {

    if (!bear.alive) continue;

    const p = bear.group.position;

    const dx =
      player.pos.x - p.x;

    const dz =
      player.pos.z - p.z;

    const distance =
      Math.hypot(dx, dz);


    /* Медведь замечает игрока */

    if (
      player.alive &&
      distance < 16
    ) {

      bear.state = "chase";

    }


    /* Медведь перестаёт преследовать */

    if (
      bear.state === "chase" &&
      distance > 30
    ) {

      bear.state = "wander";

    }


    /* Преследование */

    if (
      bear.state === "chase" &&
      player.alive
    ) {

      const angle =
        Math.atan2(dx, dz);

      bear.dir = angle;

      const speed = 3.5;


      if (
        distance > 2.3
      ) {

        p.x +=
          Math.sin(angle) *
          speed *
          dt;

        p.z +=
          Math.cos(angle) *
          speed *
          dt;

      }


      /* Атака */

      bear.attackCd -= dt;


      if (
        distance < 2.5 &&
        bear.attackCd <= 0
      ) {

        bear.attackCd = 1.5;

        damage(
          16,
          "Вас убил медведь"
        );

      }

    }


    /* Простое блуждание */

    else {

      bear.timer -= dt;


      if (
        bear.timer <= 0
      ) {

        bear.timer =
          2 + Math.random() * 3;

        bear.dir =
          Math.random() *
          Math.PI * 2;

      }


      const speed = 1.2;

      p.x +=
        Math.sin(bear.dir) *
        speed *
        dt;

      p.z +=
        Math.cos(bear.dir) *
        speed *
        dt;

    }


    /* Высота медведя */

    p.y =
      terrainHeight(
        p.x,
        p.z
      );


    /* Поворот */

    bear.group.rotation.y =
      bear.dir - Math.PI / 2;

  }

}

========================= */

function attackBear() {

  if (
    !rustGameStarted ||
    !player.alive
  ) return;


  const bear =
    aimBear();


  if (!bear) {

    return;

  }


  bear.hp -= 20;


  toastMessage(
    "Попадание!"
  );


  if (
    bear.hp <= 0
  ) {

    bear.hp = 0;

    bear.alive =
      false;


    inventory.meat += 3;

    updateInventory();


    bear.group.rotation.z =
      Math.PI / 2;


    toastMessage(
      "+3 Мясо"
    );


    setTimeout(() => {

      scene.remove(
        bear.group
      );

    }, 3000);

  }

}

function damage(
  amount,
  reason
) {

  if (
    !player.alive
  ) return;


  player.hp -= amount;


  if (
    player.hp < 0
  ) {

    player.hp = 0;

  }


  const health =
    document.getElementById(
      "healthFill"
    );


  health.style.width =
    player.hp + "%";


  /* Красная вспышка */

  document.body.style.boxShadow =
    "inset 0 0 100px rgba(255,0,0,.8)";


  setTimeout(() => {

    document.body.style.boxShadow =
      "";

  }, 150);


  /* Смерть */

  if (
    player.hp <= 0
  ) {

    player.alive =
      false;


    showDeathScreen(
      reason
    );

  }

}
