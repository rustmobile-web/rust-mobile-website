.window{position:relative;width:min(800px,94vw);height:min(560px,88vh);padding:20px;border:1px solid #555;border-radius:12px;background:#111}
.close{position:absolute;right:10px;top:10px;width:40px;height:40px}
.title{text-align:center;font-size:24px;font-weight:bold;margin-bottom:20px}
#inventoryButton,#craftButton{position:fixed;left:15px;z-index:30;pointer-events:auto}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.item{min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #444;border-radius:8px;background:#181818}
.item b{align-self:flex-end;margin-right:6px}
.craftCard{width:240px;padding:15px;border:1px solid #444;border-radius:8px;background:#181818}
.spearIcon{text-align:center;font-size:65px}
.craftCard button{width:100%;height:42px;margin-top:10px}
#death{flex-direction:column}
#death h1{font-size:38px;color:#f22}
@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}

<script type="module">
import * as THREE from "three";

const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const WATER=-2.2;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9dbbd0);
scene.fog=new THREE.Fog(0x9dbbd0,55,150);

const camera=new THREE.PerspectiveCamera(
72,innerWidth/innerHeight,.05,400
);

const renderer=new THREE.WebGLRenderer({
antialias:false,
powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
$("game").appendChild(renderer.domElement);

addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

scene.add(new THREE.HemisphereLight(0xcfe6ff,0x39452b,1));

const sun=new THREE.DirectionalLight(0xfff0cf,1.1);
sun.position.set(40,70,20);
scene.add(sun);

function terrainHeight(x,z){
let h=Math.sin(x*.045)*2.4+
Math.cos(z*.05)*2.2+
Math.sin((x+z)*.021)*3.4;
h+=Math.sin(x*.12)*.35+
Math.cos(z*.14)*.35;
h-=Math.exp(-Math.pow(
(z-Math.sin(x*.03)*12)/8,2))*6.5;
return h;
}

function land(x,z){
return terrainHeight(x,z)>WATER+.6;
}
const terrain=new THREE.PlaneGeometry(
240,240,140,140
);

terrain.rotateX(-Math.PI/2);

const pos=terrain.attributes.position;
const colors=[];

const grass=new THREE.Color(0x5f8f3e);
const dry=new THREE.Color(0x8d9a4d);
const dirt=new THREE.Color(0x796143);
const rockColor=new THREE.Color(0x888985);
const sand=new THREE.Color(0xc9bd8e);

for(let i=0;i<pos.count;i++){

const x=pos.getX(i);
const z=pos.getZ(i);
const y=terrainHeight(x,z);

pos.setY(i,y);

let c;

if(y<WATER+.7)c=sand;
else if(y>7)c=rockColor;
else if(y>4.5)c=dirt;
else if(Math.sin(x*.05)+Math.cos(z*.04)>.6)c=dry;
else c=grass;

colors.push(c.r,c.g,c.b);
}

terrain.setAttribute(
"color",
new THREE.Float32BufferAttribute(colors,3)
);

terrain.computeVertexNormals();

scene.add(new THREE.Mesh(
terrain,
new THREE.MeshLambertMaterial({
vertexColors:true
})
));

const water=new THREE.Mesh(
new THREE.PlaneGeometry(290,290),
new THREE.MeshLambertMaterial({
color:0x2e6d85,
transparent:true,
opacity:.78
})
);

water.rotation.x=-Math.PI/2;
water.position.y=WATER;
scene.add(water);

function bumpy(r){

const g=new THREE.IcosahedronGeometry(r,1);
const p=g.attributes.position;

for(let i=0;i<p.count;i++){

const x=p.getX(i);
const y=p.getY(i);
const z=p.getZ(i);

const n=
1+
Math.sin(x*5)*
Math.cos(y*4)*
Math.sin(z*6)*.18;

p.setXYZ(i,x*n,y*n,z*n);
}

g.computeVertexNormals();

return g;
}

const materials={

bark:new THREE.MeshLambertMaterial({
color:0x60432d
}),

pine:new THREE.MeshLambertMaterial({
color:0x2e5b32
}),

leaf:new THREE.MeshLambertMaterial({
color:0x3f7735
}),

leaf2:new THREE.MeshLambertMaterial({
color:0x58883a
}),

rock:new THREE.MeshStandardMaterial({
color:0x3a3a38,
roughness:1,
flatShading:true
}),

iron:new THREE.MeshLambertMaterial({
color:0xa66f45,
flatShading:true
}),

sulfur:new THREE.MeshStandardMaterial({
color:0xa49b5a,
roughness:1,
flatShading:true
})

};

const resources=[];

function addResource(group,data){

group.position.y=
terrainHeight(
group.position.x,
group.position.z
);

scene.add(group);

const r={
group:group,
...data,
hp:data.maxHp,
alive:true
};

resources.push(r);

return r;
}

function makeTree(x,z,type){

const g=new THREE.Group();

g.position.set(x,0,z);

const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.25,.45,4,7),
materials.bark
);

trunk.position.y=2;
g.add(trunk);

if(type===0){

for(let i=0;i<3;i++){

const cone=new THREE.Mesh(
new THREE.ConeGeometry(
2.1-i*.45,
2.4,
7
),
materials.pine
);

cone.position.y=3.2+i*1.25;

g.add(cone);

}

}else{

const crown=new THREE.Mesh(
bumpy(type===1?2.2:1.7),
type===1?materials.leaf:materials.leaf2
);

crown.position.y=4.3;
crown.scale.y=.8;

g.add(crown);

}

g.scale.setScalar(rand(.85,1.2));
g.rotation.y=rand(0,Math.PI*2);

return addResource(g,{
type:"tree",
name:"Дерево",
maxHp:5,
radius:1.1,
drop:"wood",
dropN:2
});

}

function makeOre(x,z,type){

const g=new THREE.Group();

g.position.set(x,0,z);

const base=new THREE.Mesh(
bumpy(1.15),
materials.rock
);

base.scale.y=.7;
base.position.y=.5;

g.add(base);

const material=
type==="iron"
?materials.iron
:type==="sulfur"
?materials.sulfur
:materials.rock;

for(let i=0;i<4;i++){

const n=new THREE.Mesh(
bumpy(type==="stone"?.5:.3),
material
);

n.position.set(
rand(-.7,.7),
rand(.5,1),
rand(-.7,.7)
);

g.add(n);

}

return addResource(g,{
type:"ore",
name:type,
maxHp:type==="stone"?4:6,
radius:1.3,
drop:type,
dropN:type==="stone"?3:2
});

}

function scatter(count,callback){

let placed=0;
let tries=0;

while(
placed<count &&
tries<count*30
){

tries++;

const x=rand(-82,82);
const z=rand(-82,82);

if(!land(x,z))continue;

if(Math.hypot(x,z)<8)continue;

callback(x,z);

placed++;

}

}

scatter(75,(x,z)=>{
makeTree(x,z,Math.floor(rand(0,3)));
});

scatter(15,(x,z)=>{
makeOre(x,z,"stone");
});

scatter(8,(x,z)=>{
makeOre(x,z,"iron");
});

scatter(7,(x,z)=>{
makeOre(x,z,"sulfur");
});

const player={
pos:new THREE.Vector3(0,0,6),
vy:0,
yaw:0,
pitch:0,
hp:100,
eye:1.7,
onGround:true,
alive:true
};

const inv={
wood:0,
stone:0,
iron:0,
sulfur:0,
meat:0
};

window.gameInv=inv;

const hand=new THREE.Group();

camera.add(hand);
scene.add(camera);

hand.position.set(
.08,-.3,-.5
);

const skin=new THREE.MeshLambertMaterial({
color:0xc08a62
});

const sleeve=new THREE.MeshLambertMaterial({
color:0x555555
});

const arm=new THREE.Mesh(
new THREE.CylinderGeometry(.08,.1,.5,8),
skin
);

arm.rotation.set(1.15,0,-.25);
arm.position.set(.06,-.2,.12);
hand.add(arm);

const cuff=new THREE.Mesh(
new THREE.CylinderGeometry(.1,.11,.16,8),
sleeve
);

cuff.rotation.copy(arm.rotation);
cuff.position.set(.1,-.36,.24);
hand.add(cuff);

const fist=new THREE.Mesh(
bumpy(.11),
skin
);

fist.position.set(
0,.02,-.03
);

hand.add(fist);
/* ===== МОДЕЛЬ КОПЬЯ ===== */

const spear=new THREE.Group();

const spearWood=new THREE.MeshLambertMaterial({
color:0x76502f
});

const spearMetal=new THREE.MeshLambertMaterial({
color:0xbdbdbd,
flatShading:true
});

const shaft=new THREE.Mesh(
new THREE.CylinderGeometry(.025,.035,.78,8),
spearWood
);

shaft.rotation.z=Math.PI/2;
shaft.position.x=.35;

spear.add(shaft);

const tip=new THREE.Mesh(
new THREE.ConeGeometry(.09,.28,6),
spearMetal
);

tip.rotation.z=-Math.PI/2;
tip.position.x=.82;

spear.add(tip);

spear.position.set(
.03,-.02,-.32
);

spear.rotation.set(
.05,.1,-.15
);

spear.visible=false;

hand.add(spear);


/* ===== МЕДВЕДИ ===== */

const bears=[];

function makeBear(x,z){

const g=new THREE.Group();

const fur=new THREE.MeshLambertMaterial({
color:0x493426
});

const dark=new THREE.MeshLambertMaterial({
color:0x281b14
});

const body=new THREE.Mesh(
bumpy(.9),
fur
);

body.scale.set(
1.35,.9,.95
);

body.position.y=1.15;

g.add(body);

const head=new THREE.Group();

head.position.set(
1.25,1.35,0
);

const headMesh=new THREE.Mesh(
bumpy(.45),
fur
);

head.add(headMesh);

const nose=new THREE.Mesh(
new THREE.BoxGeometry(.4,.26,.3),
dark
);

nose.position.x=.4;

head.add(nose);

for(const side of [-1,1]){

const ear=new THREE.Mesh(
new THREE.SphereGeometry(.13,8,6),
fur
);

ear.position.set(
-.1,.38,.24*side
);

head.add(ear);

}

g.add(head);

const legs=[];

for(let i=0;i<4;i++){

const leg=new THREE.Mesh(
new THREE.CylinderGeometry(.16,.2,1.05,6),
fur
);

leg.position.set(
i<2?.75:-.7,
.52,
i%2?.45:-.45
);

g.add(leg);
legs.push(leg);

}

g.position.set(
x,
terrainHeight(x,z),
z
);

scene.add(g);

const bear={
group:g,
head:head,
legs:legs,
hp:100,
maxHp:100,
alive:true,
state:"wander",
dir:rand(0,Math.PI*2),
timer:rand(1,3),
attackCd:0
};

bears.push(bear);

}

makeBear(28,-18);
makeBear(-34,26);
makeBear(45,40);


/* ===== SPAWN ===== */

function spawnPlayer(){

let x=0;
let z=6;

for(let i=0;i<200;i++){

const tx=rand(-30,30);
const tz=rand(-30,30);

if(
land(tx,tz) &&
terrainHeight(tx,tz)>WATER+1.5 &&
bears.every(b=>
!b.alive ||
Math.hypot(
tx-b.group.position.x,
tz-b.group.position.z
)>30
)
){

x=tx;
z=tz;
break;

}

}

player.pos.set(
x,
terrainHeight(x,z),
z
);

player.vy=0;
player.yaw=0;
player.pitch=0;
player.hp=100;
player.alive=true;

updateHealth();
updateResources();

}


/* ===== UI ===== */

function updateHealth(){

$("healthFill").style.width=
clamp(player.hp,0,100)+"%";

}

function updateResources(){

$("wood").textContent=inv.wood;
$("stone").textContent=inv.stone;
$("iron").textContent=inv.iron;
$("sulfur").textContent=inv.sulfur;
$("meat").textContent=inv.meat;

$("iWood").textContent=inv.wood;
$("iStone").textContent=inv.stone;
$("iIron").textContent=inv.iron;
$("iSulfur").textContent=inv.sulfur;
$("iMeat").textContent=inv.meat;

}


/* ===== JOYSTICK ===== */

const movement={
x:0,
y:0
};

let joystickId=null;

let center={
x:0,
y:0
};

function joystickMove(e){

let dx=e.clientX-center.x;
let dy=e.clientY-center.y;

const d=Math.hypot(dx,dy);

if(d>50){

dx=dx/d*50;
dy=dy/d*50;

}

$("knob").style.transform=
`translate(${dx}px,${dy}px)`;

movement.x=dx/50;
movement.y=-dy/50;

}

$("joystick").addEventListener(
"pointerdown",
e=>{

e.preventDefault();

joystickId=e.pointerId;

const r=$("joystick").getBoundingClientRect();

center={
x:r.left+r.width/2,
y:r.top+r.height/2
};

$("joystick").setPointerCapture(
e.pointerId
);

joystickMove(e);

});

$("joystick").addEventListener(
"pointermove",
e=>{

if(e.pointerId!==joystickId)return;

e.preventDefault();

joystickMove(e);

});

function joystickEnd(e){

if(e.pointerId!==joystickId)return;

joystickId=null;

movement.x=0;
movement.y=0;

$("knob").style.transform=
"translate(0,0)";

}

$("joystick").addEventListener(
"pointerup",
joystickEnd
);

$("joystick").addEventListener(
"pointercancel",
joystickEnd
);


/* ===== ПОВОРОТ КАМЕРЫ ===== */

let lookId=null;

let lastLook={
x:0,
y:0
};

addEventListener(
"pointerdown",
e=>{

if(!gameStarted)return;

if(
e.target.closest(
"button,#joystick"
)
)return;

if(e.clientX<innerWidth*.42)
return;

lookId=e.pointerId;

lastLook={
x:e.clientX,
y:e.clientY
};

});

addEventListener(
"pointermove",
e=>{

if(e.pointerId!==lookId)return;

const dx=e.clientX-lastLook.x;
const dy=e.clientY-lastLook.y;

lastLook={
x:e.clientX,
y:e.clientY
};

player.yaw-=dx*.0032;

player.pitch=clamp(
player.pitch-dy*.0032,
-1.35,
1.35
);

});

addEventListener(
"pointerup",
e=>{

if(e.pointerId===lookId)
lookId=null;

});


/* ===== ДВИЖЕНИЕ ===== */

function updatePlayer(dt){

let mx=movement.x;
let mz=movement.y;

const len=Math.hypot(mx,mz);

if(
len>.05 &&
player.alive
){

mx/=Math.max(1,len);
mz/=Math.max(1,len);

const s=Math.sin(player.yaw);
const c=Math.cos(player.yaw);

const dx=-s*mz+c*mx;
const dz=-c*mz-s*mx;

const speed=5.2;

const nx=
player.pos.x+
dx*speed*dt;

const nz=
player.pos.z+
dz*speed*dt;

if(
Math.hypot(nx,nz)<92 &&
terrainHeight(nx,nz)>WATER-.8
){

let blocked=false;

for(const r of resources){

if(!r.alive)continue;

if(
Math.hypot(
nx-r.group.position.x,
nz-r.group.position.z
)<r.radius*.55
){

blocked=true;
break;

}

}

if(!blocked){

player.pos.x=nx;
player.pos.z=nz;

}

}

}

player.vy-=17*dt;

player.pos.y+=
player.vy*dt;

const ground=
terrainHeight(
player.pos.x,
player.pos.z
);

if(player.pos.y<=ground){

player.pos.y=ground;
player.vy=0;
player.onGround=true;

}

camera.position.set(
player.pos.x,
player.pos.y+player.eye,
player.pos.z
);

camera.rotation.order="YXZ";

camera.rotation.y=
player.yaw;

camera.rotation.x=
player.pitch;

}


/* ===== ПРЫЖОК ===== */

function jump(){

if(
player.alive &&
player.onGround
){

player.vy=6.4;
player.onGround=false;

}

}

$("jump").addEventListener(
"pointerdown",
e=>{
e.preventDefault();
jump();
}
);
      /* ===== НАВЕДЕНИЕ ===== */

function forward(){

return new THREE.Vector3(
0,0,-1
).applyQuaternion(
camera.quaternion
);

}

function aimResource(){

const origin=
camera.getWorldPosition(
new THREE.Vector3()
);

const dir=forward();

let best=null;
let bestDist=4.2;

for(const r of resources){

if(!r.alive)continue;

const center=
r.group.position.clone();

center.y+=1.2;

const to=
center.sub(origin);

const distance=to.length();

if(distance>bestDist+r.radius)
continue;

const projection=to.dot(dir);

if(projection<=0)
continue;

const perpendicular=
to.clone()
.sub(
dir.clone()
.multiplyScalar(projection)
)
.length();

if(
perpendicular<r.radius+.5 &&
distance<bestDist
){

best=r;
bestDist=distance;

}

}

return best;

}


function aimBear(){

const origin=
camera.getWorldPosition(
new THREE.Vector3()
);

const dir=forward();

for(const b of bears){

if(!b.alive)continue;

const center=
b.group.position.clone();

center.y+=1.2;

const to=
center.sub(origin);

const distance=to.length();

if(distance>4)continue;

const projection=to.dot(dir);

if(projection<=0)continue;

const perpendicular=
to.clone()
.sub(
dir.clone()
.multiplyScalar(projection)
)
.length();

if(perpendicular<1.3)
return b;

}

return null;

}


/* ===== ОРУЖИЕ ===== */

let weapon="stone";

let cooldown=0;

let attackAnimation=0;

let spearCrafted=false;


/* ===== АНИМАЦИЯ УДАРА ===== */

function startAttackAnimation(){

attackAnimation=.001;

}

function updateAttackAnimation(){

if(attackAnimation<=0)
return;

attackAnimation+=.07;

const t=
Math.min(
1,
attackAnimation
);

const swing=
Math.sin(t*Math.PI);

hand.rotation.x=
-.7*swing;

hand.position.z=
-.5-.32*swing;

if(t>=1){

attackAnimation=0;

hand.rotation.x=0;

hand.position.z=-.5;

}

}


/* ===== УДАР ===== */

function attack(){

if(
!gameStarted ||
!player.alive ||
cooldown>0
)
return;

cooldown=.5;

startAttackAnimation();

const bear=aimBear();

if(bear){

bear.hp-=
weapon==="spear"
?35
:18;

bear.state="chase";

if(bear.hp<=0){

bear.alive=false;

bear.group.visible=false;

inv.meat+=3;

updateResources();

}

return;

}

const resource=
aimResource();

if(!resource)
return;

resource.hp--;

if(resource.hp<=0){

resource.alive=false;

scene.remove(
resource.group
);

inv[resource.drop]+=
resource.dropN+
Math.floor(rand(0,2));

}else{

inv[resource.drop]++;

}

updateResources();

}

$("gather").addEventListener(
"pointerdown",
e=>{
e.preventDefault();
attack();
}
);

$("hit").addEventListener(
"pointerdown",
e=>{
e.preventDefault();
attack();
}
);


/* ===== МЕДВЕДИ ===== */

function damage(value){

if(!player.alive)
return;

player.hp-=value;

updateHealth();

if(player.hp<=0){

player.hp=0;

player.alive=false;

$("death").style.display="flex";

}

}

function updateBears(dt){

for(const bear of bears){

if(!bear.alive)
continue;

const p=
bear.group.position;

const dx=
player.pos.x-p.x;

const dz=
player.pos.z-p.z;

const distance=
Math.hypot(dx,dz);

if(
player.alive &&
distance<14
){

bear.state="chase";

}else if(
bear.state==="chase" &&
distance>28
){

bear.state="wander";

}

let speed=0;

if(
bear.state==="chase" &&
player.alive
){

bear.dir=
Math.atan2(dx,dz);

speed=
distance>2.3
?3.5
:0;

bear.attackCd-=dt;

if(
distance<2.6 &&
bear.attackCd<=0
){

bear.attackCd=1.6;

damage(16);

}

}else{

bear.timer-=dt;

if(bear.timer<=0){

bear.timer=
rand(1.5,4);

bear.dir=
rand(0,Math.PI*2);

}

speed=1.3;

}

if(speed>0){

const nx=
p.x+
Math.sin(bear.dir)*
speed*dt;

const nz=
p.z+
Math.cos(bear.dir)*
speed*dt;

if(
Math.hypot(nx,nz)<88 &&
terrainHeight(nx,nz)>WATER+.4
){

p.x=nx;
p.z=nz;

}

}

p.y=
terrainHeight(
p.x,
p.z
);

bear.group.rotation.y=
bear.dir-Math.PI/2;

}

}


/* ===== МЕНЮ ===== */

let gameStarted=false;

$("play").addEventListener(
"click",
async()=>{

$("menu").style.display="none";

$("hud").style.display="block";

gameStarted=true;

spawnPlayer();

try{

await document.documentElement
.requestFullscreen?.();

}catch(e){}

});

$("settingsBtn").addEventListener(
"click",
()=>{

$("menu").style.display="none";

$("settings").style.display="block";

});

$("back").addEventListener(
"click",
()=>{

$("settings").style.display="none";

$("menu").style.display="flex";

});


/* ===== FPS ===== */

let showFPS=true;

let frames=0;

let fpsTime=
performance.now();

$("fpsBtn").addEventListener(
"click",
()=>{

showFPS=!showFPS;

$("fpsState").textContent=
showFPS?"ВКЛ":"ВЫКЛ";

if(!showFPS)
$("fps").style.display="none";

});

function updateFPS(){

frames++;

const now=
performance.now();

if(now-fpsTime>=500){

const value=
Math.round(
frames/
((now-fpsTime)/1000)
);

$("fps").textContent=
"FPS: "+value;

if(
showFPS &&
gameStarted
){

$("fps").style.display="block";

}

frames=0;
fpsTime=now;

}

requestAnimationFrame(
updateFPS
);

}

updateFPS();
     /* ===== ИНВЕНТАРЬ ===== */

$("inventoryButton").addEventListener(
"pointerdown",
e=>{

e.preventDefault();
e.stopPropagation();

$("inventory").style.display="flex";

updateResources();

}
);

$("closeInv").addEventListener(
"pointerdown",
e=>{

e.preventDefault();
e.stopPropagation();

$("inventory").style.display="none";

}
);


/* ===== КРАФТ ===== */

$("craftButton").addEventListener(
"pointerdown",
e=>{

e.preventDefault();
e.stopPropagation();

$("craft").style.display="flex";

updateCraft();

}
);

$("closeCraft").addEventListener(
"pointerdown",
e=>{

e.preventDefault();
e.stopPropagation();

$("craft").style.display="none";

}
);

function updateCraft(){

if(spearCrafted){

$("craftMsg").textContent=
"Копьё уже создано";

$("makeSpear").disabled=true;

return;

}

$("makeSpear").disabled=
inv.wood<10;

$("craftMsg").textContent=
inv.wood>=10
?"Готово к созданию"
:"Нужно ещё "+(10-inv.wood)+" дерева";

}


/* ===== СОЗДАНИЕ КОПЬЯ ===== */

$("makeSpear").addEventListener(
"pointerdown",
e=>{

e.preventDefault();
e.stopPropagation();

if(spearCrafted)
return;

if(inv.wood<10){

$("craftMsg").textContent=
"Недостаточно дерева";

return;

}

inv.wood-=10;

spearCrafted=true;

weapon="spear";

spear.visible=true;


/* КОПЬЁ В HOTBAR */

const slots=
document.querySelectorAll(
"#hotbar .slot"
);

for(const slot of slots)
slot.classList.remove("active");

let slot=slots[1];

slot.textContent="🗡️";

slot.dataset.weapon="spear";

slot.classList.add("active");

updateResources();

updateCraft();

$("craftMsg").textContent=
"Копьё создано!";

});


/* ===== HOTBAR ===== */

$("hotbar").addEventListener(
"pointerdown",
e=>{

const slot=
e.target.closest(".slot");

if(!slot)
return;

e.preventDefault();
e.stopPropagation();

const slots=
document.querySelectorAll(
"#hotbar .slot"
);

for(const s of slots)
s.classList.remove("active");

slot.classList.add("active");

if(
slot.dataset.weapon==="spear"
){

weapon="spear";

spear.visible=true;

}else{

weapon="stone";

spear.visible=false;

}

});


/* ===== СМЕНА ОРУЖИЯ КЛАВИАТУРОЙ ===== */

addEventListener(
"keydown",
e=>{

if(e.key==="1"){

weapon="stone";

spear.visible=false;

}

if(e.key==="2" && spearCrafted){

weapon="spear";

spear.visible=true;

}

if(e.key==="Escape"){

$("inventory").style.display="none";

$("craft").style.display="none";

}

});


/* ===== ВОЗРОЖДЕНИЕ ===== */

$("respawn").addEventListener(
"click",
()=>{

$("death").style.display="none";

for(const bear of bears){

bear.state="wander";

bear.hp=bear.maxHp;

bear.alive=true;

bear.group.visible=true;

}

spawnPlayer();

});


/* ===== ЗАКРЫТИЕ ОКОН ПО ФОНУ ===== */

$("inventory").addEventListener(
"pointerdown",
e=>{

if(e.target===$("inventory"))
$("inventory").style.display="none";

});

$("craft").addEventListener(
"pointerdown",
e=>{

if(e.target===$("craft"))
$("craft").style.display="none";

});


/* ===== НАЧАЛЬНЫЕ ЗНАЧЕНИЯ ===== */

updateResources();
updateHealth();


/* ===== ОСНОВНОЙ LOOP ===== */

const clock=
new THREE.Clock();

function loop(){

requestAnimationFrame(loop);

const dt=
Math.min(
.05,
clock.getDelta()
);

if(gameStarted){

updatePlayer(dt);

updateBears(dt);

updateAttackAnimation();

if(cooldown>0)
cooldown-=dt;

water.position.y=
WATER+
Math.sin(
performance.now()*.001
)*.05;

}

renderer.render(
scene,
camera
);

}

loop();
      /* ===== ДОПОЛНИТЕЛЬНАЯ АНИМАЦИЯ КАМНЯ ===== */

/*
   Когда выбран камень и нажата кнопка
   "ДОБЫТЬ", рука слегка идёт вперёд
   и возвращается назад.
*/

const originalHandRotationX=
hand.rotation.x;

const originalHandZ=
hand.position.z;


/* ===== СБРОС ПОСЛЕ АТАКИ ===== */

function resetHand(){

if(attackAnimation<=0){

hand.rotation.x=
originalHandRotationX;

hand.position.z=
originalHandZ;

}

}


/* ===== ОБНОВЛЯЕМ LOOP ДЛЯ СБРОСА ===== */

setInterval(
resetHand,
50
);


/* ===== КОПЬЁ НЕ БРОСАЕТСЯ ===== */

/*
   Оно только находится в руке.
   При нажатии "УДАР":
   рука двигается вперёд,
   затем возвращается назад.
*/

);
