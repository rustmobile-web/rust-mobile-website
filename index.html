<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Rust Mobile Web</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

/* ================= МЕНЮ ================= */

#menu{
  position:fixed;
  inset:0;
  z-index:1000;

  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:center;

  padding:25px;

  background:
    radial-gradient(
      circle at 85% 20%,
      rgba(220,0,0,.35),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #050505,
      #170707,
      #050505
    );
}

.logo{
  margin-right:5px;
  margin-bottom:45px;

  font-size:31px;
  font-weight:900;
  letter-spacing:2px;
  text-align:right;
}

.logo span{
  color:#e00000;
}

.menuButton{
  width:230px;
  height:58px;

  margin:7px 0;

  border:1px solid #d40000;
  border-radius:8px;

  background:rgba(20,20,20,.95);

  color:white;

  font-size:17px;
  font-weight:bold;
  letter-spacing:1px;
}

.menuButton:active{
  background:#c90000;
  transform:scale(.96);
}

/* ================= НАСТРОЙКИ ================= */

#settings{
  position:fixed;
  inset:0;
  z-index:1100;

  display:none;

  padding:30px;

  background:
    linear-gradient(
      135deg,
      #050505,
      #160606,
      #050505
    );
}

.settingsTitle{
  margin:30px 0;

  text-align:center;

  font-size:28px;
  color:#e00000;
}

.settingsBox{
  max-width:400px;
  margin:auto;

  padding:20px;

  border:1px solid #333;
  border-radius:12px;

  background:#111;
}

.settingsBox p{
  font-size:17px;
}

#fpsStatus{
  color:#e00000;
}

/* ================= FPS ================= */

#fps{
  position:fixed;

  top:10px;
  right:10px;

  z-index:500;

  padding:5px 9px;

  border-radius:5px;

  background:rgba(0,0,0,.6);

  color:white;

  font-size:13px;
  font-weight:bold;

  display:none;
}

/* ================= HUD ================= */

#hud{
  position:fixed;
  inset:0;

  pointer-events:none;

  display:none;
}

.panel{
  background:rgba(10,10,10,.6);

  border:1px solid rgba(255,255,255,.25);

  border-radius:10px;

  backdrop-filter:blur(5px);
}

#top{
  position:absolute;

  top:10px;
  left:10px;

  display:flex;
  gap:8px;
}

#health{
  width:190px;
  padding:8px;

  font-size:11px;
}

.healthBar{
  height:8px;

  margin-top:5px;

  background:#222;

  border-radius:5px;

  overflow:hidden;
}

#healthFill{
  width:100%;
  height:100%;

  background:linear-gradient(
    90deg,
    #b00000,
    #ff3333
  );
}

#resources{
  padding:7px 10px;

  font-size:12px;
  line-height:1.5;
}

#resources b{
  color:#ffdddd;
}

/* ================= ПРИЦЕЛ ================= */

#crosshair{
  position:fixed;

  left:50%;
  top:50%;

  width:20px;
  height:20px;

  transform:translate(-50%,-50%);

  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";

  position:absolute;

  background:white;

  box-shadow:0 0 3px black;
}

#crosshair:before{
  width:2px;
  height:16px;

  left:9px;
  top:2px;
}

#crosshair:after{
  width:16px;
  height:2px;

  left:2px;
  top:9px;
}

/* ================= ДЖОЙСТИК ================= */

#joystick{
  position:fixed;

  left:20px;
  bottom:110px;

  width:125px;
  height:125px;

  border-radius:50%;

  border:2px solid rgba(255,255,255,.3);

  background:rgba(0,0,0,.35);

  pointer-events:auto;
}

#knob{
  position:absolute;

  left:50%;
  top:50%;

  width:55px;
  height:55px;

  margin-left:-27.5px;
  margin-top:-27.5px;

  border-radius:50%;

  background:rgba(255,255,255,.45);

  border:1px solid white;
}

/* ================= КНОПКИ ================= */

#buttons{
  position:fixed;

  right:15px;
  bottom:105px;

  display:flex;
  flex-direction:column;

  gap:10px;

  align-items:flex-end;
}

.gameButton{
  width:75px;
  height:75px;

  border-radius:50%;

  border:1px solid rgba(255,255,255,.3);

  background:rgba(15,15,15,.65);

  color:white;

  font-size:11px;
  font-weight:bold;

  pointer-events:auto;
}

.gameButton.big{
  width:88px;
  height:88px;

  background:rgba(150,0,0,.55);
}

.gameButton:active{
  transform:scale(.94);
  background:#c00000;
}

/* ================= ХОТБАР ================= */

#hotbar{
  position:fixed;

  left:50%;
  bottom:10px;

  transform:translateX(-50%);

  display:flex;
  gap:7px;

  pointer-events:auto;
}

.slot{
  width:55px;
  height:55px;

  border:2px solid #333;
  border-radius:9px;

  background:rgba(10,10,10,.65);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;

  pointer-events:auto;
}

.slot.active{
  border-color:#e00000;

  background:rgba(150,0,0,.45);
}

/* ================= TARGET ================= */

#target{
  position:fixed;

  left:50%;
  top:calc(50% + 25px);

  transform:translateX(-50%);

  padding:5px 10px;

  border-radius:8px;

  background:rgba(0,0,0,.6);

  font-size:12px;

  display:none;
}

/* ================= СМЕРТЬ ================= */

#death{
  position:fixed;
  inset:0;

  z-index:2000;

  display:none;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  background:rgba(20,0,0,.85);
}

#death h1{
  color:#ff2222;
  font-size:38px;
}

/* ================= АДАПТИВ ================= */

@media(max-width:600px){

  #top{
    transform:scale(.9);
    transform-origin:top left;
  }

  #joystick{
    left:15px;
    bottom:105px;
    width:115px;
    height:115px;
  }

  #buttons{
    right:10px;
    bottom:100px;
  }

  .gameButton{
    width:68px;
    height:68px;
  }

  .gameButton.big{
    width:80px;
    height:80px;
  }

  .slot{
    width:48px;
    height:48px;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<!-- ================= ГЛАВНОЕ МЕНЮ ================= -->

<div id="menu">

  <div class="logo">
    RUST MOBILE <span>[web]</span>
  </div>

  <button class="menuButton" id="playButton">
    ИГРАТЬ
  </button>

  <button class="menuButton" id="settingsButton">
    НАСТРОЙКИ
  </button>

</div>

<!-- ================= НАСТРОЙКИ ================= -->

<div id="settings">

  <div class="settingsTitle">
    НАСТРОЙКИ
  </div>

  <div class="settingsBox">

    <p>
      FPS:
      <b id="fpsStatus">ВКЛ</b>
    </p>

    <button class="menuButton" id="fpsButton">
      ПОКАЗЫВАТЬ FPS
    </button>

    <button class="menuButton" id="backButton">
      НАЗАД
    </button>

  </div>

</div>

<!-- ================= FPS ================= -->

<div id="fps">
  FPS: 0
</div>

<!-- ================= HUD ================= -->

<div id="hud">

  <div id="top">

    <div class="panel" id="health">

      ЗДОРОВЬЕ

      <div class="healthBar">
        <div id="healthFill"></div>
      </div>

    </div>

    <div class="panel" id="resources">

      Дерево:
      <b id="wood">0</b><br>

      Камень:
      <b id="stone">0</b><br>

      Железо:
      <b id="iron">0</b><br>

      Сера:
      <b id="sulfur">0</b><br>

      Мясо:
      <b id="meat">0</b>

    </div>

  </div>

  <div id="crosshair"></div>

  <div id="target"></div>

  <!-- ДЖОЙСТИК -->

  <div id="joystick">

    <div id="knob"></div>

  </div>

  <!-- КНОПКИ -->

  <div id="buttons">

    <button class="gameButton" id="jump">
      ПРЫЖОК
    </button>

    <button class="gameButton" id="hit">
      УДАР
    </button>

    <button class="gameButton big" id="gather">
      ДОБЫТЬ
    </button>

  </div>

  <!-- ХОТБАР -->

  <div id="hotbar">

    <div class="slot active">
      🪨
    </div>

    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>

  </div>

</div>

<!-- ================= СМЕРТЬ ================= -->

<div id="death">

  <h1>ВЫ ПОГИБЛИ</h1>

  <p>Вас победил медведь</p>

  <button class="menuButton" id="respawn">
    ВОЗРОДИТЬСЯ
  </button>

</div>

<!-- ================= THREE.JS ================= -->

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.169.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";

/* =====================================================
   ОСНОВНЫЕ ПЕРЕМЕННЫЕ
===================================================== */

const $ = id =>
  document.getElementById(id);

const clamp = (v,a,b) =>
  Math.min(b,Math.max(a,v));

const rand = (a,b) =>
  a + Math.random() * (b-a);

const WORLD = 120;

const WATER = -2.2;

let gameStarted = false;

/* =====================================================
   СЦЕНА
===================================================== */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x9dbbd0);

scene.fog =
  new THREE.Fog(
    0x9dbbd0,
    55,
    150
  );

/* =====================================================
   КАМЕРА
===================================================== */

const camera =
  new THREE.PerspectiveCamera(
    72,
    innerWidth / innerHeight,
    0.05,
    400
  );

/* =====================================================
   РЕНДЕР
===================================================== */

const renderer =
  new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    1.5
  )
);

renderer.setSize(
  innerWidth,
  innerHeight
);

$("game").appendChild(
  renderer.domElement
);

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

/* =====================================================
   СВЕТ
===================================================== */

scene.add(
  new THREE.HemisphereLight(
    0xcfe6ff,
    0x39452b,
    1
  )
);

const sun =
  new THREE.DirectionalLight(
    0xfff0cf,
    1.1
  );

sun.position.set(
  40,
  70,
  20
);

scene.add(sun);

/* =====================================================
   ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ
===================================================== */

function bumpy(radius){

  const geometry =
    new THREE.IcosahedronGeometry(
      radius,
      1
    );

  const p =
    geometry.attributes.position;

  for(
    let i=0;
    i<p.count;
    i++
  ){

    const x=p.getX(i);
    const y=p.getY(i);
    const z=p.getZ(i);

    const n =
      1 +
      Math.sin(x*5) *
      Math.cos(y*4) *
      Math.sin(z*6) *
      .18;

    p.setXYZ(
      i,
      x*n,
      y*n,
      z*n
    );

  }

  geometry.computeVertexNormals();

  return geometry;
}

/* =====================================================
   ЗЕМЛЯ
===================================================== */

function terrainHeight(x,z){

  let h =
    Math.sin(x*.045)*2.4 +
    Math.cos(z*.05)*2.2 +
    Math.sin((x+z)*.021)*3.4;

  h +=
    Math.sin(x*.12)*.35 +
    Math.cos(z*.14)*.35;

  const river =
    Math.exp(
      -Math.pow(
        (z-Math.sin(x*.03)*12)/8,
        2
      )
    ) * 6.5;

  h -= river;

  const d =
    Math.sqrt(
      x*x+z*z
    );

  h -=
    Math.max(
      0,
      (d-88)*.5
    );

  return h;
}

/* =====================================================
   ГЕОМЕТРИЯ ЗЕМЛИ
===================================================== */

const terrain =
  new THREE.PlaneGeometry(
    WORLD*2,
    WORLD*2,
    140,
    140
  );

terrain.rotateX(
  -Math.PI/2
);

const positions =
  terrain.attributes.position;

const colors=[];

const grass =
  new THREE.Color(0x5f8f3e);

const dry =
  new THREE.Color(0x8d9a4d);

const dirt =
  new THREE.Color(0x796143);

const rock =
  new THREE.Color(0x888985);

const sand =
  new THREE.Color(0xc9bd8e);

for(
  let i=0;
  i<positions.count;
  i++
){

  const x =
    positions.getX(i);

  const z =
    positions.getZ(i);

  const y =
    terrainHeight(x,z);

  positions.setY(
    i,
    y
  );

  let color;

  if(y < WATER+.7){

    color=sand;

  }else if(y > 7){

    color=rock;

  }else if(y > 4.5){

    color=dirt;

  }else if(
    Math.sin(x*.05)+
    Math.cos(z*.04) > .6
  ){

    color=dry;

  }else{

    color=grass;

  }

  colors.push(
    color.r,
    color.g,
    color.b
  );

}

terrain.setAttribute(
  "color",
  new THREE.Float32BufferAttribute(
    colors,
    3
  )
);

terrain.computeVertexNormals();

const terrainMesh =
  new THREE.Mesh(
    terrain,
    new THREE.MeshLambertMaterial({
      vertexColors:true
    })
  );

scene.add(
  terrainMesh
);

/* =====================================================
   ВОДА
===================================================== */

const water =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      WORLD*2.4,
      WORLD*2.4
    ),
    new THREE.MeshLambertMaterial({
      color:0x2e6d85,
      transparent:true,
      opacity:.78
    })
  );

water.rotation.x =
  -Math.PI/2;

water.position.y =
  WATER;

scene.add(water);

/* =====================================================
   МАТЕРИАЛЫ
===================================================== */

const materials = {

  bark:
    new THREE.MeshLambertMaterial({
      color:0x60432d
    }),

  leaf:
    new THREE.MeshLambertMaterial({
      color:0x3f7735
    }),

  leaf2:
    new THREE.MeshLambertMaterial({
      color:0x58883a
    }),

  pine:
    new THREE.MeshLambertMaterial({
      color:0x2e5b32
    }),

  rock:
    new THREE.MeshStandardMaterial({
      color:0x3a3a38,
      roughness:1,
      metalness:0,
      flatShading:true
    }),

  iron:
    new THREE.MeshLambertMaterial({
      color:0xa66f45,
      flatShading:true
    }),

  sulfur:
    new THREE.MeshStandardMaterial({
      color:0xa49b5a,
      roughness:1,
      metalness:0,
      flatShading:true
    })

};

/* =====================================================
   СОСТОЯНИЕ ИНВЕНТАРЯ
   ВАЖНО: inv объявляется ТОЛЬКО ОДИН РАЗ
===================================================== */

const inv = {
  wood:0,
  stone:0,
  iron:0,
  sulfur:0,
  meat:0
};

window.gameInv = inv;

/* =====================================================
   РЕСУРСЫ
===================================================== */

const resources=[];

function addResource(group,data){

  group.position.y =
    terrainHeight(
      group.position.x,
      group.position.z
    );

  scene.add(group);

  const resource={
    group:group,
    ...data,
    hp:data.maxHp,
    alive:true
  };

  resources.push(resource);

  return resource;
}

/* =====================================================
   ПРОВЕРКА ЗЕМЛИ
===================================================== */

function land(x,z){

  return terrainHeight(x,z)
    > WATER+.6;

}

/* =====================================================
   РАССЕИВАНИЕ
===================================================== */

function scatter(
  count,
  callback
){

  let placed=0;
  let tries=0;

  while(
    placed<count &&
    tries<count*30
  ){

    tries++;

    const x =
      rand(-82,82);

    const z =
      rand(-82,82);

    if(!land(x,z))
      continue;

    if(
      Math.hypot(x,z)<8
    )
      continue;

    callback(x,z);

    placed++;

  }

}

/* =====================================================
   МЕНЮ — НАСТРОЙКИ
===================================================== */

let showFPS=true;

$("settingsButton").addEventListener(
  "click",
  () => {

    $("menu").style.display="none";

    $("settings").style.display="block";

  }
);

$("backButton").addEventListener(
  "click",
  () => {

    $("settings").style.display="none";

    $("menu").style.display="flex";

  }
);

$("fpsButton").addEventListener(
  "click",
  () => {

    showFPS=!showFPS;

    $("fpsStatus").textContent =
      showFPS ? "ВКЛ" : "ВЫКЛ";

    if(!showFPS){

      $("fps").style.display="none";

    }

  }
);

/* =====================================================
   FPS
===================================================== */

let frames=0;

let fpsTime =
  performance.now();

function updateFPS(){

  frames++;

  const now =
    performance.now();

  if(
    now-fpsTime >= 500
  ){

    const value =
      Math.round(
        frames /
        ((now-fpsTime)/1000)
      );

    $("fps").textContent =
      "FPS: " + value;

    if(
      showFPS &&
      gameStarted
    ){

      $("fps").style.display =
        "block";

    }

    frames=0;

    fpsTime=now;

  }

  requestAnimationFrame(
    updateFPS
  );

}

updateFPS();

/* =====================================================
   ПУСТОЙ ЗАПУСК
   Следующие части добавят игровой мир и управление.
===================================================== */

$("playButton").addEventListener(
  "click",
  () => {

    gameStarted=true;

    $("menu").style.display="none";

    $("hud").style.display="block";

    document.documentElement
      .requestFullscreen?.()
      .catch(()=>{});

  }
);

/* =====================================================
   КОНЕЦ ЧАСТИ 1/4
===================================================== */

</script>
<!-- ================= ЧАСТЬ 2/4 ================= -->

<script type="module">

/*
  Эта часть рассчитана на то,
  что ЧАСТЬ 1 уже содержит:
  scene, camera, renderer,
  materials, bumpy(), terrainHeight(),
  WATER, WORLD и resources.
*/

/* ================= РЕСУРСЫ ================= */

function addResource(group,data){

  const x = group.position.x;
  const z = group.position.z;

  group.position.y =
    terrainHeight(x,z);

  scene.add(group);

  const resource = {
    group: group,
    type: data.type,
    name: data.name,
    maxHp: data.maxHp,
    hp: data.maxHp,
    radius: data.radius,
    drop: data.drop,
    dropN: data.dropN,
    alive: true
  };

  resources.push(resource);

  return resource;
}


/* ================= ДЕРЕВО ================= */

function makeTree(x,z,type){

  const group =
    new THREE.Group();

  group.position.set(x,0,z);

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .25,
        .45,
        4,
        7
      ),
      materials.bark
    );

  trunk.position.y = 2;

  group.add(trunk);


  if(type === 0){

    for(let i=0;i<3;i++){

      const crown =
        new THREE.Mesh(
          new THREE.ConeGeometry(
            2.1 - i*.45,
            2.4,
            7
          ),
          materials.pine
        );

      crown.position.y =
        3.2 + i*1.25;

      group.add(crown);
    }

  }else{

    const crown =
      new THREE.Mesh(
        bumpy(
          type === 1
            ? 2.2
            : 1.7
        ),
        type === 1
          ? materials.leaf
          : materials.leaf2
      );

    crown.position.y =
      type === 1 ? 4.3 : 5;

    crown.scale.y = .8;

    group.add(crown);
  }


  group.scale.setScalar(
    rand(.85,1.2)
  );

  group.rotation.y =
    rand(0,Math.PI*2);


  return addResource(
    group,
    {
      type:"tree",
      name:"Дерево",
      maxHp:5,
      radius:1.1,
      drop:"wood",
      dropN:2
    }
  );
}


/* ================= РУДА ================= */

function makeOre(x,z,type){

  const group =
    new THREE.Group();

  group.position.set(x,0,z);


  const base =
    new THREE.Mesh(
      bumpy(1.15),
      materials.rock
    );

  base.position.y = .55;
  base.scale.y = .7;

  group.add(base);


  let material =
    materials.rock;

  if(type === "iron")
    material = materials.iron;

  if(type === "sulfur")

<script type="module">

   УПРАВЛЕНИЕ ИГРОКОМ

function spawnPlayer(){

  let x = 0;
  let z = 6;

  for(let i=0;i<200;i++){

    const tx =
      rand(-30,30);

    const tz =
      rand(-30,30);

    if(
      isLand(tx,tz) &&
      terrainHeight(tx,tz)
        > WATER + 1.5
    ){

      let free = true;

      for(const bear of bears){

        if(
          bear.alive &&
          Math.hypot(
            tx-bear.group.position.x,
            tz-bear.group.position.z
          ) < 30
        ){

          free = false;
          break;

        }
      }

      if(free){

        x = tx;
        z = tz;

        break;

      }
    }
  }


  player.pos.set(
    x,
    terrainHeight(x,z),
    z
  );

  player.vy = 0;
  player.yaw = 0;
  player.pitch = 0;
  player.hp = 100;
  player.alive = true;
  player.onGround = true;

  updateHealth();
  updateResources();

}


/* ================= ЗДОРОВЬЕ ================= */

function updateHealth(){

  const bar =
    document.getElementById(
      "healthFill"
    );

  if(bar){

    bar.style.width =
      clamp(
        player.hp,
        0,
        100
      ) + "%";

  }

}


/* ================= РЕСУРСЫ ================= */

function updateResources(){

  const wood =
    document.getElementById("wood");

  const stone =
    document.getElementById("stone");

  const iron =
    document.getElementById("iron");

  const sulfur =
    document.getElementById("sulfur");

  const meat =
    document.getElementById("meat");

    wood.textContent = inv.wood;

  if(stone)
    stone.textContent = inv.stone;

  if(iron)
    iron.textContent = inv.iron;

  if(sulfur)
    sulfur.textContent = inv.sulfur;

  if(meat)
    meat.textContent = inv.meat;


  if(
    typeof updateInventoryUI ===
    "function"
  ){

    updateInventoryUI();

  }

}


/* =================================================
   ДЖОЙСТИК
================================================= */

const joystick =
  document.getElementById(
    "joystick"
  );

const knob =
  document.getElementById(
    "knob"
  );


const movement = {

  x:0,

  y:0

};


let joystickId = null;


const joystickRadius = 50;


let joystickCenter = {

  x:0,

  y:0

};


function updateJoystick(e){

  let dx =
    e.clientX -
    joystickCenter.x;

  let dy =
    e.clientY -
    joystickCenter.y;


  const distance =
    Math.hypot(dx,dy);


  if(
    distance >
    joystickRadius
  ){

    dx =
      dx / distance *
      joystickRadius;

    dy =
      dy / distance *
      joystickRadius;

  }


  knob.style.transform =
    `translate(${dx}px,${dy}px)`;


  movement.x =
    dx / joystickRadius;


  movement.y =
    -dy / joystickRadius;

}


if(joystick){

  joystick.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();
      e.stopPropagation();

      joystickId =
        e.pointerId;


      const rect =
        joystick.getBoundingClientRect();


      joystickCenter = {

        x:
          rect.left +
          rect.width / 2,

        y:
          rect.top +
          rect.height / 2

      };


      joystick.setPointerCapture(
        e.pointerId
      );


      updateJoystick(e);

    }
  );


  joystick.addEventListener(
    "pointermove",
    function(e){

      if(
        e.pointerId !==
        joystickId
      )
        return;

      e.preventDefault();

      updateJoystick(e);

    }
  );


  function joystickEnd(e){

    if(
      e.pointerId !==
      joystickId
    )
      return;


    joystickId = null;

    movement.x = 0;
    movement.y = 0;


    knob.style.transform =
      "translate(0px,0px)";

  }


  joystick.addEventListener(
    "pointerup",
    joystickEnd
  );


  joystick.addEventListener(
    "pointercancel",
    joystickEnd
  );

}


/* =================================================
   ПОВОРОТ КАМЕРЫ
================================================= */

let lookId = null;


let lastLook = {

  x:0,

  y:0

};


const sensitivity = .0032;


window.addEventListener(
  "pointerdown",
  function(e){

    if(
      !window.gameStarted
    )
      return;


    if(
      e.target.closest(
        "#joystick," +
        ".gameButton," +
        ".slot," +
        ".menuButton," +
        "#inventoryButton," +
        "#craftButton6"
      )
    )
      return;


    if(
      e.clientX <
      innerWidth * .42
    )
      return;


    lookId =
      e.pointerId;


    lastLook = {

      x:e.clientX,

      y:e.clientY

    };

  }
);


window.addEventListener(
  "pointermove",
  function(e){

    if(
      e.pointerId !==
      lookId
    )
      return;


    const dx =
      e.clientX -
      lastLook.x;


    const dy =
      e.clientY -
      lastLook.y;


    lastLook = {

      x:e.clientX,

      y:e.clientY

    };


    player.yaw -=
      dx * sensitivity;


    player.pitch =
      clamp(
        player.pitch -
        dy * sensitivity,

        -1.35,

        1.35
      );

  }
);


window.addEventListener(
  "pointerup",
  function(e){

    if(
      e.pointerId ===
      lookId
    )
      lookId = null;

  }
);


/* =================================================
   ПРЫЖОК
================================================= */

function jump(){

  if(
    !player.alive ||
    !player.onGround
  )
    return;


  player.vy = 6.4;

  player.onGround = false;

}


const jumpButton =
  document.getElementById(
    "jump"
  );


if(jumpButton){

  jumpButton.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      jump();

    }
  );

}


/* =================================================
   ДВИЖЕНИЕ
================================================= */

function updatePlayer(dt){

  if(!player.alive)
    return;


  let mx =
    movement.x;

  let mz =
    movement.y;


  const length =
    Math.hypot(mx,mz);


  if(length > .05){

    mx /=
      Math.max(
        1,
        length
      );

    mz /=
      Math.max(
        1,
        length
      );


    const sin =
      Math.sin(
        player.yaw
      );


    const cos =
      Math.cos(
        player.yaw
      );


    const dx =
      -sin * mz +
      cos * mx;


    const dz =
      -cos * mz -
      sin * mx;


    const speed = 5.2;


    const nx =
      player.pos.x +
      dx * speed * dt;


    const nz =
      player.pos.z +
      dz * speed * dt;


    if(
      Math.hypot(nx,nz) <
      92 &&
      terrainHeight(nx,nz) >
      WATER - .8
    ){

      let blocked = false;


      for(
        const resource of resources
      ){

        if(
          !resource.alive
        )
          continue;


        const distance =
          Math.hypot(
            nx -
            resource.group.position.x,

            nz -
            resource.group.position.z
          );


        if(
          distance <
          resource.radius * .55
        ){

          blocked = true;

          break;

        }

      }


      if(!blocked){

        player.pos.x = nx;

        player.pos.z = nz;

      }

    }

  }


  /* ГРАВИТАЦИЯ */

  player.vy -=
    17 * dt;


  player.pos.y +=
    player.vy * dt;


  const ground =
    terrainHeight(
      player.pos.x,
      player.pos.z
    );


  if(
    player.pos.y <=
    ground
  ){

    player.pos.y =
      ground;

    player.vy = 0;

    player.onGround =
      true;

  }


  /* КАМЕРА */

  camera.position.set(

    player.pos.x,

    player.pos.y +
      player.eye,

    player.pos.z

  );


  camera.rotation.order =
    "YXZ";


  camera.rotation.y =
    player.yaw;


  camera.rotation.x =
    player.pitch;

}


/* =================================================
   НАПРАВЛЕНИЕ ВЗГЛЯДА
================================================= */

function getForward(){

  const direction =
    new THREE.Vector3(
      0,
      0,
      -1
    );


  direction.applyQuaternion(
    camera.quaternion
  );


  return direction;

}


/* =================================================
   ПОИСК РЕСУРСА
================================================= */

function aimResource(){

  const origin =
    camera.getWorldPosition(
      new THREE.Vector3()
    );


  const direction =
    getForward();


  let best = null;

  let bestDistance = 4.5;


  for(
    const resource of resources
  ){

    if(
      !resource.alive
    )
      continue;


    const center =
      resource.group.position
        .clone();


    center.y += 1.1;


    const to =
      center
        .sub(origin);


    const distance =
      to.length();


    if(
      distance >
      bestDistance +
      resource.radius
    )
      continue;


    const projection =
      to.dot(direction);


    if(
      projection <= 0
    )
      continue;


    const closest =
      direction
        .clone()
        .multiplyScalar(
          projection
        );


    const perpendicular =
      to
        .clone()
        .sub(closest)
        .length();


    if(
      perpendicular <
      resource.radius + .45 &&
      distance <
      bestDistance
    ){

      best =
        resource;

      bestDistance =
        distance;

    }

  }


  return best;

}


/* =================================================
   ПОИСК МЕДВЕДЯ
================================================= */

function aimBear(){

  const origin =
    camera.getWorldPosition(
      new THREE.Vector3()
    );


  const direction =
    getForward();


  let closest = null;

  let closestDistance = 4.2;


  for(
    const bear of bears
  ){

    if(
      !bear.alive
    )
      continue;


    const center =
      bear.group.position
        .clone();


    center.y += 1.2;


    const to =
      center
        .sub(origin);


    const distance =
      to.length();


    if(
      distance >
      closestDistance
    )
      continue;


    const projection =
      to.dot(direction);


    if(
      projection <= 0
    )
      continue;


    const closestPoint =
      direction
        .clone()
        .multiplyScalar(
          projection
        );


    const perpendicular =
      to
        .clone()
        .sub(
          closestPoint
        )
        .length();


    if(
      perpendicular < 1.3
    ){

      closest =
        bear;

      closestDistance =
        distance;

    }

  }


  return closest;

}

<script type="module">

/* =================================================

================================================= */

let handAnimation = null;

let handAnimationTime = 0;


/*
  0 = обычное состояние
  1 = удар
*/

function startHandAnimation(type){

  if(handAnimation)
    return;

  handAnimation = type;
  handAnimationTime = 0;

}


/* =================================================
   ОБНОВЛЕНИЕ АНИМАЦИИ
================================================= */

function updateHandAnimation(dt){

  if(!handAnimation)
    return;


  handAnimationTime += dt;


  const duration =
    handAnimation === "spear"
      ? .28
      : .24;


  const t =
    Math.min(
      handAnimationTime /
      duration,
      1
    );


  /*
    Плавное движение:
    сначала вперёд/вниз,
    потом обратно.
  */

  const wave =
    Math.sin(
      t * Math.PI
    );


  if(
    handAnimation === "stone"
  ){

    stoneHeld.visible = true;
    spear.visible = false;


    /*
      Камень слегка сверху вниз.
    */

    hand.position.z =
      -.5 -
      wave * .16;


    hand.position.y =
      -.3 -
      wave * .12;


    hand.rotation.x =
      wave * .18;


  }


  if(
    handAnimation === "spear"
  ){

    spear.visible = true;
    stoneHeld.visible = false;


    /*
      Копьё немного подаётся вперёд
      и возвращается назад.
    */

    hand.position.z =
      -.5 -
      wave * .32;


    hand.position.y =
      -.3 +
      wave * .04;


    hand.rotation.x =
      -.08 +
      wave * .10;

  }


  if(t >= 1){

    handAnimation = null;

    handAnimationTime = 0;


    hand.position.set(
      .08,
      -.3,
      -.5
    );


    hand.rotation.set(
      0,
      0,
      0
    );

  }

}

  }else{

    /*
      За обычный удар
      тоже немного ресурсов.
    */

    inv[resource.drop]++;


  }


  updateResources();

}

/* =================================================
   УРОН МЕДВЕДЮ
================================================= */

function hitBear(
  bear,
  damageAmount
){

  if(
    !bear ||
    !bear.alive
  )
    return;


  bear.hp -=
    damageAmount;


  bear.state =
    "chase";


  /*
    Медведь погиб.
  */

  if(
    bear.hp <= 0
  ){

    bear.hp = 0;

    bear.alive = false;


    /*
      Ложится на бок.
    */

    bear.group.rotation.z =
      Math.PI / 2;


    /*
      Мясо.
    */

    inv.meat += 3;


    updateResources();

  }

}

/* =================================================
   ИИ МЕДВЕДЕЙ
================================================= */

function updateBears(dt){

  for(
    const bear of bears
  ){

    if(
      !bear.alive
    )
      continue;


    const p =
      bear.group.position;


    const dx =
      player.pos.x -
      p.x;


    const dz =
      player.pos.z -
      p.z;


    const distance =
      Math.hypot(
        dx,
        dz
      );


    /*
      Медведь замечает игрока.
    */

    if(
      player.alive &&
      distance < 14
    ){

      bear.state =
        "chase";

    }


    /*
      Медведь перестаёт преследовать.
    */

    else if(
      bear.state === "chase" &&
      distance > 28
    ){

      bear.state =
        "wander";

    }


    let speed = 0;


    /*
      ПРЕСЛЕДОВАНИЕ
    */

    if(
      bear.state === "chase" &&
      player.alive
    ){

      bear.dir =
        Math.atan2(
          dx,
          dz
        );


      speed =
        distance > 2.3
          ? 3.5
          : 0;


      bear.attackCd -= dt;


      /*
        Атака игрока.
      */

      if(
        distance < 2.6 &&
        bear.attackCd <= 0
      ){

        bear.attackCd =
          1.6;


        damagePlayer(16);

      }

    }


    /*
      БРОДЯЧИЙ РЕЖИМ
    */

    else{

      bear.timer -= dt;


      if(
        bear.timer <= 0
      ){

        bear.timer =
          rand(1.5,4);


        bear.dir =
          rand(
            0,
            Math.PI * 2
          );

      }


      speed = 1.3;

    }


    /*
      ДВИЖЕНИЕ
    */

    if(speed > 0){

      const nx =
        p.x +
        Math.sin(
          bear.dir
        ) *
        speed *
        dt;


      const nz =
        p.z +
        Math.cos(
          bear.dir
        ) *
        speed *
        dt;


      if(
        Math.hypot(
          nx,
          nz
        ) < 88 &&
        terrainHeight(
          nx,
          nz
        ) > WATER + .4
      ){

        p.x = nx;

        p.z = nz;

      }

    }


    /*
      Высота медведя.
    */

    p.y =
      terrainHeight(
        p.x,
        p.z
      );


    /*
      Поворот.
    */

    bear.group.rotation.y =
      bear.dir -
      Math.PI / 2;


    /*
      Простая анимация лап.
    */

    bear.walk +=
      dt *
      speed *
      4;


    if(speed > .1){

      bear.legs[0].rotation.z =
        Math.sin(
          bear.walk
        ) * .18;


      bear.legs[1].rotation.z =
        -Math.sin(
          bear.walk
        ) * .18;


      bear.legs[2].rotation.z =
        -Math.sin(
          bear.walk
        ) * .18;


      bear.legs[3].rotation.z =
        Math.sin(
          bear.walk
        ) * .18;

    }

  }

}


/* =================================================
   УРОН ИГРОКУ
================================================= */

function damagePlayer(amount){

  if(
    !player.alive
  )
    return;


  player.hp -=
    amount;


  player.hp =
    clamp(
      player.hp,
      0,
      100
    );


  updateHealth();


  if(
    player.hp <= 0
  ){

    playerDeath();

  }

}

================================================= */

function playerDeath(){

  if(
    !player.alive
  )
    return;


  player.alive = false;


  movement.x = 0;
  movement.y = 0;


  const death =
    document.getElementById(
      "death"
    );


  if(death){

    death.style.display =
      "flex";

  }

}

let showFPS = true;

let frames = 0;

let fpsTime =
  performance.now();


const fpsElement =
  document.getElementById(
    "fps"
  );


const fpsButton =
  document.getElementById(
    "fpsButton"
  );

  document.getElementById(
    "fpsStatus"
  );


if(fpsButton){

  fpsButton.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();


      showFPS =
        !showFPS;


      if(fpsStatus){

        fpsStatus.textContent =
          showFPS
            ? "ВКЛ"
            : "ВЫКЛ";

      }


      if(
        !showFPS &&
        fpsElement
      ){

        fpsElement.style.display =
          "none";

      }

    }
  );

}


/* =================================================
   FPS LOOP
================================================= */

function updateFPS(){

  frames++;


  const now =
    performance.now();


  if(
    now - fpsTime >= 500
  ){

    const value =
      Math.round(
        frames /
        (
          (now-fpsTime) /
          1000
        )
      );


    if(fpsElement){

      fpsElement.textContent =
        "FPS: " + value;


      if(
        showFPS &&
        window.gameStarted
      ){

        fpsElement.style.display =
          "block";

      }

    }


    frames = 0;

    fpsTime = now;

  }


  requestAnimationFrame(
    updateFPS
  );

}


updateFPS();


/* =================================================
   ОСНОВНОЙ GAME LOOP
================================================= */

const gameClock =
  new THREE.Clock();


function gameLoop(){

  requestAnimationFrame(
    gameLoop
  );


  const dt =
    Math.min(
      .05,
      gameClock.getDelta()
    );


  if(
    window.gameStarted
  ){

    updatePlayer(dt);

    updateBears(dt);

    updateHandAnimation(dt);


    if(
      actionCooldown > 0
    ){

      actionCooldown -= dt;

    }


    /*
      Лёгкое движение воды.
    */

    if(
      typeof water !==
      "undefined"
    ){

      water.position.y =
        WATER +
        Math.sin(
          performance.now() *
          .001
        ) * .05;

    }

  }


  renderer.render(
    scene,
    camera
  );

}


gameLoop();
