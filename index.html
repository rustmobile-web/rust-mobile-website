<style>

/* =====================================================
   ОСНОВА
===================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #050505;
  color: white;

  font-family: Arial, sans-serif;

  touch-action: none;
  user-select: none;
}

body {
  position: fixed;
}

button {
  font-family: Arial, sans-serif;
  touch-action: manipulation;
}

#game {
  position: fixed;
  inset: 0;

canvas {
  display: block;

  width: 100%;
  height: 100%;

/* =====================================================
   ГЛАВНОЕ МЕНЮ
===================================================== */

#menu {

  position: fixed;
  inset: 0;

  z-index: 1000;

  display: flex;

  flex-direction: column;

  align-items: flex-end;
  justify-content: center;

  padding: 25px;

  background:
    radial-gradient(
      circle at 85% 20%,
      rgba(220,0,0,.35),
      transparent 35%

    linear-gradient(
      135deg,
      #050505,
      #170707,
      #050505
    );
}

.logo {

  margin-right: 5px;
  margin-bottom: 45px;

  font-size: 31px;

  font-weight: 900;

  letter-spacing: 2px;

  text-align: right;
}

.logo span {
  color: #e00000;
}

.menuButton {

  width: 230px;
  height: 58px;

  margin: 7px 0;

  border: 1px solid #d40000;

  border-radius: 8px;

  background: rgba(20,20,20,.95);

  color: white;

  font-size: 17px;

  font-weight: bold;

  letter-spacing: 1px;
}

.menuButton:active {

  background: #c90000;

  transform: scale(.96);
}


/* =====================================================
   НАСТРОЙКИ
===================================================== */

#settings {

  position: fixed;
  inset: 0;

  z-index: 1100;

  display: none;

  padding: 30px;

  background:
    linear-gradient(
      135deg,
      #050505,
      #160606,
      #050505
    );
}

.settingsTitle {

  margin: 30px 0;

  text-align: center;

  font-size: 28px;

  color: #e00000;
}

.settingsBox {

  width: min(400px, 94vw);

  margin: auto;

  padding: 20px;

  border: 1px solid #333;

  border-radius: 12px;

  background: #111;
}

.settingsBox p {
  font-size: 17px;
}

#fpsStatus {
  color: #e00000;
}

.backButton {
  margin-top: 20px;
}


/* =====================================================
   FPS
===================================================== */

#fps {

  position: fixed;

  top: 10px;
  right: 10px;

  z-index: 500;

  padding: 5px 9px;

  border-radius: 5px;

  background: rgba(0,0,0,.6);

  color: white;

  font-size: 13px;

  font-weight: bold;

  display: none;
}


/* =====================================================
   HUD
===================================================== */

#hud {

  position: fixed;

  inset: 0;

  z-index: 400;

  pointer-events: none;

  display: none;
}

.panel {

  background:
    rgba(10,10,10,.6);

  border:
    1px solid
    rgba(255,255,255,.25);

  border-radius: 10px;

  backdrop-filter: blur(5px);
}


/* =====================================================
   ВЕРХНИЙ HUD
===================================================== */

#top {

  position: absolute;

  top: 10px;
  left: 10px;

  display: flex;

  gap: 8px;
}

#health {

  width: 190px;

  padding: 8px;

  font-size: 11px;
}

.healthBar {

  height: 8px;

  margin-top: 5px;

  background: #222;

  border-radius: 5px;

  overflow: hidden;
}

#healthFill {

  width: 100%;
  height: 100%;

  background:
    linear-gradient(
      90deg,
      #b00000,
      #ff3333
    );

  transition:
    width .15s ease;
}

#resources {

  padding:
    7px 10px;

  font-size: 12px;

  line-height: 1.5;
}

#resources b {
  color: #ffdddd;
}


/* =====================================================
   ПРИЦЕЛ
===================================================== */

#crosshair {

  position: fixed;

  left: 50%;
  top: 50%;

  width: 20px;
  height: 20px;

  transform:
    translate(-50%, -50%);

  pointer-events: none;
}

#crosshair:before,
#crosshair:after {

  content: "";

  position: absolute;

  background: white;

  box-shadow:
    0 0 3px black;
}

#crosshair:before {

  width: 2px;
  height: 16px;

  left: 9px;
  top: 2px;
}

#crosshair:after {

  width: 16px;
  height: 2px;

  left: 2px;
  top: 9px;
}


/* =====================================================
   ЦЕЛЬ
===================================================== */

#target {

  position: fixed;

  left: 50%;
  top: calc(50% + 25px);

  transform:
    translateX(-50%);

  padding:

  border-radius: 8px;

  background:
    rgba(0,0,0,.6);

}


/* =====================================================

===================================================== */

/* =====================================================
   АДАПТАЦИЯ ПОД ТЕЛЕФОН
===================================================== */

/* =====================================================
   АНИМАЦИЯ УДАРА РЕСУРСА
===================================================== */

.resourceHit {

  animation:
    resourceHitAnim .18s ease-out;
}

@keyframes resourceHitAnim {

  0% {
    transform:
      translateY(0)
      rotateX(0deg);
  }

  35% {
    transform:
      translateY(-.08px)
      rotateX(-7deg);
  }

  70% {
    transform:
      translateY(.05px)
      rotateX(5deg);
  }

  100% {
    transform:
      translateY(0)
      rotateX(0deg);
  }

}


/* =====================================================
   АНИМАЦИЯ РУКИ / ИНСТРУМЕНТА
===================================================== */

.toolSwing {

    toolSwingAnim .22s ease-out;

@keyframes toolSwingAnim {

  0% {

      rotateX(0deg);
  }

  35% {
    transform:
      translateZ(-.12px)
      rotateX(-18deg);
  }

  70% {

      translateZ(.08px)

  }

  100% {
    transform:
      translateZ(0)
      rotateX(0deg);
  }

}


/* =====================================================

<script type="module">

import * as THREE from "three";


// -----------------------------------------------------
// КОРОТКИЙ ДОСТУП К DOM

const $ =
  id => document.getElementById(id);


// -----------------------------------------------------

const rand =
  (a,b) =>
    a + Math.random() * (b-a);


const clamp =
  (v,a,b) =>
    Math.min(
      b,
      Math.max(a,v)
    );


// -----------------------------------------------------
// НАСТРОЙКИ МИРА
// -----------------------------------------------------

const WORLD = 120;

const WATER = -2.2;


// -----------------------------------------------------

  wood: 0,

// -----------------------------------------------------

  new THREE.Scene();

scene.background =

  );

  );


// -----------------------------------------------------

const camera =
  new THREE.PerspectiveCamera(

  );


// -----------------------------------------------------

// -----------------------------------------------------

const renderer =
  new THREE.WebGLRenderer({

    antialias: false,

  });


renderer.setPixelRatio(
  Math.min(
    devicePixelRatio,

  )
);


renderer.setSize(
  innerWidth,
  innerHeight
);


$("game")
  .appendChild(
    renderer.domElement
  );


// -----------------------------------------------------
// RESIZE
// -----------------------------------------------------

addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


// -----------------------------------------------------

scene.add(
  new THREE.HemisphereLight(
    0xcfe6ff,
    0x39452b,
    1
  )
);


const sun =
  new THREE.DirectionalLight(
    0xfff0cf,
    1.1
  );


sun.position.set(
  40,
  70,
  20
);


scene.add(sun);

<script type="module">

/*
  Эта часть продолжает код после создания
  THREE.Scene / Camera / Renderer.
*/

/* ================= НАСТРОЙКИ МИРА ================= */

const WORLD_SIZE = 120;
const WATER_LEVEL = -2.2;

/* ================= ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ================= */

function randomRange(min, max) {
  return min + Math.random() * (max - min);
}

function clampValue(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

/* ================= ВЫСОТА ЗЕМЛИ ================= */

function getTerrainHeight(x, z) {

  let height =
    Math.sin(x * 0.045) * 2.4 +
    Math.cos(z * 0.05) * 2.2 +
    Math.sin((x + z) * 0.021) * 3.4;

  height +=
    Math.sin(x * 0.12) * 0.35 +
    Math.cos(z * 0.14) * 0.35;

  /*
    Небольшая извилистая река.
  */

  const river =
    Math.exp(
      -Math.pow(
        (z - Math.sin(x * 0.03) * 12) / 8,
        2
      )
    ) * 6.5;

  height -= river;

  /*
    Края карты немного ниже.
  */

  const distance =
    Math.sqrt(x * x + z * z);

  height -=
    Math.max(
      0,
      (distance - 88) * 0.5
    );

  return height;
}

/* ================= ЗЕМЛЯ ================= */

const terrainGeometry =
  new THREE.PlaneGeometry(
    WORLD_SIZE * 2,
    WORLD_SIZE * 2,
    140,
    140
  );

terrainGeometry.rotateX(-Math.PI / 2);

const terrainPositions =
  terrainGeometry.attributes.position;

const terrainColors = [];

const grassColor =
  new THREE.Color(0x5f8f3e);

const dryGrassColor =
  new THREE.Color(0x8d9a4d);

const dirtColor =
  new THREE.Color(0x796143);

const mountainColor =
  new THREE.Color(0x888985);

const sandColor =
  new THREE.Color(0xc9bd8e);

for (
  let i = 0;
  i < terrainPositions.count;
  i++
) {

  const x =
    terrainPositions.getX(i);

  const z =
    terrainPositions.getZ(i);

  const y =
    getTerrainHeight(x, z);

  terrainPositions.setY(i, y);

  let color;

  if (y < WATER_LEVEL + 0.7) {

    color = sandColor;

  } else if (y > 7) {

    color = mountainColor;

  } else if (y > 4.5) {

    color = dirtColor;

  } else if (
    Math.sin(x * 0.05) +
    Math.cos(z * 0.04) > 0.6
  ) {

    color = dryGrassColor;

  } else {

    color = grassColor;

  }

  terrainColors.push(
    color.r,
    color.g,
    color.b
  );
}

terrainGeometry.setAttribute(
  "color",
  new THREE.Float32BufferAttribute(
    terrainColors,
    3
  )
);

terrainGeometry.computeVertexNormals();

const terrainMesh =
  new THREE.Mesh(
    terrainGeometry,
    new THREE.MeshLambertMaterial({
      vertexColors: true
    })
  );

scene.add(terrainMesh);

/* ================= ВОДА ================= */

const waterMesh =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      WORLD_SIZE * 2.4,
      WORLD_SIZE * 2.4
    ),
    new THREE.MeshLambertMaterial({
      color: 0x2e6d85,
      transparent: true,
      opacity: 0.78
    })
  );

waterMesh.rotation.x =
  -Math.PI / 2;

waterMesh.position.y =
  WATER_LEVEL;

scene.add(waterMesh);

/* ================= МАТЕРИАЛЫ ================= */

const resourceMaterials = {

  bark:
    new THREE.MeshLambertMaterial({
      color: 0x60432d
    }),

  leaf:
    new THREE.MeshLambertMaterial({
      color: 0x3f7735
    }),

  leafLight:
    new THREE.MeshLambertMaterial({
      color: 0x58883a
    }),

  pine:
    new THREE.MeshLambertMaterial({
      color: 0x2e5b32
    }),

  stone:
    new THREE.MeshStandardMaterial({
      color: 0x555555,
      roughness: 1,
      metalness: 0,
      flatShading: true
    }),

  iron:
    new THREE.MeshLambertMaterial({
      color: 0xa66f45,
      flatShading: true
    }),

  sulfur:
    new THREE.MeshStandardMaterial({
      color: 0xa49b5a,
      roughness: 1,
      metalness: 0,
      flatShading: true
    })

};

/* ================= НЕРОВНЫЙ КАМЕНЬ ================= */

function createBumpyGeometry(radius) {

  const geometry =
    new THREE.IcosahedronGeometry(
      radius,
      1
    );

  const positions =
    geometry.attributes.position;

  for (
    let i = 0;
    i < positions.count;
    i++
  ) {

    const x = positions.getX(i);
    const y = positions.getY(i);
    const z = positions.getZ(i);

    const noise =
      1 +
      Math.sin(x * 5) *
      Math.cos(y * 4) *
      Math.sin(z * 6) *
      0.18;

    positions.setXYZ(
      i,
      x * noise,
      y * noise,
      z * noise
    );
  }

  geometry.computeVertexNormals();

  return geometry;
}

/* ================= РЕСУРСЫ ================= */

const worldResources = [];

function addWorldResource(group, data) {

  const x = group.position.x;
  const z = group.position.z;

  group.position.y =
    getTerrainHeight(x, z);

  scene.add(group);

  const resource = {

    group,

    type: data.type,
    name: data.name,

    hp: data.maxHp,
    maxHp: data.maxHp,

    radius: data.radius,

    drop: data.drop,
    dropAmount: data.dropAmount,

    alive: true,

    /*
      Состояние анимации удара.
    */

    hitAnimation: 0,

    hitAnimationTime: 0,

    hitAnimationDuration: 0.16,

    /*
      Сохраняем исходную позицию,
      чтобы камень мог слегка подпрыгнуть.
    */

    baseY:
      getTerrainHeight(x, z),

    baseRotationX:
      group.rotation.x,

    baseRotationZ:
      group.rotation.z

  };

  worldResources.push(resource);

  return resource;
}

/* ================= АНИМАЦИЯ УДАРА РЕСУРСА ================= */

function playResourceHitAnimation(resource) {

  if (!resource || !resource.alive)
    return;

  /*
    Начинаем анимацию.

    Камень слегка идёт:
    вверх → вниз.

    Без резкого движения.
  */

  resource.hitAnimation = 1;
  resource.hitAnimationTime = 0;
}

/* ================= ОБНОВЛЕНИЕ АНИМАЦИИ РЕСУРСА ================= */

function updateResourceAnimations(dt) {

  for (
    const resource of worldResources
  ) {

    if (!resource.alive)
      continue;

    if (
      resource.hitAnimation <= 0
    ) {

      /*
        Возвращаем объект
        в исходное положение.
      */

      resource.group.position.y =
        resource.baseY;

      continue;
    }

    resource.hitAnimationTime += dt;

    const progress =
      resource.hitAnimationTime /
      resource.hitAnimationDuration;

    if (progress >= 1) {

      resource.hitAnimation = 0;

      resource.group.position.y =
        resource.baseY;

      resource.group.rotation.x =
        resource.baseRotationX;

      resource.group.rotation.z =
        resource.baseRotationZ;

      continue;
    }

    /*
      0 → 1 → 0

      Получается мягкое
      движение вверх-вниз.
    */

    const wave =
      Math.sin(progress * Math.PI);

    /*
      Очень маленькая высота,
      чтобы камень не выглядел
      так, будто он подпрыгивает.
    */

    const lift =
      wave * 0.16;

    resource.group.position.y =
      resource.baseY + lift;

    /*
      Лёгкое покачивание.
    */

    resource.group.rotation.x =
      resource.baseRotationX +
      Math.sin(progress * Math.PI * 2) *
      0.025;

    resource.group.rotation.z =
      resource.baseRotationZ +
      Math.cos(progress * Math.PI * 2) *
      0.02;
  }
}

/* ================= ДЕРЕВО ================= */

function createTree(x, z, treeType) {

  const group =
    new THREE.Group();

  group.position.set(
    x,
    0,
    z
  );

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.25,
        0.45,
        4,
        7
      ),
      resourceMaterials.bark
    );

  trunk.position.y = 2;

  group.add(trunk);

  if (treeType === 0) {

    /*
      Хвойное дерево.
    */

    for (
      let i = 0;
      i < 3;
      i++
    ) {

      const cone =
        new THREE.Mesh(
          new THREE.ConeGeometry(
            2.1 - i * 0.45,
            2.4,
            7
          ),
          resourceMaterials.pine
        );

      cone.position.y =
        3.2 + i * 1.25;

      group.add(cone);
    }

  } else {

    const crown =
      new THREE.Mesh(
        createBumpyGeometry(
          treeType === 1
            ? 2.2
            : 1.7
        ),
        treeType === 1
          ? resourceMaterials.leaf
          : resourceMaterials.leafLight
      );

    crown.position.y =
      treeType === 1
        ? 4.3
        : 5;

    crown.scale.y = 0.8;

    group.add(crown);
  }

  group.scale.setScalar(
    randomRange(0.85, 1.2)
  );

  group.rotation.y =
    randomRange(0, Math.PI * 2);

  return addWorldResource(
    group,
    {
      type: "tree",
      name: "Дерево",

      maxHp: 5,

      radius: 1.1,

      drop: "wood",

      dropAmount: 2
    }
  );
}

/* ================= РУДА ================= */

function createOre(x, z, type) {

  const group =
    new THREE.Group();

  group.position.set(
    x,
    0,
    z
  );

  const base =
    new THREE.Mesh(
      createBumpyGeometry(1.15),
      resourceMaterials.stone
    );

  base.scale.y = 0.7;
  base.position.y = 0.5;

  group.add(base);

  let material;

  if (type === "iron") {

    material =
      resourceMaterials.iron;

  } else if (type === "sulfur") {

    material =
      resourceMaterials.sulfur;

  } else {

    material =
      resourceMaterials.stone;
  }

  for (
    let i = 0;
    i < 4;
    i++
  ) {

    const piece =
      new THREE.Mesh(
        createBumpyGeometry(
          type === "stone"
            ? 0.5
            : 0.3
        ),
        material
      );

    piece.position.set(
      randomRange(-0.7, 0.7),
      randomRange(0.5, 1),
      randomRange(-0.7, 0.7)
    );

    group.add(piece);
  }

  const names = {

    stone: "Камень",

    iron: "Железо",

    sulfur: "Сера"

  };

  return addWorldResource(
    group,
    {
      type: "ore",

      name: names[type],

      maxHp:
        type === "stone"
          ? 4
          : 6,

      radius: 1.3,

      drop: type,

      dropAmount:
        type === "stone"
          ? 3
          : 2
    }
  );
}

/* ================= ПРОВЕРКА ЗЕМЛИ ================= */

function isLand(x, z) {

  return (
    getTerrainHeight(x, z) >
    WATER_LEVEL + 0.6
  );
}

/* ================= РАССЫПАНИЕ ОБЪЕКТОВ ================= */

function scatterWorldObjects(
  count,
  callback
) {

  let placed = 0;
  let attempts = 0;

  while (
    placed < count &&
    attempts < count * 30
  ) {

    attempts++;

    const x =
      randomRange(-82, 82);

    const z =
      randomRange(-82, 82);

    if (!isLand(x, z))
      continue;

    /*
      Не ставим ресурсы прямо
      возле центра появления.
    */

    if (
      Math.hypot(x, z) < 8
    )
      continue;

    callback(x, z);

    placed++;
  }
}

/* ================= СОЗДАНИЕ МИРА ================= */

scatterWorldObjects(
  75,
  (x, z) => {

    createTree(
      x,
      z,
      Math.floor(
        randomRange(0, 3)
      )
    );

  }
);

scatterWorldObjects(
  15,
  (x, z) => {

    createOre(
      x,
      z,
      "stone"
    );

  }
);

scatterWorldObjects(
  8,
  (x, z) => {

    createOre(
      x,
      z,
      "iron"
    );

  }
);

scatterWorldObjects(
  7,
  (x, z) => {

    createOre(
      x,
      z,
      "sulfur"
    );

  }
);

/* ================= ПОДГОТОВКА ВОДЫ ================= */

function updateWater(time) {

  if (!waterMesh)
    return;

  waterMesh.position.y =
    WATER_LEVEL +
    Math.sin(time * 0.001) * 0.05;
}

/* ================= ДОСТУП ДЛЯ ДРУГИХ ЧАСТЕЙ ================= */

window.worldResources =
  worldResources;

window.getTerrainHeight =
  getTerrainHeight;

window.playResourceHitAnimation =
  playResourceHitAnimation;

window.updateResourceAnimations =
  updateResourceAnimations;

window.updateWater =
  updateWater;

window.WATER_LEVEL =
  WATER_LEVEL;

</script>

<script>

const hotbarSlots =
  document.querySelectorAll(
    "#hotbar .slot"
  );

function selectHotbarSlot(slot) {

  if (!slot)
    return;

  hotbarSlots.forEach(
    s => s.classList.remove("active")
  );

  slot.classList.add("active");

  const item =
    slot.dataset.item || "stone";

  if (item === "spear") {

    if (
      window.weaponState &&
      window.weaponState.spearCrafted
    ) {

      window.equipSpear();

    }

  } else {

    window.equipStone();

  }
}

/* ================= КЛИК ПО СЛОТАМ ================= */

hotbarSlots.forEach(
  (slot, index) => {

    slot.addEventListener(
      "pointerdown",
      e => {

        e.preventDefault();
        e.stopPropagation();

        selectHotbarSlot(slot);

      }
    );

  }
);

/* ================= ДОБАВИТЬ КОПЬЁ ================= */

function putSpearInHotbar() {

  let targetSlot = null;

  for (
    const slot of hotbarSlots
  ) {

    if (
      !slot.textContent.trim()
    ) {

      targetSlot = slot;
      break;

    }

  }

  /*
    Если свободного места нет,
    берём последний слот.
  */

  if (!targetSlot) {

    targetSlot =
      hotbarSlots[
        hotbarSlots.length - 1
      ];

  }

  targetSlot.textContent =
    "🗡️";

  targetSlot.dataset.item =
    "spear";

  targetSlot.title =
    "Копьё";

    targetSlot
  );

      }

      /*
        Возвращаем медведей.
      */

      if (
        typeof bears !==
        "undefined"
      ) {

        for (
          const bear of bears
        ) {

          bear.alive = true;
          bear.hp = bear.maxHp;
          bear.state = "wander";

          bear.group.rotation.z = 0;

        }

      }

      if (
        typeof spawnPlayer ===
        "function"
      ) {

        spawnPlayer();

      }

    }
  );

}

/* ================= СМЕРТЬ ================= */

function playerDeath() {

  if (
    !player.alive
  )
    return;

  player.alive = false;

  player.hp = 0;

  if (
    typeof updateHealth ===
    "function"
  ) {

    updateHealth();

  }

  const death =
    document.getElementById(
      "death"
    );

  if (death) {

    death.style.display =
      "flex";

  }

}

window.playerDeath =
  playerDeath;

/* ================= УРОН ================= */

function damagePlayer(amount) {

  if (
    !player.alive
  )
    return;

  player.hp -= amount;

  player.hp =
    Math.max(
      0,
      player.hp
    );

  if (
    typeof updateHealth ===
    "function"
  ) {

    updateHealth();

  }

  if (
    player.hp <= 0
  ) {

    playerDeath();

  }

}

window.damage =
  damagePlayer;

/* ================= КАМЕРА ================= */

function updateCameraFromPlayer() {

  if (!player)
    return;

  camera.position.set(
    player.pos.x,
    player.pos.y +
      player.eye,
    player.pos.z
  );

  camera.rotation.order =
    "YXZ";

  camera.rotation.y =
    player.yaw;

  camera.rotation.x =
    player.pitch;

}

/* ================= ОСНОВНОЙ ЦИКЛ ================= */

const gameClock =
  new THREE.Clock();

function gameLoop() {

  requestAnimationFrame(
    gameLoop
  );

  const dt =
    Math.min(
      0.05,
      gameClock.getDelta()
    );

  /*
    Игровая логика.
  */

  if (gameStarted) {

    if (
      typeof updatePlayer ===
      "function"
    ) {

      updatePlayer(dt);

    }

    if (
      typeof updateBears ===
      "function"
    ) {

      updateBears(dt);

    }

    /*
      Анимация копья/камня.
    */

    if (
      typeof updateWeaponAnimation ===
      "function"
    ) {

      updateWeaponAnimation(dt);

    }

    /*
      Анимация добываемых объектов.
    */

    if (
      typeof updateResourceAnimations ===
      "function"
    ) {

      updateResourceAnimations(dt);

    }

    /*
      Вода.
    */

    if (
      typeof updateWater ===
      "function"
    ) {

      updateWater(
        performance.now()
      );

    }

    /*
      Кулдаун удара.
    */

    if (
      typeof cooldown !==
      "undefined" &&
      cooldown > 0
    ) {

      cooldown -= dt;

    }

  }

  /*
    Рендер.
  */

  renderer.render(
    scene,
    camera
  );

}

/* ================= ЗАПУСК ================= */

gameLoop();

/* ================= ПЕРВОНАЧАЛЬНЫЙ UI ================= */

updateGameUI();

/* ================= FPS ================= */

let fpsFrames = 0;

let fpsStart =
  performance.now();

function fpsLoop() {

  requestAnimationFrame(
    fpsLoop
  );

  fpsFrames++;

  const now =
    performance.now();

  const elapsed =
    now - fpsStart;

  if (
    elapsed >= 500
  ) {

    const fps =
      Math.round(
        fpsFrames /
        (elapsed / 1000)
      );

    const fpsElement =
      document.getElementById(
        "fps"
      );

    if (
      fpsElement &&
      typeof showFPS !==
      "undefined" &&
      showFPS &&
      gameStarted
    ) {

      fpsElement.textContent =
        "FPS: " + fps;

      fpsElement.style.display =
        "block";

    }

    fpsFrames = 0;
    fpsStart = now;

  }

}

fpsLoop();

</script>
