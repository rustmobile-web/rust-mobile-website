<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1,
maximum-scale=1, user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#080808">

<title>Rust Mobile Web</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  touch-action:none;
  user-select:none;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

/* ===== MENU ===== */

#menu{
  position:fixed;
  inset:0;
  z-index:1000;

  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:center;

  padding:25px;

  background:
    radial-gradient(
      circle at 85% 20%,
      rgba(220,0,0,.35),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #050505,
      #170707,
      #050505
    );
}

.logo{
  margin-right:5px;
  margin-bottom:45px;

  font-size:31px;
  font-weight:900;
  letter-spacing:2px;
  text-align:right;
}

.logo span{
  color:#e00000;
}

.menuButton{
  width:230px;
  height:58px;

  margin:7px 0;

  border:1px solid #d40000;
  border-radius:8px;

  background:rgba(20,20,20,.95);

  color:white;

  font-size:17px;
  font-weight:bold;
  letter-spacing:1px;
}

.menuButton:active{
  background:#c90000;
  transform:scale(.96);
}

/* ===== SETTINGS ===== */

#settings{
  position:fixed;
  inset:0;
  z-index:1100;

  display:none;

  padding:30px;

  background:
    linear-gradient(
      135deg,
      #050505,
      #160606,
      #050505
    );
}

.settingsTitle{
  margin:30px 0;

  text-align:center;

  font-size:28px;
  color:#e00000;
}

.settingsBox{
  max-width:400px;
  margin:auto;

  padding:20px;

  border:1px solid #333;
  border-radius:12px;

  background:#111;
}

.settingsBox p{
  font-size:17px;
}

#fpsStatus{
  color:#e00000;
}

/* ===== FPS ===== */

#fps{
  position:fixed;

  top:10px;
  right:10px;

  z-index:500;

  padding:5px 9px;

  border-radius:5px;

  background:rgba(0,0,0,.6);

  color:white;

  font-size:13px;
  font-weight:bold;

  display:none;
}

/* ===== HUD ===== */

#hud{
  position:fixed;
  inset:0;

  pointer-events:none;

  display:none;
}

.panel{
  background:rgba(10,10,10,.6);
  border:1px solid rgba(255,255,255,.25);
  border-radius:10px;
  backdrop-filter:blur(5px);
}

#top{
  position:absolute;

  top:10px;
  left:10px;

  display:flex;
  gap:8px;
}

#health{
  width:190px;
  padding:8px;

  font-size:11px;
}

.healthBar{
  height:8px;

  margin-top:5px;

  background:#222;
  border-radius:5px;

  overflow:hidden;
}

#healthFill{
  width:100%;
  height:100%;

  background:linear-gradient(
    90deg,
    #b00000,
    #ff3333
  );
}

#resources{
  padding:7px 10px;

  font-size:12px;
  line-height:1.5;
}

#resources b{
  color:#ffdddd;
}

/* ===== CROSSHAIR ===== */

#crosshair{
  position:fixed;

  left:50%;
  top:50%;

  width:20px;
  height:20px;

  transform:translate(-50%,-50%);

  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";

  position:absolute;

  background:white;

  box-shadow:0 0 3px black;
}

#crosshair:before{
  width:2px;
  height:16px;

  left:9px;
  top:2px;
}

#crosshair:after{
  width:16px;
  height:2px;

  left:2px;
  top:9px;
}

/* ===== JOYSTICK ===== */

#joystick{
  position:fixed;

  left:20px;
  bottom:110px;

  width:125px;
  height:125px;

  border-radius:50%;

  border:2px solid rgba(255,255,255,.3);

  background:rgba(0,0,0,.35);

  pointer-events:auto;
}

#knob{
  position:absolute;

  left:50%;
  top:50%;

  width:55px;
  height:55px;

  margin-left:-27.5px;
  margin-top:-27.5px;

  border-radius:50%;

  background:rgba(255,255,255,.45);

  border:1px solid white;
}

/* ===== BUTTONS ===== */

#buttons{
  position:fixed;

  right:15px;
  bottom:105px;

  display:flex;
  flex-direction:column;

  gap:10px;

  align-items:flex-end;
}

.gameButton{
  width:75px;
  height:75px;

  border-radius:50%;

  border:1px solid rgba(255,255,255,.3);

  background:rgba(15,15,15,.65);

  color:white;

  font-size:11px;
  font-weight:bold;

  pointer-events:auto;
}

.gameButton.big{
  width:88px;
  height:88px;

  background:rgba(150,0,0,.55);
}

.gameButton:active{
  transform:scale(.94);
  background:#c00000;
}

/* ===== HOTBAR ===== */

#hotbar{
  position:fixed;

  left:50%;
  bottom:10px;

  transform:translateX(-50%);

  display:flex;
  gap:7px;

  pointer-events:auto;
}

.slot{
  width:55px;
  height:55px;

  border:2px solid #333;
  border-radius:9px;

  background:rgba(10,10,10,.65);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;

  pointer-events:auto;
}

.slot.active{
  border-color:#e00000;

  background:rgba(150,0,0,.45);
}

/* ===== DEATH ===== */

#death{
  position:fixed;
  inset:0;

  z-index:2000;

  display:none;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  background:rgba(20,0,0,.85);
}

#death h1{
  color:#ff2222;
  font-size:38px;
}

/* ===== TARGET ===== */

#target{
  position:fixed;

  left:50%;
  top:calc(50% + 25px);

  transform:translateX(-50%);

  padding:5px 10px;

  border-radius:8px;

  background:rgba(0,0,0,.6);

  font-size:12px;

  display:none;
}

</style>
</head>

<body>

<div id="game"></div>

<div id="menu">

  <div class="logo">
    RUST MOBILE <span>[web]</span>
  </div>

  <button class="menuButton" id="playButton">
    ИГРАТЬ
  </button>

  <button class="menuButton" id="settingsButton">
    НАСТРОЙКИ
  </button>

</div>

<div id="settings">

  <div class="settingsTitle">
    НАСТРОЙКИ
  </div>

  <div class="settingsBox">

    <p>
      FPS:
      <b id="fpsStatus">ВКЛ</b>
    </p>

    <button class="menuButton" id="fpsButton">
      ПОКАЗЫВАТЬ FPS
    </button>

    <button class="menuButton" id="backButton">
      НАЗАД
    </button>

  </div>

</div>

<div id="fps">
  FPS: 0
</div>

<div id="hud">

  <div id="top">

    <div class="panel" id="health">
      ЗДОРОВЬЕ

      <div class="healthBar">
        <div id="healthFill"></div>
      </div>
    </div>

    <div class="panel" id="resources">
      Дерево: <b id="wood">0</b><br>
      Камень: <b id="stone">0</b><br>
      Железо: <b id="iron">0</b><br>
      Сера: <b id="sulfur">0</b><br>
      Мясо: <b id="meat">0</b>
    </div>

  </div>

  <div id="crosshair"></div>

  <div id="target"></div>

  <div id="joystick">
    <div id="knob"></div>
  </div>

  <div id="buttons">

    <button class="gameButton" id="jump">
      ПРЫЖОК
    </button>

    <button class="gameButton" id="hit">
      УДАР
    </button>

    <button class="gameButton big" id="gather">
      ДОБЫТЬ
    </button>

  </div>

  <div id="hotbar">

    <div class="slot active">🪨</div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>

  </div>

</div>

<div id="death">

  <h1>ВЫ ПОГИБЛИ</h1>

  <p>Вас победил медведь</p>

  <button class="menuButton" id="respawn">
    ВОЗРОДИТЬСЯ
  </button>

</div>

<script type="importmap">
{
  "imports": {
    "three":
      "https://unpkg.com/three@0.169.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";

/* ===== BASIC ===== */

const $ = id =>
  document.getElementById(id);

const rand = (a,b) =>
  a + Math.random() * (b-a);

const clamp = (v,a,b) =>
  Math.min(b,Math.max(a,v));

const WORLD = 120;
const WATER = -2.2;

/* ===== SCENE ===== */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x9dbbd0);

scene.fog =
  new THREE.Fog(
    0x9dbbd0,
    55,
    150
  );

const camera =
  new THREE.PerspectiveCamera(
    72,
    innerWidth / innerHeight,
    .05,
    400
  );

const renderer =
  new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:
      "high-performance"
  });

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.5)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

$("game").appendChild(
  renderer.domElement
);

addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

/* ===== LIGHT ===== */

scene.add(
  new THREE.HemisphereLight(
    0xcfe6ff,
    0x39452b,
    1
  )
);

const sun =
  new THREE.DirectionalLight(
    0xfff0cf,
    1.1
  );

sun.position.set(
  40,70,20
);

scene.add(sun);

/* ===== TERRAIN ===== */

function terrainHeight(x,z){

  let h =
    Math.sin(x*.045)*2.4 +
    Math.cos(z*.05)*2.2 +
    Math.sin((x+z)*.021)*3.4;

  h +=
    Math.sin(x*.12)*.35 +
    Math.cos(z*.14)*.35;

  const river =
    Math.exp(
      -Math.pow(
        (z-Math.sin(x*.03)*12)/8,
        2
      )
    ) * 6.5;

  h -= river;

  const d =
    Math.sqrt(x*x+z*z);

  h -=
    Math.max(
      0,
      (d-88)*.5
    );

  return h;
}

const terrain =
  new THREE.PlaneGeometry(
    WORLD*2,
    WORLD*2,
    100,
    100
  );

terrain.rotateX(
  -Math.PI/2
);

const pos =
  terrain.attributes.position;

const colors=[];

const grass =
  new THREE.Color(0x5f8f3e);

const dry =
  new THREE.Color(0x8d9a4d);

const dirt =
  new THREE.Color(0x796143);

const rock =
  new THREE.Color(0x888985);

const sand =
  new THREE.Color(0xc9bd8e);

for(
  let i=0;
  i<pos.count;
  i++
){

  const x=pos.getX(i);
  const z=pos.getZ(i);

  const y=
    terrainHeight(x,z);

  pos.setY(i,y);

  let c;

  if(y<WATER+.7)
    c=sand;
  else if(y>7)
    c=rock;
  else if(y>4.5)
    c=dirt;
  else if(
    Math.sin(x*.05)+
    Math.cos(z*.04)>0.6
  )
    c=dry;
  else
    c=grass;

  colors.push(
    c.r,c.g,c.b
  );
}

terrain.setAttribute(
  "color",
  new THREE.Float32BufferAttribute(
    colors,3
  )
);

terrain.computeVertexNormals();

scene.add(
  new THREE.Mesh(
    terrain,
    new THREE.MeshLambertMaterial({
      vertexColors:true
    })
  )
);

/* ===== WATER ===== */

const water =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      WORLD*2.4,
      WORLD*2.4
    ),
    new THREE.MeshLambertMaterial({
      color:0x2e6d85,
      transparent:true,
      opacity:.78
    })
  );

water.rotation.x=
  -Math.PI/2;

water.position.y=
  WATER;

scene.add(water);

/* ===== MATERIALS ===== */

const materials={

  bark:
    new THREE.MeshLambertMaterial({
      color:0x60432d
    }),

  leaf:
    new THREE.MeshLambertMaterial({
      color:0x3f7735
    }),

  leaf2:
    new THREE.MeshLambertMaterial({
      color:0x58883a
    }),

  pine:
    new THREE.MeshLambertMaterial({
      color:0x2e5b32
    }),

  rock:
    new THREE.MeshStandardMaterial({
      color:0x3a3a38,
      roughness:1,
      flatShading:true
    }),

  iron:
    new THREE.MeshLambertMaterial({
      color:0xa66f45,
      flatShading:true
    }),

  sulfur:
    new THREE.MeshStandardMaterial({
      color:0xa49b5a,
      roughness:1,
      flatShading:true
    })

};

/* ===== BUMPY ===== */

function bumpy(r){

  const g=
    new THREE.IcosahedronGeometry(
      r,1
    );

  const p=
    g.attributes.position;

  for(
    let i=0;
    i<p.count;
    i++
  ){

    const x=p.getX(i);
    const y=p.getY(i);
    const z=p.getZ(i);

    const n=
      1+
      Math.sin(x*5)*
      Math.cos(y*4)*
      Math.sin(z*6)*.18;

    p.setXYZ(
      i,
      x*n,
      y*n,
      z*n
    );

  }

  g.computeVertexNormals();

  return g;
}

/* ===== INVENTORY ===== */

const inv={
  wood:0,
  stone:0,
  iron:0,
  sulfur:0,
  meat:0
};

window.gameInv=inv;

/* ===== RESOURCES ===== */

const resources=[];

function addResource(group,data){

  group.position.y=
    terrainHeight(
      group.position.x,
      group.position.z
    );

  scene.add(group);

  const r={
    group,
    ...data,
    hp:data.maxHp,
    alive:true
  };

  resources.push(r);

  return r;
}

/* ===== TREE ===== */

function makeTree(x,z,type){

  const g=
    new THREE.Group();

  g.position.set(x,0,z);

  const trunk=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .25,.45,4,7
      ),
      materials.bark
    );

  trunk.position.y=2;

  g.add(trunk);

  if(type===0){

    for(
      let i=0;
      i<3;
      i++
    ){

      const cone=
        new THREE.Mesh(
          new THREE.ConeGeometry(
            2.1-i*.45,
            2.4,
            7
          ),
          materials.pine
        );

      cone.position.y=
        3.2+i*1.25;

      g.add(cone);

    }

  }else{

    const crown=
      new THREE.Mesh(
        bumpy(
          type===1?2.2:1.7
        ),
        type===1?
          materials.leaf:
          materials.leaf2
      );

    crown.position.y=
      type===1?4.3:5;

    crown.scale.y=.8;

    g.add(crown);

  }

  g.scale.setScalar(
    rand(.85,1.2)
  );

  g.rotation.y=
    rand(0,Math.PI*2);

  return addResource(
    g,
    {
      type:"tree",
      name:"Дерево",
      maxHp:5,
      radius:1.1,
      drop:"wood",
      dropN:2
    }
  );
}

/* ===== ORE ===== */

function makeOre(x,z,type){

  const g=
    new THREE.Group();

  g.position.set(x,0,z);

  const base=
    new THREE.Mesh(
      bumpy(1.15),
      materials.rock
    );

  base.scale.y=.7;
  base.position.y=.5;

  g.add(base);

  const mat=
    type==="iron"
      ?materials.iron
      :type==="sulfur"
      ?materials.sulfur
      :materials.rock;

  for(
    let i=0;
    i<4;
    i++
  ){

    const n=
      new THREE.Mesh(
        bumpy(
          type==="stone"
            ?.5:.3
        ),
        mat
      );

    n.position.set(
      rand(-.7,.7),
      rand(.5,1),
      rand(-.7,.7)
    );

    g.add(n);
  }

  const names={
    stone:"Камень",
    iron:"Железная руда",
    sulfur:"Сера"
  };

  return addResource(
    g,
    {
      type:"ore",
      name:names[type],
      maxHp:
        type==="stone"?4:6,
      radius:1.3,
      drop:type,
      dropN:
        type==="stone"?3:2
    }
  );
}

/* ===== LAND ===== */

function land(x,z){

  return terrainHeight(x,z)>
    WATER+.6;
}

function scatter(count,callback){

  let placed=0;
  let tries=0;

  while(
    placed<count &&
    tries<count*30
  ){

    tries++;

    const x=rand(-82,82);
    const z=rand(-82,82);

    if(!land(x,z))
      continue;

    if(Math.hypot(x,z)<8)
      continue;

    callback(x,z);
    placed++;
  }
}

/* ===== WORLD ===== */

scatter(
  75,
  (x,z)=>
    makeTree(
      x,z,
      Math.floor(rand(0,3))
    )
);

scatter(
  15,
  (x,z)=>
    makeOre(x,z,"stone")
);

scatter(
  8,
  (x,z)=>
    makeOre(x,z,"iron")
);

scatter(
  7,
  (x,z)=>
    makeOre(x,z,"sulfur")
);
   /* ================= PLAYER ================= */

const player = {
  pos: new THREE.Vector3(0, 0, 6),
  vy: 0,
  yaw: 0,
  pitch: 0,
  hp: 100,
  eye: 1.7,
  onGround: true,
  alive: true
};

/* ================= HAND ================= */

const hand = new THREE.Group();

camera.add(hand);

hand.position.set(
  .08,
  -.30,
  -.50
);

const skin =
  new THREE.MeshLambertMaterial({
    color: 0xc08a62
  });

const sleeve =
  new THREE.MeshLambertMaterial({
    color: 0x555555
  });

/* рука */

const arm =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .08,
      .10,
      .5,
      8
    ),
    skin
  );

arm.rotation.set(
  1.15,
  0,
  -.25
);

arm.position.set(
  .06,
  -.20,
  .12
);

hand.add(arm);

/* рукав */

const cuff =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .10,
      .11,
      .16,
      8
    ),
    sleeve
  );

cuff.rotation.copy(
  arm.rotation
);

cuff.position.set(
  .10,
  -.36,
  .24
);

hand.add(cuff);

/* кулак */

const fist =
  new THREE.Mesh(
    bumpy(.11),
    skin
  );

fist.position.set(
  0,
  .02,
  -.03
);

hand.add(fist);

/* ================= КАМЕНЬ В РУКЕ ================= */

const stoneHeld =
  new THREE.Mesh(
    bumpy(.15),
    new THREE.MeshStandardMaterial({
      color: 0x999999,
      roughness: .9
    })
  );

stoneHeld.position.set(
  0,
  .06,
  -.08
);

hand.add(stoneHeld);

/* ================= КОПЬЁ ================= */

const spearGroup =
  new THREE.Group();

spearGroup.visible = false;

/* древко */

const spearWood =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .025,
      .035,
      1.65,
      8
    ),
    new THREE.MeshLambertMaterial({
      color: 0x6b4527
    })
  );

spearWood.rotation.z =
  Math.PI / 2;

spearWood.position.x =
  -.72;

spearGroup.add(
  spearWood
);

/* наконечник */

const spearTip =
  new THREE.Mesh(
    new THREE.ConeGeometry(
      .11,
      .38,
      6
    ),
    new THREE.MeshStandardMaterial({
      color: 0xaaaaaa,
      roughness: .7,
      metalness: .2
    })
  );

spearTip.rotation.z =
  -Math.PI / 2;

spearTip.position.x =
  .28;

spearGroup.add(
  spearTip
);

/* маленькая защита */

const spearGuard =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .055,
      .055,
      .18,
      8
    ),
    new THREE.MeshLambertMaterial({
      color: 0x444444
    })
  );

spearGuard.rotation.z =
  Math.PI / 2;

spearGuard.position.x =
  .08;

spearGroup.add(
  spearGuard
);

spearGroup.position.set(
  .05,
  -.08,
  -.42
);

spearGroup.rotation.set(
  0,
  0,
  -.18
);

hand.add(
  spearGroup
);

/* ================= ОРУЖИЕ ================= */

let selectedWeapon =
  "stone";

let spearCrafted = false;

/* ================= АНИМАЦИЯ УДАРА ================= */

let attackAnimation = 0;
let attackDirection = 0;

const handStart = {
  x: hand.position.x,
  y: hand.position.y,
  z: hand.position.z,
  rz: hand.rotation.z
};

function startAttackAnimation(){

  if(attackAnimation > 0)
    return;

  attackAnimation = 1;

  attackDirection = 1;
}

function updateHandAnimation(dt){

  if(attackAnimation <= 0){

    hand.position.x =
      THREE.MathUtils.lerp(
        hand.position.x,
        handStart.x,
        dt * 12
      );

    hand.position.y =
      THREE.MathUtils.lerp(
        hand.position.y,
        handStart.y,
        dt * 12
      );

    hand.rotation.z =
      THREE.MathUtils.lerp(
        hand.rotation.z,
        handStart.rz,
        dt * 12
      );

    return;
  }

  attackAnimation +=
    dt * 4.8;

  const t =
    Math.min(
      attackAnimation,
      2
    );

  /*
    0 → 1:
    рука идёт вперёд

    1 → 2:
    рука возвращается
  */

  if(t < 1){

    const p = t;

    hand.position.z =
      handStart.z -
      Math.sin(p * Math.PI / 2) * .30;

    hand.position.y =
      handStart.y +
      Math.sin(p * Math.PI) * .05;

  }else{

    const p = t - 1;

    hand.position.z =
      handStart.z -
      Math.cos(p * Math.PI / 2) * .30;

    hand.position.y =
      handStart.y +
      Math.sin((1-p) * Math.PI) * .05;
  }

  if(t >= 2){

    attackAnimation = 0;

    hand.position.set(
      handStart.x,
      handStart.y,
      handStart.z
    );

  }
}

const bears = [];

function makeBear(x,z){

    1.35,

    new THREE.Mesh(
      bumpy(.45),

    );

  const nose =
    new THREE.Mesh(

        .4,
        .26,
        .3
      ),
      dark
    );

  nose.position.set(
    .4,
    -.08,
    0
  );

  head.add(nose);

  for(
    const side of [-1,1]
  ){

    const ear =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .13,
          8,
          6
        ),
        fur
      );

    ear.position.set(
      -.1,
      .38,
      .24 * side
    );

    head.add(ear);
  }

  g.add(head);

  const legs = [];

  for(
    let i=0;
    i<4;

  ){

    const leg =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .16,
          .2,
          1.05,
          6
        ),
        fur
      );

    leg.position.set(
      i < 2 ? .75 : -.7,
      .52,
      i % 2 ? .45 : -.45
    );

    g.add(leg);

    legs.push(leg);
  }

  g.position.set(
    x,
    terrainHeight(x,z),
    z
  );

  scene.add(g);

  const bear = {
    group: g,
    head,
    legs,

    hp: 100,
    maxHp: 100,

    alive: true,

    state: "wander",

    dir: rand(
      0,
      Math.PI * 2
    ),

    timer: rand(1,3),

    attackCd: 0
  };

  bears.push(bear);

  return bear;
}

const joystick =

  x: 0,
  y: 0
};

let joystickId = null;

const joystickRadius = 50;

let center = {
  x: 0,
  y: 0
};

function joystickMove(e){

  let dx =
    e.clientX - center.x;

  let dy =
    e.clientY - center.y;

  const distance =
    Math.hypot(dx,dy);

  if(
    distance > joystickRadius
  ){

    dx =
      dx / distance *
      joystickRadius;

    dy =
      dy / distance *
      joystickRadius;
  }

  knob.style.transform =
    `translate(${dx}px,${dy}px)`;

  movement.x =
    dx / joystickRadius;

  movement.y =
    -dy / joystickRadius;
}

joystick.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    joystickId =
      e.pointerId;

    const r =
      joystick.getBoundingClientRect();

    center = {
      x: r.left + r.width / 2,
      y: r.top + r.height / 2
    };

    joystick.setPointerCapture(
      e.pointerId
    );

    joystickMove(e);
  }
);

joystick.addEventListener(
  "pointermove",
  e => {

    if(
      e.pointerId !==
      joystickId
    ) return;

    e.preventDefault();

    joystickMove(e);
  }
);

function joystickEnd(e){

  if(
    e.pointerId !==
    joystickId
  ) return;

  joystickId = null;

  movement.x = 0;
  movement.y = 0;

  knob.style.transform =
    "translate(0px,0px)";
}

/* ================= PLAYER MOVEMENT ================= */

function updatePlayer(dt){

  let mx =
    movement.x;

  let mz =
    movement.y;

  const length =
    Math.hypot(mx,mz);

  if(
    length > .05 &&
    player.alive
  ){

    mx /=
      Math.max(1,length);

    mz /=
      Math.max(1,length);

    const sin =
      Math.sin(player.yaw);

    const cos =
      Math.cos(player.yaw);

    const dx =
      -sin * mz +
      cos * mx;

    const dz =
      -cos * mz -
      sin * mx;

    const speed = 5.2;

    const nx =
      player.pos.x +
      dx * speed * dt;

    const nz =
      player.pos.z +
      dz * speed * dt;

    if(
      Math.hypot(nx,nz) < 92 &&
      terrainHeight(nx,nz)
        > WATER - .8
    ){

      let blocked = false;

      for(
        const r of resources
      ){

        if(!r.alive)
          continue;

        if(
          Math.hypot(
            nx -
            r.group.position.x,

            nz -
            r.group.position.z
          )
          <
          r.radius * .55
        ){

          blocked = true;
          break;
        }
      }

      if(!blocked){

        player.pos.x = nx;
        player.pos.z = nz;
      }
    }
  }

  player.vy -=
    17 * dt;

  player.pos.y +=
    player.vy * dt;

  const ground =
    terrainHeight(
      player.pos.x,
      player.pos.z
    );

  if(
    player.pos.y <=
    ground
  ){

    player.pos.y =
      ground;

    player.vy = 0;

    player.onGround =
      true;
  }

  camera.position.set(
    player.pos.x,
    player.pos.y +
      player.eye,
    player.pos.z
  );

  camera.rotation.order =
    "YXZ";

  camera.rotation.y =
    player.yaw;

  camera.rotation.x =
    player.pitch;
}

/* ================= AIM ================= */

function forward(){

  const v =
    new THREE.Vector3(
      0,
      0,
      -1
    );

  v.applyQuaternion(
    camera.quaternion
  );

  return v;
}

function aimResource(){

  const origin =
    camera.getWorldPosition(
      new THREE.Vector3()
    );

  const dir =
    forward();

  let best = null;
  let bestDist = 4.2;

  for(
    const r of resources
  ){

    if(!r.alive)
      continue;

    const center =
      r.group.position.clone();

    center.y += 1.2;

    const to =
      center.clone()
        .sub(origin);

    const distance =
      to.length();

    if(
      distance >
      bestDist + r.radius
    ){
      continue;
    }

    const projection =
      to.dot(dir);

    if(projection <= 0)
      continue;

    const perpendicular =
      to.clone()
        .sub(
          dir.clone()
            .multiplyScalar(
              projection
            )
        )
        .length();

    if(
      perpendicular <
        r.radius + .5 &&
      distance < bestDist
    ){

      best = r;
      bestDist = distance;
    }
  }

  return best;
}

function aimBear(){

  const origin =
    camera.getWorldPosition(
      new THREE.Vector3()
    );

  const dir =
    forward();

  let best = null;
  let bestDistance = 4;

  for(
    const b of bears
  ){

    if(!b.alive)
      continue;

    const center =
      b.group.position.clone();

    center.y += 1.2;

    const to =
      center.clone()
        .sub(origin);

    const distance =
      to.length();

    if(
      distance > bestDistance
    ){
      continue;
    }

    const projection =
      to.dot(dir);

    if(projection <= 0)
      continue;

    const perpendicular =
      to.clone()
        .sub(
          dir.clone()
            .multiplyScalar(
              projection
            )
        )
        .length();

    if(
      perpendicular < 1.3
    ){

      best = b;
      bestDistance = distance;
    }
  }

  return best;
}

let cooldown = 0;

function gather(){

  if(
    !gameStarted ||
    !player.alive ||
    cooldown > 0
  ){
    return;
  }

  cooldown = .5;

  /* запускаем анимацию */

  startAttackAnimation();

  /* копьё */

  if(
    selectedWeapon ===
    "spear"
  ){

    const bear =
      aimBear();

    if(bear){

      hitBear(bear);
    }

    return;
  }

  /* камень */

  const bear =
    aimBear();

  if(bear){

    hitBear(bear);

    return;
  }

  const resource =
    aimResource();

  if(!resource)
    return;

  resource.hp--;

  if(
    resource.hp <= 0
  ){

    resource.alive =
      false;

    scene.remove(
      resource.group
    );

    inv[resource.drop] +=
      resource.dropN +
      Math.floor(
        rand(0,2)
      );

  }else{

    inv[resource.drop]++;
  }

  updateResources();
}

function strike(){

  gather();
}

   /* ================= BEAR AI ================= */

function updateBears(dt){

  for(
    const bear of bears
  ){

    if(!bear.alive)
      continue;

    const p =
      bear.group.position;

    const dx =
      player.pos.x - p.x;

    const dz =
      player.pos.z - p.z;

    const distance =
      Math.hypot(dx,dz);

    /* преследование */

    if(
      player.alive &&
      distance < 14
    ){

      bear.state =
        "chase";

    }else if(
      bear.state === "chase" &&
      distance > 28
    ){

      bear.state =
        "wander";
    }

    let speed = 0;

    if(
      bear.state === "chase" &&
      player.alive
    ){

      bear.dir =
        Math.atan2(
          dx,
          dz
        );

      speed =
        distance > 2.3
          ? 3.5
          : 0;

      bear.attackCd -=
        dt;

      if(
        distance < 2.6 &&
        bear.attackCd <= 0
      ){

        bear.attackCd =
          1.6;

        damage(16);
      }

    }else{

      bear.timer -=
        dt;

      if(
        bear.timer <= 0
      ){

        bear.timer =
          rand(1.5,4);

        bear.dir =
          rand(
            0,
            Math.PI * 2
          );
      }

      speed = 1.3;
    }

    if(speed > 0){

      const nx =
        p.x +
        Math.sin(
          bear.dir
        ) *
        speed *
        dt;

      const nz =
        p.z +
        Math.cos(
          bear.dir
        ) *
        speed *
        dt;

      if(
        Math.hypot(nx,nz) < 88 &&
        terrainHeight(nx,nz)
          > WATER + .4
      ){

        p.x = nx;
        p.z = nz;
      }
    }

    p.y =
      terrainHeight(
        p.x,
        p.z
      );

    bear.group.rotation.y =
      bear.dir -
      Math.PI / 2;
  }
}

  0.28;

spearGroup.add(spearBase);


/* положение в руке */

spearGroup.position.set(
  0.12,
  -0.12,
  -0.55
);

spearGroup.rotation.set(
  0,
  0,
  -0.18
);

spearGroup.scale.setScalar(0.75);

spearGroup.visible = false;

hand.add(spearGroup);


/* =========================================================
   ВЫБОР ОРУЖИЯ
   ========================================================= */

function setWeapon(name) {

  selectedWeapon = name;

  if (name === "spear") {

    stoneHeld.visible = false;
    fist.visible = false;
    spearGroup.visible = true;

  } else {

    stoneHeld.visible = true;
    fist.visible = true;
    spearGroup.visible = false;

  }

}


/* =========================================================
   АНИМАЦИЯ УДАРА
   ========================================================= */

function startAttackAnimation() {

  if (weaponState.attacking)
    return;

  weaponState.attacking = true;
  weaponState.time = 0;

}


/* =========================================================
   ОБНОВЛЕНИЕ РУКИ
   ========================================================= */

function updateWeaponAnimation(dt) {

  if (!weaponState.attacking)
    return;

  weaponState.time += dt;

  const t =
    weaponState.time /
    weaponState.duration;

  if (t >= 1) {

    weaponState.attacking = false;
    weaponState.time = 0;

    hand.rotation.set(0, 0, 0);
    spearGroup.position.set(
      0.12,
      -0.12,
      -0.55
    );

    return;

  }


  /*
    Плавное движение:
    сначала вперёд,
    затем назад.
  */

  let progress;

  if (t < 0.5) {

    progress =
      t / 0.5;

  } else {

    progress =
      1 -
      (t - 0.5) / 0.5;

  }


  /*
    Камень:
    лёгкое движение сверху вниз.
  */

  if (selectedWeapon === "stone") {

    hand.rotation.x =
      -0.55 * progress;

    hand.rotation.z =
      -0.12 * progress;

  }


  /*
    Копьё:
    немного вперёд и обратно.
    НЕ бросается.
  */

  if (selectedWeapon === "spear") {

    spearGroup.position.z =
      -0.55 -
      0.32 * progress;

    spearGroup.rotation.y =
      0.15 * progress;

    spearGroup.rotation.z =
      -0.18 -
      0.18 * progress;

  }

}


/* =========================================================
   УДАР ПО МЕДВЕДЮ
   ========================================================= */

function damageBear(bear, amount) {

  if (!bear || !bear.alive)
    return;

  bear.hp -= amount;

  bear.state = "chase";

  /*
    Небольшая реакция модели.
  */

  bear.group.position.y += 0.08;

  setTimeout(() => {

    if (bear.alive) {

      bear.group.position.y =
        terrainHeight(
          bear.group.position.x,
          bear.group.position.z
        );

    }

  }, 80);


  if (bear.hp <= 0) {

    bear.hp = 0;
    bear.alive = false;

    bear.group.rotation.z =
      Math.PI / 2;

    inv.meat += 3;

    updateResources();

  }

}


/* =========================================================
   ПОЛУЧЕНИЕ УРОНА ИГРОКОМ
   ========================================================= */

function damage(amount) {

  if (!player.alive)
    return;

  player.hp =
    Math.max(
      0,
      player.hp - amount
    );

  updateHealth();

  if (player.hp <= 0) {

    player.alive = false;

    $("death").style.display =
      "flex";

  }

}


/* =========================================================
   ПОИСК РЕСУРСА
   ========================================================= */

function findResourceForAttack() {

  const origin =
    camera.getWorldPosition(
      new THREE.Vector3()
    );

  const direction =
    forward();

  let best = null;
  let bestDistance = 4.5;

  for (const resource of resources) {

    if (!resource.alive)
      continue;

    const center =
      resource.group.position.clone();

    center.y += 1;

    const to =
      center
        .clone()
        .sub(origin);

    const distance =
      to.length();

    if (distance > 4.5)
      continue;

    const dot =
      to.dot(direction);

    if (dot <= 0)
      continue;

    const closest =
      direction
        .clone()
        .multiplyScalar(dot);

    const sideDistance =
      to
        .clone()
        .sub(closest)
        .length();

    if (
      sideDistance <
        resource.radius + 0.7 &&
      distance <
        bestDistance
    ) {

      best = resource;
      bestDistance = distance;

    }

  }

  return best;

}


/* =========================================================
   ДОБЫЧА
   ========================================================= */

function gatherResource(resource) {

  if (!resource || !resource.alive)
    return;


  resource.hp--;


  /*
    Камень слегка двигается
    сверху вниз при каждом ударе.
  */

  const oldY =
    resource.group.position.y;

  resource.group.position.y =
    oldY + 0.10;


  resource.group.rotation.x =
    0.04;


  setTimeout(() => {

    if (resource.alive) {

      resource.group.position.y =
        terrainHeight(
          resource.group.position.x,
          resource.group.position.z
        );

      resource.group.rotation.x =
        0;

    }

  }, 80);


  if (resource.hp <= 0) {

    resource.alive = false;

    scene.remove(
      resource.group
    );

    const amount =
      resource.dropN +
      Math.floor(
        Math.random() * 2
      );

    if (
      typeof inv[resource.drop] ===
      "number"
    ) {

      inv[resource.drop] +=
        amount;

    }

  } else {

    if (
      typeof inv[resource.drop] ===
      "number"
    ) {

      inv[resource.drop]++;

    }

  }

  updateResources();

}


/* =========================================================
   ГЛАВНАЯ АТАКА
   ========================================================= */

function attack() {

  if (!gameStarted)
    return;

  if (!player.alive)
    return;

  if (attackCooldown > 0)
    return;

  attackCooldown = 0.32;

  startAttackAnimation();


  /* сначала проверяем медведя */

  const bear =
    aimBear();

  if (bear) {

    if (selectedWeapon === "spear") {

      damageBear(
        bear,
        35
      );

    } else {

      damageBear(
        bear,
        18
      );

    }

    return;

  }


  /* затем ресурс */

  const resource =
    findResourceForAttack();

  if (resource) {

    gatherResource(
      resource
    );

  }

}


/* =========================================================
   КНОПКА УДАРА
   ========================================================= */

$("hit").addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();
    e.stopPropagation();

    attack();

  }
);


/* ДОБЫТЬ тоже делает удар */

$("gather").addEventListener(

    e.preventDefault();
    e.stopPropagation();

    attack();

  }

   HOTBAR

document

  )

        document
          .querySelectorAll(
            "#hotbar .slot"
          )

            s.classList.remove(

            )
          );

        slot.classList.add(
          "active"
        );


        if (
          slot.dataset.item ===

        ) {

            setWeapon("spear");

        } else {

          setWeapon("stone");

        }

      }
    );

  });


/* =========================================================
   ОБНОВЛЕНИЕ HOTBAR ПОСЛЕ КРАФТА
   ========================================================= */

window.selectSpear = function () {

  setWeapon("spear");

  document
    .querySelectorAll(
      "#hotbar .slot"
    )
    .forEach(slot => {

      slot.classList.remove(
        "active"
      );

      if (
        slot.dataset.item ===
        "spear"
      ) {

        slot.classList.add(
          "active"
        );

      }

    });

};


/* =========================================================
   ОБНОВЛЕНИЕ GAME LOOP
   ========================================================= */

const gameClock =
  new THREE.Clock();


function gameLoop() {

  requestAnimationFrame(
    gameLoop
  );

  const dt =
    Math.min(
      0.05,
      gameClock.getDelta()
    );


  if (gameStarted) {

    updatePlayer(dt);

    updateBears(dt);

    updateWeaponAnimation(dt);


    if (attackCooldown > 0) {

      attackCooldown -= dt;

    }


    water.position.y =
      WATER +
      Math.sin(
        performance.now() * 0.001
      ) * 0.05;

  }


  renderer.render(
    scene,
    camera
  );

}


/* запускаем только ОДИН loop */

gameLoop();


/* =========================================================
   ИНИЦИАЛЬНОЕ ОРУЖИЕ
   ========================================================= */

setWeapon("stone");

    }


    if (!freeSlot) {

      freeSlot =
        slots[slots.length - 1];

    }


    freeSlot.textContent =
      "🗡️";

    freeSlot.dataset.item =
      "spear";

    freeSlot.classList.add(
      "spearSlot6"
    );


    document
      .querySelectorAll(
        "#hotbar .slot"
      )
      .forEach(
        s =>
          s.classList.remove(
            "active"
          )
      );


    freeSlot.classList.add(
      "active"
    );


    /* переключаем модель руки */

    if (
      typeof setWeapon ===
      "function"
    ) {

      setWeapon("spear");

    }


    craftMessage6.textContent =
      "Копьё создано!";


    craftSpear6.disabled =
      true;


    setTimeout(
      () => {

        craftMenu6.style.display =
          "none";

      },
      500
    );

  }
);


/* =====================================================
   ЗАКРЫТИЕ ПО ESC
   ===================================================== */

document.addEventListener(
  "keydown",
  e => {

    if (
      e.key ===
      "Escape"
    ) {

      inventory6.style.display =
        "none";

      craftMenu6.style.display =
        "none";

    }

  }
);


/* =====================================================
   ЗАКРЫТИЕ ПО ФОНУ
   ===================================================== */

inventory6.addEventListener(
  "pointerdown",
  e => {

    if (
      e.target ===
      inventory6
    ) {

      inventory6.style.display =
        "none";

    }

  }
);


craftMenu6.addEventListener(
  "pointerdown",
  e => {

    if (
      e.target ===
      craftMenu6
    ) {

      craftMenu6.style.display =
        "none";

    }

  }
);

</script>
