<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#080808">

<title>Rust Mobile [web]</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  touch-action: none;
  user-select: none;
}

#game {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* ================= MENU ================= */

#menu {
  position: fixed;
  inset: 0;
  z-index: 1000;

  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;

  padding: 25px;

  background:
    radial-gradient(
      circle at 85% 20%,
      rgba(220, 0, 0, .35),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #050505,
      #170707,
      #050505
    );
}

.logo {
  margin-right: 5px;
  margin-bottom: 45px;

  font-size: 31px;
  font-weight: 900;
  letter-spacing: 2px;
  text-align: right;
}

.logo span {
  color: #e00000;
}

.menuButton {
  width: 230px;
  height: 58px;

  margin: 7px 0;

  border: 1px solid #d40000;
  border-radius: 8px;

  background: rgba(20,20,20,.95);

  color: white;

  font-size: 17px;
  font-weight: bold;
  letter-spacing: 1px;
}

.menuButton:active {
  background: #c90000;
  transform: scale(.96);
}

/* ================= SETTINGS ================= */

#settings {
  position: fixed;
  inset: 0;
  z-index: 1100;

  display: none;

  padding: 30px;

  background:
    linear-gradient(
      135deg,
      #050505,
      #160606,
      #050505
    );
}

.settingsTitle {
  margin: 30px 0;

  text-align: center;

  font-size: 28px;
  color: #e00000;
}

.settingsBox {
  max-width: 400px;
  margin: auto;

  padding: 20px;

  border: 1px solid #333;
  border-radius: 12px;

  background: #111;
}

.settingsBox p {
  font-size: 17px;
}

#fpsStatus {
  color: #e00000;
}

.backButton {
  margin-top: 20px;
}

/* ================= FPS ================= */

#fps {
  position: fixed;

  top: 10px;
  right: 10px;

  z-index: 500;

  padding: 5px 9px;

  border-radius: 5px;

  background: rgba(0,0,0,.6);

  color: white;

  font-size: 13px;
  font-weight: bold;

  display: none;
}

/* ================= HUD ================= */

#hud {
  position: fixed;
  inset: 0;

  pointer-events: none;

  display: none;
}

.panel {
  background: rgba(10,10,10,.6);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 10px;
  backdrop-filter: blur(5px);
}

#top {
  position: absolute;

  top: 10px;
  left: 10px;

  display: flex;
  gap: 8px;
}

#health {
  width: 190px;
  padding: 8px;

  font-size: 11px;
}

.healthBar {
  height: 8px;

  margin-top: 5px;

  background: #222;
  border-radius: 5px;

  overflow: hidden;
}

#healthFill {
  width: 100%;
  height: 100%;

  background: linear-gradient(
    90deg,
    #b00000,
    #ff3333
  );
}

#resources {
  padding: 7px 10px;

  font-size: 12px;
  line-height: 1.5;
}

#resources b {
  color: #ffdddd;
}

/* ================= CROSSHAIR ================= */

#crosshair {
  position: fixed;

  left: 50%;
  top: 50%;

  width: 20px;
  height: 20px;

  transform: translate(-50%, -50%);

  pointer-events: none;
}

#crosshair:before,
#crosshair:after {
  content: "";

  position: absolute;

  background: white;

  box-shadow: 0 0 3px black;
}

#crosshair:before {
  width: 2px;
  height: 16px;

  left: 9px;
  top: 2px;
}

#crosshair:after {
  width: 16px;
  height: 2px;

  left: 2px;
  top: 9px;
}

/* ================= JOYSTICK ================= */

#joystick {
  position: fixed;

  left: 20px;
  bottom: 110px;

  width: 125px;
  height: 125px;

  border-radius: 50%;

  border: 2px solid rgba(255,255,255,.3);

  background: rgba(0,0,0,.35);

  pointer-events: auto;
}

#knob {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 55px;
  height: 55px;

  margin-left: -27.5px;
  margin-top: -27.5px;

  border-radius: 50%;

  background: rgba(255,255,255,.45);

  border: 1px solid white;
}

/* ================= BUTTONS ================= */

#buttons {
  position: fixed;

  right: 15px;
  bottom: 105px;

  display: flex;
  flex-direction: column;

  gap: 10px;

  align-items: flex-end;
}

.gameButton {
  width: 75px;
  height: 75px;

  border-radius: 50%;

  border: 1px solid rgba(255,255,255,.3);

  background: rgba(15,15,15,.65);

  color: white;

  font-size: 11px;
  font-weight: bold;

  pointer-events: auto;
}

.gameButton.big {
  width: 88px;
  height: 88px;

  background: rgba(150,0,0,.55);
}

.gameButton:active {
  transform: scale(.94);
  background: #c00000;
}

/* ================= TARGET ================= */

#target {
  position: fixed;

  left: 50%;
  top: calc(50% + 25px);

  transform: translateX(-50%);

  padding: 5px 10px;

  border-radius: 8px;

  background: rgba(0,0,0,.6);

  font-size: 12px;

  display: none;
}

/* ================= HOTBAR ================= */

#hotbar {
  position: fixed;

  left: 50%;
  bottom: 10px;

  transform: translateX(-50%);

  display: flex;
  gap: 7px;

  pointer-events: auto;
}

.slot {
  width: 55px;
  height: 55px;

  border: 2px solid #333;
  border-radius: 9px;

  background: rgba(10,10,10,.65);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 22px;

  pointer-events: auto;
}

.slot.active {
  border-color: #e00000;

  background: rgba(150,0,0,.45);
}

/* ================= DEATH ================= */

#death {
  position: fixed;
  inset: 0;

  z-index: 2000;

  display: none;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  background: rgba(20,0,0,.85);
}

#death h1 {
  color: #ff2222;

  font-size: 38px;
}

</style>
</head>

<body>

<div id="game"></div>

<div id="menu">

  <div class="logo">
    RUST MOBILE <span>[web]</span>
  </div>

  <button class="menuButton" id="playButton">
    ИГРАТЬ
  </button>

  <button class="menuButton" id="settingsButton">
    НАСТРОЙКИ
  </button>

</div>

<div id="settings">

  <div class="settingsTitle">
    НАСТРОЙКИ
  </div>

  <div class="settingsBox">

    <p>
      FPS:
      <b id="fpsStatus">ВКЛ</b>
    </p>

    <button class="menuButton" id="fpsButton">
      ПОКАЗЫВАТЬ FPS
    </button>

    <button class="menuButton backButton" id="backButton">
      НАЗАД
    </button>

  </div>

</div>

<div id="fps">
  FPS: 0
</div>

<div id="hud">

  <div id="top">

    <div class="panel" id="health">
      ЗДОРОВЬЕ

      <div class="healthBar">
        <div id="healthFill"></div>
      </div>
    </div>

    <div class="panel" id="resources">
      Дерево: <b id="wood">0</b><br>
      Камень: <b id="stone">0</b><br>
      Железо: <b id="iron">0</b><br>
      Медь: <b id="copper">0</b><br>
      Мясо: <b id="meat">0</b>
    </div>

  </div>

  <div id="crosshair"></div>

  <div id="target"></div>

  <div id="joystick">
    <div id="knob"></div>
  </div>

  <div id="buttons">

    <button class="gameButton" id="jump">
      ПРЫЖОК
    </button>

    <button class="gameButton" id="hit">
      УДАР
    </button>

    <button class="gameButton big" id="gather">
      ДОБЫТЬ
    </button>

  </div>

  <div id="hotbar">

    <div class="slot active">
      🪨
    </div>

    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>

  </div>

</div>

<div id="death">

  <h1>ВЫ ПОГИБЛИ</h1>

  <p>Вас убил медведь</p>

  <button class="menuButton" id="respawn">
    ВОЗРОДИТЬСЯ
  </button>

</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";

/* ================= BASIC ================= */

const $ = id => document.getElementById(id);

const rand = (a,b) =>
  a + Math.random() * (b-a);

const clamp = (v,a,b) =>
  Math.min(b,Math.max(a,v));

const WORLD = 120;
const WATER = -2.2;

/* ================= THREE ================= */

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x9dbbd0);

scene.fog =
  new THREE.Fog(
    0x9dbbd0,
    55,
    150
  );

const camera =
  new THREE.PerspectiveCamera(
    72,
    innerWidth / innerHeight,
    .05,
    400
  );

const renderer =
  new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
  });

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.5)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

$("game").appendChild(
  renderer.domElement
);

addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

/* ================= LIGHT ================= */

scene.add(
  new THREE.HemisphereLight(
    0xcfe6ff,
    0x39452b,
    1
  )
);

const sun =
  new THREE.DirectionalLight(
    0xfff0cf,
    1.1
  );

sun.position.set(
  40,
  70,
  20
);

scene.add(sun);

/* ================= TERRAIN ================= */

function terrainHeight(x,z){

  let h =
    Math.sin(x*.045)*2.4 +
    Math.cos(z*.05)*2.2 +
    Math.sin((x+z)*.021)*3.4;

  h +=
    Math.sin(x*.12)*.35 +
    Math.cos(z*.14)*.35;

  const river =
    Math.exp(
      -Math.pow(
        (z-Math.sin(x*.03)*12)/8,
        2
      )
    ) * 6.5;

  h -= river;

  const d =
    Math.sqrt(x*x+z*z);

  h -=
    Math.max(
      0,
      (d-88)*.5
    );

  return h;
}

const terrain =
  new THREE.PlaneGeometry(
    WORLD*2,
    WORLD*2,
    140,
    140
  );

terrain.rotateX(
  -Math.PI/2
);

const pos =
  terrain.attributes.position;

const colors = [];

const grass =
  new THREE.Color(0x5f8f3e);

const dry =
  new THREE.Color(0x8d9a4d);

const dirt =
  new THREE.Color(0x796143);

const rock =
  new THREE.Color(0x888985);

const sand =
  new THREE.Color(0xc9bd8e);

for(
  let i=0;
  i<pos.count;
  i++
){

  const x =
    pos.getX(i);

  const z =
    pos.getZ(i);

  const y =
    terrainHeight(x,z);

  pos.setY(i,y);

  let c;

  if(y < WATER+.7)
    c=sand;

  else if(y>7)
    c=rock;

  else if(y>4.5)
    c=dirt;

  else if(
    Math.sin(x*.05)+
    Math.cos(z*.04)>0.6
  )
    c=dry;

  else
    c=grass;

  colors.push(
    c.r,
    c.g,
    c.b
  );
}

terrain.setAttribute(
  "color",
  new THREE.Float32BufferAttribute(
    colors,
    3
  )
);

terrain.computeVertexNormals();

scene.add(
  new THREE.Mesh(
    terrain,
    new THREE.MeshLambertMaterial({
      vertexColors:true
    })
  )
);

/* ================= WATER ================= */

const water =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      WORLD*2.4,
      WORLD*2.4
    ),
    new THREE.MeshLambertMaterial({
      color:0x2e6d85,
      transparent:true,
      opacity:.78
    })
  );

water.rotation.x =
  -Math.PI/2;

water.position.y =
  WATER;

scene.add(water);

/* ================= MATERIALS ================= */

const materials = {

  bark:
    new THREE.MeshLambertMaterial({
      color:0x60432d
    }),

  leaf:
    new THREE.MeshLambertMaterial({
      color:0x3f7735
    }),

  leaf2:
    new THREE.MeshLambertMaterial({
      color:0x58883a
    }),

  pine:
    new THREE.MeshLambertMaterial({
      color:0x2e5b32
    }),

  rock:
    new THREE.MeshLambertMaterial({
      color:0x858783,
      flatShading:true
    }),

  iron:
    new THREE.MeshLambertMaterial({
      color:0xa66f45,
      flatShading:true
    }),

  copper:
    new THREE.MeshLambertMaterial({
      color:0x399b82,
      flatShading:true
    })

};

/* ================= BUMPY OBJECT ================= */

function bumpy(r){

  const g =
    new THREE.IcosahedronGeometry(
      r,
      1
    );

  const p =
    g.attributes.position;

  for(
    let i=0;
    i<p.count;
    i++
  ){

    const x=p.getX(i);
    const y=p.getY(i);
    const z=p.getZ(i);

    const n =
      1 +
      Math.sin(x*5)*
      Math.cos(y*4)*
      Math.sin(z*6)*.18;

    p.setXYZ(
      i,
      x*n,
      y*n,
      z*n
    );

  }

  g.computeVertexNormals();

  return g;
}

/* ================= RESOURCES ================= */

const resources=[];

function addResource(group,data){

  group.position.y =
    terrainHeight(
      group.position.x,
      group.position.z
    );

  scene.add(group);

  const r={
    group,
    ...data,
    hp:data.maxHp,
    alive:true
  };

  resources.push(r);

  return r;
}

/* ================= TREES ================= */

function makeTree(x,z,type){

  const g =
    new THREE.Group();

  g.position.set(x,0,z);

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .25,
        .45,
        4,
        7
      ),
      materials.bark
    );

  trunk.position.y=2;

  g.add(trunk);

  if(type===0){

    for(
      let i=0;
      i<3;
      i++
    ){

      const cone =
        new THREE.Mesh(
          new THREE.ConeGeometry(
            2.1-i*.45,
            2.4,
            7
          ),
          materials.pine
        );

      cone.position.y =
        3.2+i*1.25;

      g.add(cone);

    }

  }else{

    const crown =
      new THREE.Mesh(
        bumpy(type===1?2.2:1.7),
        type===1 ?
          materials.leaf :
          materials.leaf2
      );

    crown.position.y =
      type===1 ? 4.3 : 5;

    crown.scale.y=.8;

    g.add(crown);

  }

  g.scale.setScalar(
    rand(.85,1.2)
  );

  g.rotation.y =
    rand(0,Math.PI*2);

  return addResource(
    g,
    {
      type:"tree",
      name:"Дерево",
      maxHp:5,
      radius:1.1,
      drop:"wood",
      dropN:2
    }
  );

}

/* ================= ORE ================= */

function makeOre(x,z,type){

  const g =
    new THREE.Group();

  g.position.set(x,0,z);

  const base =
    new THREE.Mesh(
      bumpy(1.15),
      materials.rock
    );

  base.scale.y=.7;

  base.position.y=.5;

  g.add(base);

  const mat =
    type==="iron"
      ? materials.iron
      : type==="copper"
      ? materials.copper
      : materials.rock;

  for(
    let i=0;
    i<4;
    i++
  ){

    const n =
      new THREE.Mesh(
        bumpy(
          type==="stone"
            ? .5
            : .3
        ),
        mat
      );

    n.position.set(
      rand(-.7,.7),
      rand(.5,1),
      rand(-.7,.7)
    );

    g.add(n);

  }

  const names={
    stone:"Камень",
    iron:"Железная руда",
    copper:"Медная руда"
  };

  return addResource(
    g,
    {
      type:"ore",
      name:names[type],
      maxHp:type==="stone"?4:6,
      radius:1.3,
      drop:type,
      dropN:type==="stone"?3:2
    }
  );

}

/* ================= LAND ================= */

function land(x,z){

  return terrainHeight(x,z)
    > WATER+.6;

}

function scatter(
  count,
  callback
){

  let placed=0;
  let tries=0;

  while(
    placed<count &&
    tries<count*30
  ){

    tries++;

    const x=rand(-82,82);
    const z=rand(-82,82);

    if(!land(x,z))
      continue;

    if(Math.hypot(x,z)<8)
      continue;

    callback(x,z);

    placed++;

  }

}

/* ================= WORLD OBJECTS ================= */

scatter(
  75,
  (x,z)=>
    makeTree(
      x,
      z,
      Math.floor(rand(0,3))
    )
);

scatter(
  15,
  (x,z)=>
    makeOre(
      x,
      z,
      "stone"
    )
);

scatter(
  8,
  (x,z)=>
    makeOre(
      x,
      z,
      "iron"
    )
);

scatter(
  7,
  (x,z)=>
    makeOre(
      x,
      z,
      "copper"
    )
);
  /* ================= PLAYER ================= */

const player = {
  pos: new THREE.Vector3(0,0,6),
  vy: 0,
  yaw: 0,
  pitch: 0,
  hp: 100,
  eye: 1.7,
  onGround: true,
  alive: true
};

const inv = {
  wood: 0,
  stone: 0,
  iron: 0,
  copper: 0,
  meat: 0
};

/* ================= HAND ================= */

const hand = new THREE.Group();

camera.add(hand);
scene.add(camera);

hand.position.set(
  .08,
  -.3,
  -.5
);

const skin =
  new THREE.MeshLambertMaterial({
    color:0xc08a62
  });

const sleeve =
  new THREE.MeshLambertMaterial({
    color:0x555555
  });

const arm =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .08,
      .1,
      .5,
      8
    ),
    skin
  );

arm.rotation.set(
  1.15,
  0,
  -.25
);

arm.position.set(
  .06,
  -.2,
  .12
);

hand.add(arm);

const cuff =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .1,
      .11,
      .16,
      8
    ),
    sleeve
  );

cuff.rotation.copy(
  arm.rotation
);

cuff.position.set(
  .1,
  -.36,
  .24
);

hand.add(cuff);

const fist =
  new THREE.Mesh(
    bumpy(.11),
    skin
  );

fist.position.set(
  0,
  .02,
  -.03
);

hand.add(fist);

const stoneHeld =
  new THREE.Mesh(
    bumpy(.15),
    new THREE.MeshStandardMaterial({
      color:0x999999,
      roughness:.9
    })
  );

stoneHeld.position.set(
  0,
  .06,
  -.08
);

hand.add(stoneHeld);

/* ================= BEARS ================= */

const bears=[];

function makeBear(x,z){

  const g =
    new THREE.Group();

  const fur =
    new THREE.MeshLambertMaterial({
      color:0x493426
    });

  const dark =
    new THREE.MeshLambertMaterial({
      color:0x281b14
    });

  const body =
    new THREE.Mesh(
      bumpy(.9),
      fur
    );

  body.scale.set(
    1.35,
    .9,
    .95
  );

  body.position.y=1.15;

  g.add(body);

  const head =
    new THREE.Group();

  head.position.set(
    1.25,
    1.35,
    0
  );

  const headMesh =
    new THREE.Mesh(
      bumpy(.45),
      fur
    );

  head.add(headMesh);

  const nose =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .4,
        .26,
        .3
      ),
      dark
    );

  nose.position.set(
    .4,
    -.08,
    0
  );

  head.add(nose);

  for(
    const side of [-1,1]
  ){

    const ear =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .13,
          8,
          6
        ),
        fur
      );

    ear.position.set(
      -.1,
      .38,
      .24*side
    );

    head.add(ear);

  }

  g.add(head);

  const legs=[];

  for(
    let i=0;
    i<4;
    i++
  ){

    const leg =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .16,
          .2,
          1.05,
          6
        ),
        fur
      );

    leg.position.set(
      i<2 ? .75 : -.7,
      .52,
      i%2 ? .45 : -.45
    );

    g.add(leg);

    legs.push(leg);

  }

  g.position.set(
    x,
    terrainHeight(x,z),
    z
  );

  scene.add(g);

  const bear={
    group:g,
    head,
    legs,
    hp:100,
    maxHp:100,
    alive:true,
    state:"wander",
    dir:rand(0,Math.PI*2),
    timer:rand(1,3),
    attackCd:0,
    walk:0
  };

  bears.push(bear);

  return bear;
}

makeBear(28,-18);
makeBear(-34,26);
makeBear(45,40);

/* ================= PLAYER SPAWN ================= */

function spawnPlayer(){

  let x=0;
  let z=6;

  for(
    let i=0;
    i<200;
    i++
  ){

    const tx=rand(-30,30);
    const tz=rand(-30,30);

    if(
      land(tx,tz) &&
      terrainHeight(tx,tz)
        > WATER+1.5
    ){

      let far=true;

      for(
        const b of bears
      ){

        if(
          b.alive &&
          b.group.position.distanceTo(
            new THREE.Vector3(
              tx,
              0,
              tz
            )
          )<30
        ){

          far=false;
          break;

        }

      }

      if(far){

        x=tx;
        z=tz;

        break;

      }

    }

  }

  player.pos.set(
    x,
    terrainHeight(x,z),
    z
  );

  player.vy=0;
  player.yaw=0;
  player.pitch=0;
  player.hp=100;
  player.alive=true;

  updateHealth();
  updateResources();

}

/* ================= UI ================= */

function updateHealth(){

  $("healthFill").style.width =
    clamp(player.hp,0,100)+"%";

}

function updateResources(){

  $("wood").textContent=inv.wood;
  $("stone").textContent=inv.stone;
  $("iron").textContent=inv.iron;
  $("copper").textContent=inv.copper;
  $("meat").textContent=inv.meat;

}

/* ================= JOYSTICK ================= */

const joystick =
  $("joystick");

const knob =
  $("knob");

const movement={
  x:0,
  y:0
};

let joystickId=null;

const joystickRadius=50;

let center={
  x:0,
  y:0
};

function joystickMove(e){

  let dx =
    e.clientX-center.x;

  let dy =
    e.clientY-center.y;

  const distance =
    Math.hypot(dx,dy);

  if(
    distance>joystickRadius
  ){

    dx =
      dx/distance*
      joystickRadius;

    dy =
      dy/distance*
      joystickRadius;

  }

  knob.style.transform =
    `translate(${dx}px,${dy}px)`;

  movement.x =
    dx/joystickRadius;

  movement.y =
    -dy/joystickRadius;

}

joystick.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    joystickId=e.pointerId;

    const r =
      joystick.getBoundingClientRect();

    center={
      x:r.left+r.width/2,
      y:r.top+r.height/2
    };

    joystick.setPointerCapture(
      e.pointerId
    );

    joystickMove(e);

  }
);

joystick.addEventListener(
  "pointermove",
  e=>{

    if(
      e.pointerId!==joystickId
    ) return;

    e.preventDefault();

    joystickMove(e);

  }
);

function joystickEnd(e){

  if(
    e.pointerId!==joystickId
  ) return;

  joystickId=null;

  movement.x=0;
  movement.y=0;

  knob.style.transform =
    "translate(0px,0px)";

}

joystick.addEventListener(
  "pointerup",
  joystickEnd
);

joystick.addEventListener(
  "pointercancel",
  joystickEnd
);

/* ================= CAMERA TOUCH ================= */

let lookId=null;

let lastLook={
  x:0,
  y:0
};

const sensitivity=.0032;

addEventListener(
  "pointerdown",
  e=>{

    if(!gameStarted)
      return;

    if(
      e.target.closest(
        "#joystick,.gameButton,.slot,.menuButton"
      )
    ) return;

    if(
      e.clientX <
      innerWidth*.42
    ) return;

    lookId=e.pointerId;

    lastLook={
      x:e.clientX,
      y:e.clientY
    };

  }
);

addEventListener(
  "pointermove",
  e=>{

    if(
      e.pointerId!==lookId
    ) return;

    const dx =
      e.clientX-lastLook.x;

    const dy =
      e.clientY-lastLook.y;

    lastLook={
      x:e.clientX,
      y:e.clientY
    };

    player.yaw -=
      dx*sensitivity;

    player.pitch =
      clamp(
        player.pitch-
        dy*sensitivity,
        -1.35,
        1.35
      );

  }
);

addEventListener(
  "pointerup",
  e=>{

    if(
      e.pointerId===lookId
    )
      lookId=null;

  }
);

addEventListener(
  "pointercancel",
  e=>{

    if(
      e.pointerId===lookId
    )
      lookId=null;

  }
);

/* ================= MOVEMENT ================= */

function updatePlayer(dt){

  let mx=movement.x;
  let mz=movement.y;

  const length =
    Math.hypot(mx,mz);

  if(
    length>.05 &&
    player.alive
  ){

    mx/=Math.max(1,length);
    mz/=Math.max(1,length);

    const sin=
      Math.sin(player.yaw);

    const cos=
      Math.cos(player.yaw);

    const dx=
      -sin*mz+
      cos*mx;

    const dz=
      -cos*mz-
      sin*mx;

    const speed=5.2;

    const nx=
      player.pos.x+
      dx*speed*dt;

    const nz=
      player.pos.z+
      dz*speed*dt;

    if(
      Math.hypot(nx,nz)<92 &&
      terrainHeight(nx,nz)
        > WATER-.8
    ){

      let blocked=false;

      for(
        const r of resources
      ){

        if(!r.alive)
          continue;

        if(
          Math.hypot(
            nx-r.group.position.x,
            nz-r.group.position.z
          )
          <
          r.radius*.55
        ){

          blocked=true;
          break;

        }

      }

      if(!blocked){

        player.pos.x=nx;
        player.pos.z=nz;

      }

    }

  }

  player.vy-=17*dt;

  player.pos.y+=
    player.vy*dt;

  const ground=
    terrainHeight(
      player.pos.x,
      player.pos.z
    );

  if(
    player.pos.y<=ground
  ){

    player.pos.y=ground;
    player.vy=0;
    player.onGround=true;

  }

  camera.position.set(
    player.pos.x,
    player.pos.y+
      player.eye,
    player.pos.z
  );

  camera.rotation.order=
    "YXZ";

  camera.rotation.y=
    player.yaw;

  camera.rotation.x=
    player.pitch;

}

/* ================= JUMP ================= */

function jump(){

  if(
    player.alive &&
    player.onGround
  ){

    player.vy=6.4;
    player.onGround=false;

  }

}

$("jump").addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    jump();
  }
);

/* ================= AIM ================= */

function forward(){

  const v=
    new THREE.Vector3(
      0,
      0,
      -1
    );

  v.applyQuaternion(
    camera.quaternion
  );

  return v;

}

function aimResource(){

  const origin=
    camera.getWorldPosition(
      new THREE.Vector3()
    );

  const dir=forward();

  let best=null;
  let bestDist=4.2;

  for(
    const r of resources
  ){

    if(!r.alive)
      continue;

    const center=
      r.group.position.clone();

    center.y+=1.2;

    const to=
      center.clone()
        .sub(origin);

    const distance=
      to.length();

    if(
      distance>
      bestDist+r.radius
    ) continue;

    const projection=
      to.dot(dir);

    if(projection<=0)
      continue;

    const perpendicular=
      to.clone()
        .sub(
          dir.clone()
            .multiplyScalar(
              projection
            )
        )
        .length();

    if(
      perpendicular<
        r.radius+.5 &&
      distance<bestDist
    ){

      best=r;
      bestDist=distance;

    }

  }

  return best;

}

function aimBear(){

  const origin=
    camera.getWorldPosition(
      new THREE.Vector3()
    );

  const dir=forward();

  for(
    const b of bears
  ){

    if(!b.alive)
      continue;

    const center=
      b.group.position.clone();

    center.y+=1.2;

    const to=
      center.clone()
        .sub(origin);

    const distance=
      to.length();

    if(distance>4)
      continue;

    const projection=
      to.dot(dir);

    if(projection<=0)
      continue;

    const perpendicular=
      to.clone()
        .sub(
          dir.clone()
            .multiplyScalar(
              projection
            )
        )
        .length();

    if(
      perpendicular<1.3
    )
      return b;

  }

  return null;

}

/* ================= ACTION ================= */

let cooldown=0;

function gather(){

  if(
    !gameStarted ||
    !player.alive ||
    cooldown>0
  ) return;

  cooldown=.5;

  const bear=aimBear();

  if(bear){

    hitBear(bear);
    return;

  }

  const resource=
    aimResource();

  if(!resource)
    return;

  resource.hp--;

  if(resource.hp<=0){

    resource.alive=false;

    scene.remove(
      resource.group
    );

    inv[resource.drop]+=
      resource.dropN+
      Math.floor(rand(0,2));

  }else{

    inv[resource.drop]++;

  }

  updateResources();

}

function strike(){

  gather();

}

$("gather").addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    gather();
  }
);

$("hit").addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    strike();
  }
);

/* ================= BEAR DAMAGE ================= */

function damage(amount){

  if(!player.alive)
    return;

  player.hp-=amount;

  updateHealth();

  if(
    player.hp<=0
  ){

    player.hp=0;
    player.alive=false;

    $("death").style.display=
      "flex";

  }

}

function hitBear(bear){

  bear.hp-=18;

  bear.state="chase";

  if(
    bear.hp<=0
  ){

    bear.alive=false;

    bear.group.rotation.z=
      Math.PI/2;

    inv.meat+=3;

    updateResources();

  }

}

/* ================= BEAR AI ================= */

function updateBears(dt){

  for(
    const bear of bears
  ){

    if(!bear.alive)
      continue;

    const p=
      bear.group.position;

    const dx=
      player.pos.x-p.x;

    const dz=
      player.pos.z-p.z;

    const distance=
      Math.hypot(dx,dz);

    if(
      player.alive &&
      distance<14
    ){

      bear.state="chase";

    }else if(
      bear.state==="chase" &&
      distance>28
    ){

      bear.state="wander";

    }

    let speed=0;

    if(
      bear.state==="chase" &&
      player.alive
    ){

      bear.dir=
        Math.atan2(dx,dz);

      speed=
        distance>2.3
          ?3.5
          :0;

      bear.attackCd-=dt;

      if(
        distance<2.6 &&
        bear.attackCd<=0
      ){

        bear.attackCd=1.6;

        damage(16);

      }

    }else{

      bear.timer-=dt;

      if(
        bear.timer<=0
      ){

        bear.timer=
          rand(1.5,4);

        bear.dir=
          rand(0,Math.PI*2);

      }

      speed=1.3;

    }

    if(speed>0){

      const nx=
        p.x+
        Math.sin(bear.dir)*
        speed*dt;

      const nz=
        p.z+
        Math.cos(bear.dir)*
        speed*dt;

      if(
        Math.hypot(nx,nz)<88 &&
        terrainHeight(nx,nz)
          > WATER+.4
      ){

        p.x=nx;
        p.z=nz;

      }

    }

    p.y=
      terrainHeight(
        p.x,
        p.z
      );

    bear.group.rotation.y=
      bear.dir-
      Math.PI/2;

  }

}

$("playButton").addEventListener(

    $("menu").style.display="none";

$("settingsButton").addEventListener(

    $("menu").style.display="none";

    $("settings").style.display=

  }
);

$("backButton").addEventListener(

    $("settings").style.display=

);

/* ================= FPS ================= */

let showFPS=true;

let frames=0;

let fpsTime=
  performance.now();

$("fpsButton").addEventListener(
  "click",
  ()=>{

    showFPS=!showFPS;

    $("fpsStatus").textContent=
      showFPS
        ? "ВКЛ"
        : "ВЫКЛ";

    if(!showFPS){

      $("fps").style.display=
        "none";

    }

  }
);

function updateFPS(){

  frames++;

  const now=
    performance.now();

  if(
    now-fpsTime>=500
  ){

    const value=
      Math.round(
        frames/
        ((now-fpsTime)/1000)
      );

    $("fps").textContent=
      "FPS: "+value;

    if(
      showFPS &&
      gameStarted
    ){

      $("fps").style.display=
        "block";

    }

    frames=0;

    fpsTime=now;

  }

  requestAnimationFrame(
    updateFPS
  );

}

updateFPS();

/* ================= DEATH ================= */

$("respawn").addEventListener(
  "click",
  ()=>{

    $("death").style.display=
      "none";

    for(
      const b of bears
    ){

      b.state="wander";
      b.hp=b.maxHp;

    }

    spawnPlayer();

  }
);

/* ================= GAME LOOP ================= */

const clock=
  new THREE.Clock();

function loop(){

  requestAnimationFrame(loop);

  const dt=
    Math.min(
      .05,
      clock.getDelta()
    );

  if(gameStarted){

    updatePlayer(dt);

    updateBears(dt);

    if(cooldown>0)
      cooldown-=dt;

    water.position.y=
      WATER+
      Math.sin(
        performance.now()*.001
      )*.05;

  }

  renderer.render(
    scene,
    camera
  );

}

loop();
