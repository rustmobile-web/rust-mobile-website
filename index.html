<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7fa650" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Wildland — мобильное 3D-выживание</title>
    <style>
      :root {
        --ui: rgba(18, 20, 16, 0.55);
        --ui-line: rgba(226, 232, 200, 0.32);
        --ink: #eef1e2;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1210;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 10px)
          calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px);
      }
      .panel {
        background: var(--ui);
        border: 1px solid var(--ui-line);
        border-radius: 14px;
        backdrop-filter: blur(6px);
      }
      .top {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .health {
        width: 46vw;
        max-width: 240px;
        padding: 7px 10px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.95;
      }
      .bar {
        height: 9px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.45);
        overflow: hidden;
        margin-top: 5px;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #c2492f, #e0863f);
        transition: width 0.2s ease;
      }
      .stats {
        padding: 7px 10px;
        font-size: 12px;
        line-height: 1.5;
        min-width: 104px;
      }
      .stats b {
        font-weight: 600;
        color: #d9e6a8;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        pointer-events: none;
        opacity: 0.75;
      }
      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: #fff;
        box-shadow: 0 0 3px #000;
      }
      #crosshair::before {
        left: 10px;
        top: 3px;
        width: 2px;
        height: 16px;
      }
      #crosshair::after {
        top: 10px;
        left: 3px;
        height: 2px;
        width: 16px;
      }
      #target {
        position: fixed;
        left: 50%;
        top: calc(50% + 26px);
        transform: translateX(-50%);
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        white-space: nowrap;
      }
      #target .hpline {
        display: block;
        height: 4px;
        margin-top: 4px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }
      #target .hpline i {
        display: block;
        height: 100%;
        background: #9fd05a;
      }
      /* joystick */
      #stick {
        position: fixed;
        left: calc(env(safe-area-inset-left) + 18px);
        bottom: calc(env(safe-area-inset-bottom) + 104px);
        width: 128px;
        height: 128px;
        border-radius: 50%;
        border: 2px solid rgba(230, 240, 200, 0.35);
        background: rgba(10, 14, 10, 0.32);
        pointer-events: auto;
        touch-action: none;
      }
      #stick > i {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 56px;
        height: 56px;
        margin: -28px 0 0 -28px;
        border-radius: 50%;
        background: rgba(226, 236, 196, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.5);
        transition: transform 0.12s ease-out;
      }
      /* action buttons */
      .actions {
        position: fixed;
        right: calc(env(safe-area-inset-right) + 16px);
        bottom: calc(env(safe-area-inset-bottom) + 104px);
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: flex-end;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .btn {
        pointer-events: auto;
        touch-action: none;
        border: 1px solid var(--ui-line);
        background: var(--ui);
        color: var(--ink);
        border-radius: 50%;
        width: 76px;
        height: 76px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        backdrop-filter: blur(6px);
      }
      .btn:active {
        background: rgba(150, 190, 90, 0.45);
        transform: scale(0.95);
      }
      .btn.small {
        width: 60px;
        height: 60px;
        font-size: 11px;
      }
      .btn.big {
        width: 88px;
        height: 88px;
        font-size: 14px;
        background: rgba(120, 160, 70, 0.42);
      }
      .btn[disabled] {
        opacity: 0.35;
      }
      /* hotbar */
      #hotbar {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(env(safe-area-inset-bottom) + 10px);
        display: flex;
        gap: 8px;
        pointer-events: auto;
      }
      .slot {
        width: 58px;
        height: 58px;
        border-radius: 12px;
        border: 2px solid rgba(230, 240, 200, 0.25);
        background: rgba(12, 16, 12, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        pointer-events: auto;
        touch-action: manipulation;
        position: relative;
      }
      .slot span.num {
        position: absolute;
        top: 2px;
        left: 5px;
        font-size: 9px;
        opacity: 0.6;
      }
      .slot span.cnt {
        position: absolute;
        bottom: 2px;
        right: 5px;
        font-size: 10px;
        font-weight: 700;
      }
      .slot.active {
        border-color: #d7e88f;
        background: rgba(120, 150, 70, 0.5);
        box-shadow: 0 0 12px rgba(200, 230, 130, 0.35);
      }
      @media (max-width: 380px) {
        .slot {
          width: 50px;
          height: 50px;
        }
        .btn {
          width: 66px;
          height: 66px;
        }
        .btn.big {
          width: 76px;
          height: 76px;
        }
      }
      /* overlays */
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: 24px;
        z-index: 20;
      }
      #start {
        background: radial-gradient(circle at 50% 30%, #24361f, #0b0f0c 70%);
      }
      #start h1 {
        font-size: 34px;
        margin: 0;
        letter-spacing: 0.16em;
      }
      #start p {
        max-width: 420px;
        opacity: 0.8;
        font-size: 13px;
        line-height: 1.6;
        margin: 0;
      }
      .cta {
        pointer-events: auto;
        border: 1px solid rgba(220, 240, 170, 0.5);
        background: rgba(120, 160, 70, 0.5);
        color: #f2f7e2;
        padding: 16px 34px;
        border-radius: 999px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      #death {
        display: none;
        background: rgba(20, 4, 4, 0.72);
        backdrop-filter: blur(4px);
      }
      #death h2 {
        margin: 0;
        font-size: 40px;
        letter-spacing: 0.18em;
        color: #ff6b57;
        text-shadow: 0 0 26px rgba(255, 60, 40, 0.5);
      }
      #death p {
        margin: 0;
        opacity: 0.85;
      }
      #toast {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(env(safe-area-inset-bottom) + 80px);
        background: rgba(0, 0, 0, 0.55);
        padding: 7px 14px;
        border-radius: 10px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.25s;
      }
      #hurt {
        position: fixed;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 120px rgba(190, 20, 20, 0.85);
        opacity: 0;
        transition: opacity 0.35s;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="hud">
      <div class="top">
        <div class="panel health">
          Здоровье
          <div class="bar"><i id="hpfill"></i></div>
        </div>
        <div class="panel stats">
          Дерево: <b id="cWood">0</b><br />
          Камень: <b id="cStone">0</b><br />
          Железо: <b id="cIron">0</b><br />
          Медь: <b id="cCopper">0</b><br />
          Мясо: <b id="cMeat">0</b>
        </div>
      </div>
      <div id="crosshair"></div>
      <div id="target"><span id="targetName"></span><span class="hpline"><i id="targetHp"></i></span></div>

      <div id="stick"><i id="stickKnob"></i></div>

      <div class="actions">
        <div class="row">
          <button class="btn small" id="btnJump">ПРЫЖОК</button>
          <button class="btn" id="btnHit">УДАР</button>
        </div>
        <div class="row">
          <button class="btn big" id="btnGather">ДОБЫТЬ</button>
        </div>
      </div>

      <div id="hotbar"></div>
      <div id="toast"></div>
    </div>
    <div id="hurt"></div>

    <div class="overlay" id="start">
      <h1>WILDLAND</h1>
      <p>
        Вид от первого лица. Левый круг — движение, правая половина экрана — обзор. Выберите камень в хотбаре,
        добывайте дерево и руду, остерегайтесь медведя.
      </p>
      <button class="cta" id="btnStart">НАЧАТЬ ИГРУ</button>
    </div>

    <div class="overlay" id="death">
      <h2>ВЫ ПОГИБЛИ</h2>
      <p id="deathReason">Вас убил медведь</p>
      <button class="cta" id="btnRespawn">ВОЗРОДИТЬСЯ</button>
    </div>

    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
    </script>
    <script type="module">
      import * as THREE from "three";

      /* ---------------- helpers ---------------- */
      const $ = (id) => document.getElementById(id);
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const rand = (a, b) => a + Math.random() * (b - a);
      const WORLD = 120; // half-size

      function terrainHeight(x, z) {
        const d = Math.sqrt(x * x + z * z);
        let h = Math.sin(x * 0.045) * 2.4 + Math.cos(z * 0.05) * 2.2 + Math.sin((x + z) * 0.021) * 3.4;
        h += Math.sin(x * 0.12) * 0.35 + Math.cos(z * 0.14) * 0.35;
        // river valley along x
        const river = Math.exp(-Math.pow((z - Math.sin(x * 0.03) * 12) / 8, 2)) * 6.5;
        h -= river;
        // island falloff
        h -= Math.max(0, (d - 88) * 0.5);
        return h;
      }
      const WATER_Y = -2.2;

      /* ---------------- renderer ---------------- */
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x9fc0d8);
      scene.fog = new THREE.Fog(0x9fc0d8, 55, 150);

      const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 400);
      const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = false;
      $("app").appendChild(renderer.domElement);
      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x3d4a2a, 1.0));
      const sun = new THREE.DirectionalLight(0xfff0cf, 1.15);
      sun.position.set(40, 70, 25);
      scene.add(sun);

      /* ---------------- terrain ---------------- */
      const segs = 140;
      const gGeo = new THREE.PlaneGeometry(WORLD * 2, WORLD * 2, segs, segs);
      gGeo.rotateX(-Math.PI / 2);
      {
        const p = gGeo.attributes.position;
        const colors = [];
        const cGrass = new THREE.Color(0x5f8f3e);
        const cDry = new THREE.Color(0x8d9a4d);
        const cDirt = new THREE.Color(0x7a6244);
        const cRock = new THREE.Color(0x8a8b86);
        const cSand = new THREE.Color(0xcbbd8d);
        for (let i = 0; i < p.count; i++) {
          const x = p.getX(i),
            z = p.getZ(i);
          const y = terrainHeight(x, z);
          p.setY(i, y);
          let c;
          if (y < WATER_Y + 0.7) c = cSand;
          else if (y > 7) c = cRock;
          else if (y > 4.5) c = cDirt;
          else c = Math.sin(x * 0.05) + Math.cos(z * 0.04) > 0.6 ? cDry : cGrass;
          const j = c.clone().offsetHSL(0, 0, rand(-0.05, 0.05));
          colors.push(j.r, j.g, j.b);
        }
        gGeo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        gGeo.computeVertexNormals();
      }
      scene.add(new THREE.Mesh(gGeo, new THREE.MeshLambertMaterial({ vertexColors: true })));

      const water = new THREE.Mesh(
        new THREE.PlaneGeometry(WORLD * 2.4, WORLD * 2.4),
        new THREE.MeshLambertMaterial({ color: 0x2f6f86, transparent: true, opacity: 0.78 }),
      );
      water.rotation.x = -Math.PI / 2;
      water.position.y = WATER_Y;
      scene.add(water);

      /* ---------------- resources ---------------- */
      const resources = []; // {group, type, hp, maxHp, radius, name, drop}
      const RES_MAT = {
        bark: new THREE.MeshLambertMaterial({ color: 0x6b4b30 }),
        birch: new THREE.MeshLambertMaterial({ color: 0xcfc9b4 }),
        leafA: new THREE.MeshLambertMaterial({ color: 0x3f7a34 }),
        leafB: new THREE.MeshLambertMaterial({ color: 0x5c8a3a }),
        pine: new THREE.MeshLambertMaterial({ color: 0x2f5c33 }),
        rock: new THREE.MeshLambertMaterial({ color: 0x8b8d88, flatShading: true }),
        iron: new THREE.MeshLambertMaterial({ color: 0xa9744a, flatShading: true }),
        copper: new THREE.MeshLambertMaterial({ color: 0x39a08a, flatShading: true }),
        bush: new THREE.MeshLambertMaterial({ color: 0x4a7a35 }),
      };

      function bumpySphere(r, detail, amp) {
        const g = new THREE.IcosahedronGeometry(r, detail);
        const p = g.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const x = p.getX(i),
            y = p.getY(i),
            z = p.getZ(i);
          const n = 1 + (Math.sin(x * 5.1) * Math.cos(y * 4.3) * Math.sin(z * 6.7)) * amp;
          p.setXYZ(i, x * n, y * n, z * n);
        }
        g.computeVertexNormals();
        return g;
      }

      function addResource(group, opts) {
        group.position.y = terrainHeight(group.position.x, group.position.z);
        scene.add(group);
        const r = Object.assign({ group, hp: opts.maxHp, alive: true }, opts);
        resources.push(r);
        return r;
      }

      function makeTree(x, z, kind) {
        const g = new THREE.Group();
        g.position.set(x, 0, z);
        if (kind === 0) {
          // ель
          const t = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.36, 4.2, 6), RES_MAT.bark);
          t.position.y = 2.1;
          g.add(t);
          for (let i = 0; i < 3; i++) {
            const c = new THREE.Mesh(new THREE.ConeGeometry(2.1 - i * 0.5, 2.4, 7), RES_MAT.pine);
            c.position.y = 3.2 + i * 1.35;
            g.add(c);
          }
        } else if (kind === 1) {
          // дуб
          const t = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 3.4, 6), RES_MAT.bark);
          t.position.y = 1.7;
          g.add(t);
          const crown = new THREE.Mesh(bumpySphere(2.2, 1, 0.16), RES_MAT.leafA);
          crown.position.y = 4.3;
          crown.scale.y = 0.8;
          g.add(crown);
        } else {
          // берёза
          const t = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.24, 5, 6), RES_MAT.birch);
          t.position.y = 2.5;
          g.add(t);
          const crown = new THREE.Mesh(bumpySphere(1.6, 1, 0.2), RES_MAT.leafB);
          crown.position.y = 5.2;
          g.add(crown);
        }
        g.scale.setScalar(rand(0.85, 1.25));
        g.rotation.y = rand(0, 6.28);
        return addResource(g, { type: "tree", name: "Дерево", maxHp: 5, radius: 1.1, drop: "wood", dropN: 2 });
      }

      function makeOre(x, z, kind) {
        const g = new THREE.Group();
        g.position.set(x, 0, z);
        const mat = kind === "stone" ? RES_MAT.rock : kind === "iron" ? RES_MAT.iron : RES_MAT.copper;
        const base = new THREE.Mesh(bumpySphere(1.15, 1, 0.28), RES_MAT.rock);
        base.scale.set(1, 0.7, 1);
        base.position.y = 0.5;
        g.add(base);
        if (kind !== "stone") {
          for (let i = 0; i < 5; i++) {
            const n = new THREE.Mesh(bumpySphere(rand(0.22, 0.38), 0, 0.4), mat);
            n.position.set(rand(-0.8, 0.8), rand(0.5, 1.1), rand(-0.8, 0.8));
            g.add(n);
          }
        } else {
          const n = new THREE.Mesh(bumpySphere(0.65, 1, 0.3), RES_MAT.rock);
          n.position.set(rand(-0.4, 0.4), 1.0, rand(-0.4, 0.4));
          g.add(n);
        }
        g.rotation.y = rand(0, 6.28);
        const label = kind === "stone" ? "Камень" : kind === "iron" ? "Железная руда" : "Медная руда";
        return addResource(g, {
          type: "ore",
          name: label,
          maxHp: kind === "stone" ? 4 : 6,
          radius: 1.3,
          drop: kind === "stone" ? "stone" : kind,
          dropN: kind === "stone" ? 3 : 2,
        });
      }

      function makeCliff(x, z) {
        const g = new THREE.Group();
        g.position.set(x, 0, z);
        for (let i = 0; i < 4; i++) {
          const m = new THREE.Mesh(bumpySphere(rand(1.8, 3.4), 1, 0.3), RES_MAT.rock);
          m.position.set(rand(-2, 2), rand(0.5, 2.4), rand(-2, 2));
          m.scale.y = rand(0.8, 1.6);
          g.add(m);
        }
        g.position.y = terrainHeight(x, z);
        scene.add(g);
        return g;
      }

      const bushes = new THREE.Group();
      scene.add(bushes);

      function land(x, z) {
        return terrainHeight(x, z) > WATER_Y + 0.6;
      }
      function scatter(n, fn, minR) {
        let tries = 0;
        let placed = 0;
        while (placed < n && tries < n * 30) {
          tries++;
          const x = rand(-82, 82),
            z = rand(-82, 82);
          if (!land(x, z)) continue;
          if (Math.hypot(x, z) < 8) continue;
          fn(x, z);
          placed++;
        }
      }
      scatter(90, (x, z) => makeTree(x, z, Math.floor(rand(0, 3))));
      scatter(16, (x, z) => makeOre(x, z, "stone"));
      scatter(9, (x, z) => makeOre(x, z, "iron"));
      scatter(7, (x, z) => makeOre(x, z, "copper"));
      scatter(14, (x, z) => {
        const c = makeCliff(x, z);
        if (Math.random() < 0.6) makeOre(x + rand(-5, 5), z + rand(-5, 5), Math.random() < 0.5 ? "iron" : "copper");
      });
      scatter(70, (x, z) => {
        const b = new THREE.Mesh(bumpySphere(rand(0.5, 0.9), 0, 0.35), RES_MAT.bush);
        b.position.set(x, terrainHeight(x, z) + 0.3, z);
        b.scale.y = 0.7;
        bushes.add(b);
      });

      /* ---------------- player ---------------- */
      const player = {
        pos: new THREE.Vector3(0, 0, 6),
        vy: 0,
        onGround: true,
        yaw: 0,
        pitch: 0,
        hp: 100,
        eye: 1.7,
        alive: true,
      };
      const inv = { wood: 0, stone: 0, iron: 0, copper: 0, meat: 0 };

      function spawnPlayer() {
        let x = 0,
          z = 6;
        for (let i = 0; i < 200; i++) {
          const tx = rand(-30, 30),
            tz = rand(-30, 30);
          if (land(tx, tz) && terrainHeight(tx, tz) > WATER_Y + 1.5) {
            let far = true;
            for (const b of bears) if (b.alive && b.group.position.distanceTo(new THREE.Vector3(tx, 0, tz)) < 35) far = false;
            if (far) {
              x = tx;
              z = tz;
              break;
            }
          }
        }
        player.pos.set(x, terrainHeight(x, z), z);
        player.vy = 0;
        player.yaw = 0;
        player.pitch = 0;
        player.hp = 100;
        player.alive = true;
      }

      /* ---------------- viewmodel: рука с камнем ---------------- */
      const viewGroup = new THREE.Group();
      camera.add(viewGroup);
      scene.add(camera);

      const handGroup = new THREE.Group();
      handGroup.position.set(0.055, -0.27, -0.5);
      handGroup.rotation.set(-0.15, -0.25, 0.1);
      handGroup.scale.setScalar(1.15);
      viewGroup.add(handGroup);

      const skin = new THREE.MeshLambertMaterial({ color: 0xc08a62 });
      const sleeve = new THREE.MeshLambertMaterial({ color: 0x4c5a3a });
      const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.095, 0.5, 8), skin);
      forearm.rotation.set(1.15, 0, -0.25);
      forearm.position.set(0.06, -0.2, 0.12);
      handGroup.add(forearm);
      const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.11, 0.16, 8), sleeve);
      cuff.rotation.copy(forearm.rotation);
      cuff.position.set(0.1, -0.36, 0.24);
      handGroup.add(cuff);
      const fist = new THREE.Mesh(bumpySphere(0.1, 1, 0.1), skin);
      fist.position.set(0.0, 0.02, -0.03);
      handGroup.add(fist);
      for (let i = 0; i < 3; i++) {
        const f = new THREE.Mesh(new THREE.CapsuleGeometry(0.026, 0.07, 3, 6), skin);
        f.position.set(-0.055 + i * 0.05, 0.06, -0.08);
        f.rotation.x = 1.2;
        handGroup.add(f);
      }
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0x9a9992, roughness: 0.95, flatShading: true });
      const heldStone = new THREE.Mesh(bumpySphere(0.14, 2, 0.22), stoneMat);
      heldStone.position.set(0, 0.06, -0.05);
      heldStone.rotation.set(0.4, 0.6, 0.2);
      handGroup.add(heldStone);

      /* ---------------- медведи ---------------- */
      const bears = [];
      function makeBear(x, z) {
        const g = new THREE.Group();
        const fur = new THREE.MeshLambertMaterial({ color: 0x4a3626 });
        const dark = new THREE.MeshLambertMaterial({ color: 0x2f2118 });
        const body = new THREE.Mesh(bumpySphere(0.9, 1, 0.1), fur);
        body.scale.set(1.35, 0.9, 0.95);
        body.position.y = 1.15;
        g.add(body);
        const head = new THREE.Group();
        head.position.set(1.3, 1.35, 0);
        const hm = new THREE.Mesh(bumpySphere(0.45, 1, 0.12), fur);
        head.add(hm);
        const snout = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.26, 0.3), dark);
        snout.position.set(0.42, -0.08, 0);
        head.add(snout);
        for (const s of [-1, 1]) {
          const ear = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), fur);
          ear.position.set(-0.1, 0.38, 0.24 * s);
          head.add(ear);
        }
        g.add(head);
        const legs = [];
        for (let i = 0; i < 4; i++) {
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 1.05, 6), fur);
          leg.position.set(i < 2 ? 0.75 : -0.7, 0.52, i % 2 ? 0.45 : -0.45);
          g.add(leg);
          legs.push(leg);
        }
        g.position.set(x, terrainHeight(x, z), z);
        scene.add(g);
        const b = {
          group: g,
          head,
          legs,
          hp: 100,
          maxHp: 100,
          alive: true,
          state: "wander",
          dir: rand(0, 6.28),
          timer: rand(1, 3),
          walk: 0,
          attackCd: 0,
          hurt: 0,
          swing: 0,
        };
        bears.push(b);
        return b;
      }
      makeBear(28, -18);
      makeBear(-34, 26);
      makeBear(45, 40);

      /* ---------------- звук ---------------- */
      let actx = null;
      function sfx(kind) {
        try {
          if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
          const t = actx.currentTime;
          if (kind === "roar") {
            const o = actx.createOscillator(),
              g = actx.createGain();
            o.type = "sawtooth";
            o.frequency.setValueAtTime(110, t);
            o.frequency.exponentialRampToValueAtTime(55, t + 0.5);
            g.gain.setValueAtTime(0.28, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
            o.connect(g).connect(actx.destination);
            o.start(t);
            o.stop(t + 0.62);
            return;
          }
          const len = 0.18;
          const buf = actx.createBuffer(1, actx.sampleRate * len, actx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) {
            d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, kind === "wood" ? 3 : 5);
          }
          const src = actx.createBufferSource();
          src.buffer = buf;
          const f = actx.createBiquadFilter();
          f.type = kind === "wood" ? "lowpass" : "bandpass";
          f.frequency.value = kind === "wood" ? 900 : 2400;
          const g = actx.createGain();
          g.gain.value = 0.35;
          src.connect(f).connect(g).connect(actx.destination);
          src.start();
        } catch (e) {}
      }

      /* ---------------- UI ---------------- */
      const hotbar = $("hotbar");
      const slots = [
        { icon: "🪨", name: "Камень (инструмент)", key: "tool" },
        { icon: "", name: "Пусто" },
        { icon: "", name: "Пусто" },
        { icon: "", name: "Пусто" },
        { icon: "", name: "Пусто" },
      ];
      let activeSlot = 0;
      slots.forEach((s, i) => {
        const el = document.createElement("div");
        el.className = "slot" + (i === 0 ? " active" : "");
        el.innerHTML = `<span class="num">${i + 1}</span><span>${s.icon}</span><span class="cnt" id="slotCnt${i}"></span>`;
        el.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          selectSlot(i);
        });
        hotbar.appendChild(el);
      });
      function selectSlot(i) {
        activeSlot = i;
        [...hotbar.children].forEach((c, k) => c.classList.toggle("active", k === i));
        handGroup.visible = i === 0;
        updateButtons();
      }
      function updateButtons() {
        const has = activeSlot === 0;
        $("btnGather").disabled = !has;
        $("btnHit").disabled = !has;
      }
      function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.style.opacity = 1;
        clearTimeout(t._t);
        t._t = setTimeout(() => (t.style.opacity = 0), 1400);
      }
      function updateInv() {
        $("cWood").textContent = inv.wood;
        $("cStone").textContent = inv.stone;
        $("cIron").textContent = inv.iron;
        $("cCopper").textContent = inv.copper;
        $("cMeat").textContent = inv.meat;
        $("slotCnt0").textContent = inv.stone || "";
      }
      function updateHp() {
        $("hpfill").style.width = clamp(player.hp, 0, 100) + "%";
      }
      selectSlot(0);
      updateInv();
      updateHp();

      /* ---------------- ввод: джойстик + камера ---------------- */
      const move = { x: 0, y: 0 };
      const stickEl = $("stick"),
        knob = $("stickKnob");
      let stickId = null,
        stickCenter = { x: 0, y: 0 };
      const R = 52;

      stickEl.addEventListener(
        "pointerdown",
        (e) => {
          e.preventDefault();
          stickId = e.pointerId;
          const r = stickEl.getBoundingClientRect();
          stickCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
          knob.style.transition = "none";
          handleStick(e);
          stickEl.setPointerCapture(e.pointerId);
        },
        { passive: false },
      );
      function handleStick(e) {
        let dx = e.clientX - stickCenter.x;
        let dy = e.clientY - stickCenter.y;
        const d = Math.hypot(dx, dy);
        if (d > R) {
          dx = (dx / d) * R;
          dy = (dy / d) * R;
        }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        move.x = dx / R; // вправо = +
        move.y = -dy / R; // вверх = вперёд (+)
      }
      stickEl.addEventListener(
        "pointermove",
        (e) => {
          if (e.pointerId !== stickId) return;
          e.preventDefault();
          handleStick(e);
        },
        { passive: false },
      );
      function endStick(e) {
        if (e.pointerId !== stickId) return;
        stickId = null;
        move.x = 0;
        move.y = 0;
        knob.style.transition = "transform 0.15s ease-out";
        knob.style.transform = "translate(0px, 0px)";
      }
      stickEl.addEventListener("pointerup", endStick);
      stickEl.addEventListener("pointercancel", endStick);
      stickEl.addEventListener("pointerleave", endStick);

      // камера: любой палец на правой половине экрана (вне кнопок)
      let lookId = null,
        lastLook = { x: 0, y: 0 };
      const SENS = 0.0032;
      addEventListener(
        "pointerdown",
        (e) => {
          if (!started || !player.alive) return;
          if (e.target.closest("#stick, .btn, .slot, .cta")) return;
          if (e.clientX < innerWidth * 0.42) return;
          lookId = e.pointerId;
          lastLook = { x: e.clientX, y: e.clientY };
        },
        { passive: false },
      );
      addEventListener(
        "pointermove",
        (e) => {
          if (e.pointerId !== lookId) return;
          const dx = e.clientX - lastLook.x;
          const dy = e.clientY - lastLook.y;
          lastLook = { x: e.clientX, y: e.clientY };
          player.yaw -= dx * SENS; // свайп вправо -> камера вправо
          player.pitch = clamp(player.pitch - dy * SENS, -1.396, 1.396); // ±80°
        },
        { passive: false },
      );
      const endLook = (e) => {
        if (e.pointerId === lookId) lookId = null;
      };
      addEventListener("pointerup", endLook);
      addEventListener("pointercancel", endLook);

      // клавиатура (дополнительно)
      const keys = {};
      addEventListener("keydown", (e) => {
        keys[e.code] = true;
        if (e.code === "Space") jump();
        if (/^Digit[1-5]$/.test(e.code)) selectSlot(+e.code.slice(5) - 1);
        if (e.code === "KeyE") gather();
        if (e.code === "KeyF") strike();
      });
      addEventListener("keyup", (e) => (keys[e.code] = false));

      /* ---------------- действия ---------------- */
      let swing = 0,
        swingCd = 0;
      function jump() {
        if (player.onGround && player.alive) {
          player.vy = 6.4;
          player.onGround = false;
        }
      }
      function bindBtn(id, fn) {
        const el = $(id);
        el.addEventListener(
          "pointerdown",
          (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!el.disabled) fn();
          },
          { passive: false },
        );
      }
      bindBtn("btnJump", jump);
      bindBtn("btnGather", () => gather());
      bindBtn("btnHit", () => strike());

      const ray = new THREE.Raycaster();
      ray.far = 4.2;
      function forward() {
        const v = new THREE.Vector3(0, 0, -1);
        v.applyQuaternion(camera.quaternion);
        return v;
      }
      function aimResource() {
        const origin = camera.getWorldPosition(new THREE.Vector3());
        const dir = forward();
        let best = null,
          bestD = 4.2;
        for (const r of resources) {
          if (!r.alive) continue;
          const c = r.group.position.clone();
          c.y += 1.2;
          const to = c.clone().sub(origin);
          const dist = to.length();
          if (dist > bestD + r.radius) continue;
          const proj = to.dot(dir);
          if (proj <= 0) continue;
          const perp = to.clone().sub(dir.clone().multiplyScalar(proj)).length();
          if (perp < r.radius + 0.5 && dist < bestD) {
            best = r;
            bestD = dist;
          }
        }
        return best;
      }
      function aimBear() {
        const origin = camera.getWorldPosition(new THREE.Vector3());
        const dir = forward();
        for (const b of bears) {
          if (!b.alive) continue;
          const c = b.group.position.clone();
          c.y += 1.2;
          const to = c.clone().sub(origin);
          const dist = to.length();
          if (dist > 3.6) continue;
          const proj = to.dot(dir);
          if (proj <= 0) continue;
          const perp = to.clone().sub(dir.clone().multiplyScalar(proj)).length();
          if (perp < 1.3) return b;
        }
        return null;
      }

      const DROP_NAME = { wood: "Древесина", stone: "Камень", iron: "Железо", copper: "Медь", meat: "Мясо" };
      function doSwing() {
        swing = 0.001;
        swingCd = 0.55;
      }
      function gather() {
        if (!player.alive || activeSlot !== 0 || swingCd > 0) return;
        doSwing();
        const r = aimResource();
        if (!r) {
          const b = aimBear();
          if (b) return hitBear(b);
          toast("Слишком далеко — нечего добывать");
          return;
        }
        sfx(r.type === "tree" ? "wood" : "stone");
        r.hp -= 1;
        r.group.position.x += rand(-0.04, 0.04);
        r.group.rotation.z = rand(-0.05, 0.05);
        if (r.hp <= 0) {
          r.alive = false;
          scene.remove(r.group);
          const n = r.dropN + Math.floor(rand(0, 2));
          inv[r.drop] += n;
          toast(`+${n} ${DROP_NAME[r.drop]}`);
          updateInv();
        } else {
          inv[r.drop] += 1;
          updateInv();
          toast(`+1 ${DROP_NAME[r.drop]}`);
        }
      }
      function hitBear(b) {
        b.hp -= 18;
        b.hurt = 0.2;
        b.state = "chase";
        sfx("stone");
        if (b.hp <= 0) {
          b.alive = false;
          b.group.rotation.z = Math.PI / 2.2;
          b.group.position.y -= 0.3;
          inv.meat += 3;
          updateInv();
          toast("Медведь убит: +3 Мясо");
          setTimeout(() => scene.remove(b.group), 8000);
        } else {
          sfx("roar");
          toast("Попадание по медведю");
        }
      }
      function strike() {
        if (!player.alive || activeSlot !== 0 || swingCd > 0) return;
        doSwing();
        const b = aimBear();
        if (b) return hitBear(b);
        const r = aimResource();
        if (r) return gatherHitDirect(r);
        sfx("stone");
      }
      function gatherHitDirect(r) {
        sfx(r.type === "tree" ? "wood" : "stone");
        r.hp -= 1;
        if (r.hp <= 0) {
          r.alive = false;
          scene.remove(r.group);
          inv[r.drop] += r.dropN;
          updateInv();
          toast(`+${r.dropN} ${DROP_NAME[r.drop]}`);
        }
      }

      /* ---------------- смерть ---------------- */
      function damage(amount, reason) {
        if (!player.alive) return;
        player.hp -= amount;
        const h = $("hurt");
        h.style.opacity = 0.9;
        setTimeout(() => (h.style.opacity = 0), 160);
        updateHp();
        if (player.hp <= 0) {
          player.hp = 0;
          player.alive = false;
          updateHp();
          $("deathReason").textContent = reason;
          $("death").style.display = "flex";
        }
      }
      $("btnRespawn").addEventListener("click", () => {
        $("death").style.display = "none";
        spawnPlayer();
        for (const b of bears) b.state = "wander";
        updateHp();
      });

      /* ---------------- запуск ---------------- */
      let started = false;
      $("btnStart").addEventListener("click", async () => {
        started = true;
        $("start").style.display = "none";
        try {
          await document.documentElement.requestFullscreen?.();
        } catch (e) {}
        sfx("stone");
        spawnPlayer();
      });

      /* ---------------- игровой цикл ---------------- */
      const clock = new THREE.Clock();
      let bob = 0;

      function updatePlayer(dt) {
        let mx = move.x,
          mz = move.y;
        if (keys["KeyW"]) mz += 1;
        if (keys["KeyS"]) mz -= 1;
        if (keys["KeyA"]) mx -= 1;
        if (keys["KeyD"]) mx += 1;
        const mag = Math.hypot(mx, mz);
        const speed = 5.2;
        if (mag > 0.06 && player.alive) {
          const nx = mx / Math.max(1, mag),
            nz = mz / Math.max(1, mag);
          const sin = Math.sin(player.yaw),
            cos = Math.cos(player.yaw);
          // forward vector (yaw): (-sin, -cos); right: (cos, -sin)
          const dx = -sin * nz + cos * nx;
          const dz = -cos * nz - sin * nx;
          const nxp = player.pos.x + dx * speed * dt;
          const nzp = player.pos.z + dz * speed * dt;
          if (Math.hypot(nxp, nzp) < 92 && terrainHeight(nxp, nzp) > WATER_Y - 0.8) {
            // столкновения с деревьями/рудой
            let blocked = false;
            for (const r of resources) {
              if (!r.alive) continue;
              if (Math.hypot(nxp - r.group.position.x, nzp - r.group.position.z) < r.radius * 0.55) {
                blocked = true;
                break;
              }
            }
            if (!blocked) {
              player.pos.x = nxp;
              player.pos.z = nzp;
            }
          }
          bob += dt * 9 * Math.min(1, mag);
        }
        // гравитация
        player.vy -= 17 * dt;
        player.pos.y += player.vy * dt;
        const ground = terrainHeight(player.pos.x, player.pos.z);
        if (player.pos.y <= ground) {
          player.pos.y = ground;
          player.vy = 0;
          player.onGround = true;
        }
        const bobY = Math.sin(bob) * 0.045;
        camera.position.set(player.pos.x, player.pos.y + player.eye + bobY, player.pos.z);
        camera.rotation.set(0, 0, 0, "YXZ");
        camera.rotation.order = "YXZ";
        camera.rotation.y = player.yaw;
        camera.rotation.x = player.pitch;

        // анимация руки
        if (swing > 0) {
          swing += dt;
          const t = Math.min(1, swing / 0.35);
          const s = Math.sin(t * Math.PI);
          handGroup.position.set(0.055 - s * 0.03, -0.27 + s * 0.09, -0.5 - s * 0.22);
          handGroup.rotation.set(-0.15 - s * 0.7, -0.25 + s * 0.15, 0.1);
          if (t >= 1) swing = 0;
        } else {
          handGroup.position.set(0.055, -0.27 + Math.sin(bob) * 0.012, -0.5);
          handGroup.rotation.set(-0.15, -0.25 + Math.sin(bob * 0.5) * 0.02, 0.1);
        }
        if (swingCd > 0) swingCd -= dt;
      }

      function updateBears(dt) {
        for (const b of bears) {
          if (!b.alive) continue;
          const p = b.group.position;
          const toP = new THREE.Vector3(player.pos.x - p.x, 0, player.pos.z - p.z);
          const dist = toP.length();
          if (b.hurt > 0) b.hurt -= dt;
          if (player.alive && dist < 14) b.state = "chase";
          else if (b.state === "chase" && dist > 28) b.state = "wander";

          let speed = 0;
          if (b.state === "chase" && player.alive) {
            b.dir = Math.atan2(toP.x, toP.z);
            speed = dist > 2.2 ? 3.6 : 0;
            b.attackCd -= dt;
            if (dist < 2.6 && b.attackCd <= 0) {
              b.attackCd = 1.6;
              b.swing = 0.001;
              sfx("roar");
              damage(16, "Вас убил медведь");
            }
          } else {
            b.timer -= dt;
            if (b.timer <= 0) {
              b.timer = rand(1.5, 4);
              b.dir = rand(0, 6.28);
              b.pause = Math.random() < 0.35;
            }
            speed = b.pause ? 0 : 1.5;
          }

          if (speed > 0) {
            const nx = p.x + Math.sin(b.dir) * speed * dt;
            const nz = p.z + Math.cos(b.dir) * speed * dt;
            if (Math.hypot(nx, nz) < 88 && terrainHeight(nx, nz) > WATER_Y + 0.4) {
              p.x = nx;
              p.z = nz;
            } else {
              b.dir += 2.2;
            }
            b.walk += dt * speed * 2.4;
          }
          p.y = terrainHeight(p.x, p.z);
          b.group.rotation.y = b.dir - Math.PI / 2;
          const sw = Math.sin(b.walk) * 0.5;
          b.legs[0].rotation.x = sw;
          b.legs[1].rotation.x = -sw;
          b.legs[2].rotation.x = -sw;
          b.legs[3].rotation.x = sw;
          if (b.swing > 0) {
            b.swing += dt;
            const t = Math.min(1, b.swing / 0.4);
            b.head.rotation.z = -Math.sin(t * Math.PI) * 0.6;
            b.head.position.x = 1.3 + Math.sin(t * Math.PI) * 0.35;
            if (t >= 1) {
              b.swing = 0;
              b.head.rotation.z = 0;
              b.head.position.x = 1.3;
            }
          } else {
            b.head.rotation.z = Math.sin(b.walk * 0.5) * 0.06;
          }
        }
      }

      const targetEl = $("target");
      function updateTargetUI() {
        let name = null,
          frac = 1;
        const b = aimBear();
        if (b) {
          name = "Медведь";
          frac = b.hp / b.maxHp;
        } else {
          const r = aimResource();
          if (r) {
            name = r.name;
            frac = r.hp / r.maxHp;
          }
        }
        if (name && player.alive) {
          targetEl.style.display = "block";
          $("targetName").textContent = name;
          $("targetHp").style.width = clamp(frac * 100, 0, 100) + "%";
        } else targetEl.style.display = "none";
      }

      let uiTick = 0;
      function loop() {
        requestAnimationFrame(loop);
        const dt = Math.min(0.05, clock.getDelta());
        if (started) {
          updatePlayer(dt);
          updateBears(dt);
          water.position.y = WATER_Y + Math.sin(performance.now() * 0.001) * 0.06;
          uiTick += dt;
          if (uiTick > 0.12) {
            uiTick = 0;
            updateTargetUI();
          }
        } else {
          camera.position.set(0, terrainHeight(0, 6) + 1.7, 6);
          camera.rotation.order = "YXZ";
          camera.rotation.y += 0.0015;
        }
        renderer.render(scene, camera);
      }
      loop();
    </script>
  </body>
</html>
